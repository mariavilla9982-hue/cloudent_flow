name: CloudentFlow stability
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: stability-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.3'
      - name: Verify supported production flows without live credentials
        run: node scripts/test-stability.mjs
