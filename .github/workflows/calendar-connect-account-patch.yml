name: Calendar connect account patch
on:
  push:
    paths:
      - '.github/workflows/calendar-connect-account-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch calendar account connection UI
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text()
          if 'CF_CALENDAR_CONNECT_PATCH_V2' in s:
              raise SystemExit('patch already applied')
          if 'CF_CALENDAR_ACCOUNTS_PATCH_V1' not in s:
              raise SystemExit('calendar accounts v1 patch not found')

          css='''\n/* CF_CALENDAR_CONNECT_PATCH_V2 */\n.calendar-connect-chip{flex:0 0 auto;min-height:44px;padding:0 15px;border:1px dashed #4a4a4a;border-radius:999px;background:#0d0d0d;color:#f5f5f5;font-size:12px;font-weight:900;letter-spacing:.01em;transition:.16s ease}\n.calendar-connect-chip:hover{border-style:solid;border-color:#f2f2f2;background:#f2f2f2;color:#090909;transform:translateY(-1px)}\n.calendar-connect-modal{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.78);display:grid;place-items:center;padding:18px;backdrop-filter:blur(12px)}\n.calendar-connect-card{width:min(460px,100%);border:1px solid #292929;border-radius:22px;background:#0b0b0b;color:#fff;box-shadow:0 28px 80px rgba(0,0,0,.55);overflow:hidden}\n.calendar-connect-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:20px 20px 14px;border-bottom:1px solid #1f1f1f}\n.calendar-connect-head span{display:block;color:#858585;font-size:10px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;margin-bottom:6px}\n.calendar-connect-head h3{margin:0;font-size:18px}.calendar-connect-close{width:34px;height:34px;border:1px solid #2b2b2b;border-radius:50%;background:#111;color:#fff;font-size:20px;line-height:1;cursor:pointer}\n.calendar-connect-body{padding:18px 20px 20px}.calendar-connect-body p{margin:0 0 14px;color:#9b9b9b;font-size:12px;line-height:1.55}.calendar-connect-body input{width:100%;height:46px;border:1px solid #303030;border-radius:12px;background:#111;color:#fff;padding:0 13px;outline:none}.calendar-connect-body input:focus{border-color:#f2f2f2}.calendar-connect-actions{display:flex;gap:9px;justify-content:flex-end;margin-top:14px}.calendar-connect-actions button{min-height:40px;padding:0 14px;border-radius:10px;border:1px solid #303030;background:#151515;color:#fff;font-weight:850}.calendar-connect-actions .primary{background:#f2f2f2;color:#080808;border-color:#f2f2f2}.calendar-connect-meta{display:flex;justify-content:space-between;gap:10px;margin-top:11px;color:#666;font-size:10px}.calendar-connect-meta b{color:#bdbdbd}\n@media(max-width:760px){.calendar-connect-chip{min-height:42px;padding:0 13px}.calendar-connect-modal{align-items:end;padding:10px}.calendar-connect-card{border-radius:22px 22px 14px 14px}.calendar-connect-head{padding:18px 17px 13px}.calendar-connect-body{padding:16px 17px 18px}}\n'''
          s=s.replace('\n</style>\n  <link rel="manifest"', css+'\n</style>\n  <link rel="manifest"', 1)

          new_fn=r'''function calendarAccountSwitcher(){
  const accounts=calendarInstagramAccounts();
  const active=calendarEnsureAccount();
  const chips=accounts.map(a=>{
    const id=calendarAccountId(a),label=String(a.account_label||a.username||"Instagram"),photo=String(a?.config?.profile_picture_url||a?.profile_picture_url||"").trim();
    const avatar=photo?'<img src="'+esc(photo)+'" alt="" referrerpolicy="no-referrer">':'<span class="calendar-account-avatar">'+esc(label.slice(0,1).toUpperCase())+'</span>';
    return '<button class="calendar-account-chip '+(id===active?'active':'')+'" onclick="selectCalendarAccount(\\''+esc(id)+'\\')">'+avatar+'<div><b>@'+esc(label.replace(/^@/,''))+'</b><small>'+(a.enabled===false?'Pausada':'Calendário')+'</small></div></button>';
  }).join('');
  const add=accounts.length<3?'<button class="calendar-connect-chip" onclick="openCalendarInstagramConnect()">＋ Conectar conta</button>':'<button class="calendar-connect-chip" disabled title="Limite atual atingido">3 / 3 contas</button>';
  return '<div class="calendar-account-switcher"><span>Contas</span>'+chips+add+'</div>';
}
function openCalendarInstagramConnect(){
  if(!cloudSession){focusCloudLogin();return}
  const accounts=calendarInstagramAccounts();
  if(accounts.length>=3){toast("O limite atual é de 3 contas do Instagram.","warn");return}
  const host=$("#modalHost");if(!host)return;
  host.innerHTML=`<div class="modal calendar-connect-modal" onclick="if(event.target===this)closeModal()">
    <div class="calendar-connect-card">
      <div class="calendar-connect-head"><div><span>Instagram · ${accounts.length+1}/3</span><h3>Conectar outra conta</h3></div><button class="calendar-connect-close" onclick="closeModal()">×</button></div>
      <div class="calendar-connect-body">
        <p>Conecte uma conta profissional do Instagram usando o access token da Meta. A conta será adicionada sem substituir as que já estão conectadas.</p>
        <input id="calendarInstagramToken" type="password" autocomplete="off" placeholder="Instagram / Meta Access Token" onkeydown="if(event.key==='Enter')connectCalendarInstagramAccount()">
        <div class="calendar-connect-actions"><button onclick="closeModal()">Cancelar</button><button class="primary" id="calendarConnectInstagramBtn" onclick="connectCalendarInstagramAccount()">Conectar conta</button></div>
        <div class="calendar-connect-meta"><span>Calendário separado por conta</span><b>Máx. 3 contas</b></div>
      </div>
    </div>
  </div>`;
  setTimeout(()=>$("#calendarInstagramToken")?.focus(),80);
}
async function connectCalendarInstagramAccount(){
  if(!cloudSession){focusCloudLogin();return}
  const token=$("#calendarInstagramToken")?.value?.trim();
  if(!token){toast("Cole o access token da conta do Instagram.","warn");return}
  const btn=$("#calendarConnectInstagramBtn");
  if(btn){btn.disabled=true;btn.textContent="Conectando..."}
  try{
    const r=await edgeFetch(IG_CONNECT_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({credential:token})});
    await loadPlatformAccounts();
    const connected=r?.platform_account||calendarInstagramAccounts().find(a=>String(a.external_account_id||"")===String(r?.profile?.id||""));
    const id=calendarAccountId(connected);
    if(id){calendarActiveAccountId=id;localStorage.setItem(CALENDAR_ACCOUNT_KEY,id)}
    if(r?.profile){
      instagramIntegration={provider:"instagram",enabled:true,account_label:r.profile?.username||r.profile?.name||"Instagram",external_account_id:r.profile?.id||"",config:{status:"connected",account_type:r.profile?.account_type||null,api_mode:r.mode||"instagram_login",profile_picture_url:r.profile?.profile_picture_url||null,platform_account_id:r?.platform_account?.id||null},last_verified_at:new Date().toISOString()};
    }
    closeModal();
    await syncFromBackend();
    if(currentPage==="calendar")calendarPage();
    toast("@"+String(r?.profile?.username||r?.profile?.name||"Instagram").replace(/^@/,"")+" conectada ao calendário.","ok");
  }catch(e){
    toast(friendlyCloudentError(e?.message||"Não consegui conectar essa conta."),"err");
  }finally{
    if(btn&&document.body.contains(btn)){btn.disabled=false;btn.textContent="Conectar conta"}
  }
}
'''
          pattern=r'function calendarAccountSwitcher\(\)\{.*?\n\}\nasync function selectCalendarAccount\(id\)\{'
          repl=new_fn+'async function selectCalendarAccount(id){'
          s2,n=re.subn(pattern,lambda m:repl,s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit(f'calendarAccountSwitcher replacement count={n}')
          s=s2
          p.write_text(s)

          sw=Path('sw.js')
          w=sw.read_text()
          if 'cloudentflow-pwa-v5' in w:
              w=w.replace('cloudentflow-pwa-v5','cloudentflow-pwa-v6',1)
          elif 'cloudentflow-pwa-v6' not in w:
              raise SystemExit('unexpected service worker cache version')
          sw.write_text(w)
          PY
      - name: Commit patch
        run: |
          git config user.name "cloudentflow-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/calendar-connect-account-patch.yml
          git add index.html sw.js
          git commit -m "Add account connection from calendar"
          git push origin HEAD:main
