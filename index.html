function aiFormat(n){return Number(n||0).toLocaleString("pt-BR")}
function buildCloudentAIResponse(question){
  const q=String(question||"").toLowerCase().trim();
  const d=cloudentAISnapshot();
  const bestTime=d.recs[0]?String(d.recs[0].recommended_time).slice(0,5):null;
  const bestCaption=d.best?.caption?String(d.best.caption).replace(/\s+/g," ").slice(0,90):"Sem legenda";
  const engagement=d.totals.reach?((d.totals.likes+d.totals.comments+d.totals.shares+d.totals.saves)/d.totals.reach*100):0;
  const next=d.future[0];

  if(/hor[aá]rio|quando.*post|melhor.*hora|postar/.test(q)){
    if(!bestTime)return "Ainda não tenho recomendação suficiente para hoje. O Smart Scheduler precisa de mais amostras reais antes de eu confiar em um horário.";
    const r=d.recs[0];
    return `Hoje, o horário mais forte nos dados atuais é ${bestTime}, com ${r.confidence}% de confiança. ${d.recs[1]?"A segunda opção é "+String(d.recs[1].recommended_time).slice(0,5)+".":""} Eu usaria isso como referência, não como garantia de views.`;
  }
  if(/seguidor|crescimento|crescer/.test(q)){
    if(!d.followers)return "Ainda não recebi a contagem atual de seguidores.";
    return `A conta está com ${aiFormat(d.followers)} seguidores. Hoje o monitor registrou ${d.followerDelta>=0?"+":""}${d.followerDelta}. O rastreador consulta a conta a cada minuto, então mudanças aparecem automaticamente no CloudentFlow.`;
  }
  if(/melhor.*reel|melhor.*v[ií]deo|mais views|viral|vencedor/.test(q)){
    if(!d.best)return "Ainda não tenho Reels carregados para comparar.";
    return `O Reel com mais views entre os dados carregados tem ${aiFormat(d.best.views)} views e ${aiFormat(d.best.likes)} curtidas. A legenda começa com: “${bestCaption}”. Posso usar esse vídeo como referência para comparar horário, alcance e engajamento com os demais.`;
  }
  if(/calend[aá]rio|pr[oó]ximo.*post|agenda|fila/.test(q)){
    if(!d.future.length)return "Não há publicações futuras na fila agora.";
    return `Existem ${d.future.length} posts futuros. O próximo é “${next.name||"Vídeo"}” em ${fmtDateTime(next.scheduledAt)}. ${next.smartMode==="auto"?"Esse horário foi otimizado pelo Smart Scheduler.":"Esse horário está marcado como manual."}`;
  }
  if(/status|worker|autom[aá]t|funcionando|online/.test(q)){
    return `Publicação 24/7: ${d.pub?.online?"online":"sem confirmação recente"}. Métricas + Scheduler: ${d.aut?.online?"online":"sem confirmação recente"}. Há ${d.future.length} posts futuros na fila.`;
  }
  if(/engaj|curtida|coment|salv|compart/.test(q)){
    return `Nos dados carregados: ${aiFormat(d.totals.likes)} curtidas, ${aiFormat(d.totals.comments)} comentários, ${aiFormat(d.totals.shares)} compartilhamentos e ${aiFormat(d.totals.saves)} salvamentos. O engajamento agregado sobre alcance está em aproximadamente ${engagement.toFixed(2).replace(".",",")}%. Esse número é uma leitura simples do conjunto, não uma previsão.`;
  }
  if(/o que.*fa[çc]o|recomenda|melhorar|views|insight|resumo/.test(q)){
    const parts=[];
    if(bestTime)parts.push(`Seu melhor horário estimado hoje é ${bestTime}`);
    if(d.best)parts.push(`seu Reel líder tem ${aiFormat(d.best.views)} views`);
    if(d.followers)parts.push(`a conta está com ${aiFormat(d.followers)} seguidores (${d.followerDelta>=0?"+":""}${d.followerDelta} hoje)`);
    if(d.future.length)parts.push(`há ${d.future.length} posts futuros já preparados`);
    return (parts.length?parts.join(". ")+". ":"Ainda há poucos dados para um resumo completo. ")+"Eu priorizaria repetir padrões dos Reels que já performaram melhor e testar os horários sugeridos pelo Scheduler, comparando resultado por alguns dias.";
  }

  return `Consigo analisar agora: melhores horários, seguidores, melhor Reel, engajamento, próximos posts e status da automação. Como este é o Beta local, perguntas muito abertas ainda são respondidas com base nesses dados estruturados. Depois podemos conectar um modelo de IA para conversa livre.`;
}
function sendCloudentAI(prefill=null){
  ensureCloudentAIIntro();
  const input=$("#cloudentAIInput");
  const text=String(prefill??input?.value??"").trim();
  if(!text)return;
  cloudentAIHistory.push({role:"user",text});
  cloudentAIHistory.push({role:"assistant",text:buildCloudentAIResponse(text)});
  cloudentAIHistory=cloudentAIHistory.slice(-30);
  saveCloudentAIHistory();
  if(input)input.value="";
  cloudentAIPage();
  setTimeout(()=>{const box=$("#cloudentAIChat");if(box)box.scrollTop=box.scrollHeight},20);
}
function cloudentAIKeydown(e){
  if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendCloudentAI()}
}
function cloudentAIPage(){
  ensureCloudentAIIntro();
  const d=cloudentAISnapshot();
  const bestTime=d.recs[0]?String(d.recs[0].recommended_time).slice(0,5):"—";
  const bestViews=d.best?aiFormat(d.best.views):"—";
  const followers=d.followers?aiFormat(d.followers):"—";

  $("#cloudentAI").innerHTML=`
    <div class="ui3-page-head ai-page-head">
      <div><span class="ui3-eyebrow">BETA</span><h2>Cloudent AI</h2><p>Seu copiloto para entender métricas, horários, seguidores e calendário.</p></div>
      <div class="ai-beta-badge"><i></i><span>Análise local</span></div>
    </div>

    <div class="ai-snapshot-grid">
      <button onclick="sendCloudentAI('Qual é o melhor horário para postar hoje?')"><small>MELHOR HORÁRIO</small><b>${bestTime}</b><span>Perguntar sobre horário →</span></button>
      <button onclick="sendCloudentAI('Como estão meus seguidores hoje?')"><small>SEGUIDORES</small><b>${followers}</b><span>${d.followerDelta>=0?"+":""}${d.followerDelta} hoje →</span></button>
      <button onclick="sendCloudentAI('Qual foi meu melhor Reel?')"><small>TOP REEL</small><b>${bestViews}</b><span>views no líder →</span></button>
      <button onclick="sendCloudentAI('Como está minha automação?')"><small>AUTOMAÇÃO</small><b>${d.pub?.online&&d.aut?.online?"ONLINE":"VERIFICAR"}</b><span>Status dos workers →</span></button>
    </div>

    <div class="ai-layout">
      <div class="card ai-chat-card">
        <div class="ai-chat-head">
          <div><span class="ai-orb">✦</span><div><b>Cloudent AI</b><small>Dados do seu próprio CloudentFlow</small></div></div>
          <button class="btn btn-sm" onclick="clearCloudentAI()">Limpar conversa</button>
        </div>
        <div id="cloudentAIChat" class="ai-chat">
          ${cloudentAIHistory.map(m=>`<div class="ai-msg ${m.role}"><div class="ai-msg-avatar">${m.role==="assistant"?"✦":"V"}</div><div><span>${m.role==="assistant"?"Cloudent AI":"Você"}</span><p>${esc(m.text)}</p></div></div>`).join("")}
        </div>
        <div class="ai-quick-prompts">
          <button onclick="sendCloudentAI('O que eu devo fazer para melhorar minhas views?')">Como melhorar views?</button>
          <button onclick="sendCloudentAI('Qual é o melhor horário para postar hoje?')">Melhor horário</button>
          <button onclick="sendCloudentAI('Qual foi meu melhor Reel?')">Melhor Reel</button>
          <button onclick="sendCloudentAI('Como estão meus seguidores hoje?')">Seguidores hoje</button>
        </div>
        <div class="ai-composer">
          <textarea id="cloudentAIInput" rows="1" placeholder="Pergunte sobre seus dados…" onkeydown="cloudentAIKeydown(event)"></textarea>
          <button onclick="sendCloudentAI()" title="Enviar">↑</button>
        </div>
      </div>

      <aside class="card ai-context-card">
        <div class="ui3-panel-head"><div><span>Contexto</span><h3>O que ela consegue ler</h3></div></div>
        <div class="ai-context-list">
          <div><i class="${liveInstagramMetrics.length?"on":""}"></i><span><b>Métricas dos Reels</b><small>${liveInstagramMetrics.length} conteúdos carregados</small></span></div>
          <div><i class="${d.followers?"on":""}"></i><span><b>Seguidores</b><small>monitoramento automático</small></span></div>
          <div><i class="${d.recs.length?"on":""}"></i><span><b>Smart Scheduler</b><small>${d.recs.length} horários de hoje</small></span></div>
          <div><i class="${d.future.length?"on":""}"></i><span><b>Calendário</b><small>${d.future.length} posts futuros</small></span></div>
          <div><i class="${d.pub?.online&&d.aut?.online?"on":""}"></i><span><b>Automação</b><small>workers 24/7</small></span></div>
        </div>
        <div class="ai-beta-note"><b>Modo Beta</b><p>Essa versão analisa os dados localmente. A próxima evolução é conectar um modelo de IA externo para respostas livres, mantendo esses dados como contexto.</p></div>
      </aside>
    </div>
  `;
}

function settings(){
  const user=cloudSession?.user,ig=instagramIntegration;
  const rh=productionData?.integration||{},rhCfg=rh.config||{},rhWorker=productionData?.worker,rhStatus=productionData?.runninghubStatus||{};
  const rhMapped=!!(rhCfg.workflowId&&rhCfg.videoNodeId&&rhCfg.frameNodeId);
  const rhReady=!!(rh.enabled&&rhMapped&&rhCfg.apiKeyConfigured);
  const a=automationData||{settings:{},workers:[]};
  const cfg=a.settings?.automation||{},smart=a.settings?.smart_scheduler||{};
  const tabs=[["general","Geral"],["integrations","Integrações"],["automation","Automação"],["logs","Logs"]];
  let body="";

  if(settingsTab==="general"){
    body=`<div class="ui3-settings-grid">
      <div class="card ui3-panel" id="cloudAuthCard"><div class="ui3-panel-head"><div><span>Conta</span><h3>CloudentFlow</h3></div><span class="status-pill ${user?"ok":"warn"}">${user?"Conectado":"Login"}</span></div>
        ${user?`<div class="ui3-account"><b>${esc(user.email||"Conta conectada")}</b><span>Sincronização com o backend ativa.</span><button class="btn danger btn-sm" onclick="signOutCloud()">Sair</button></div>`:`<div class="auth-card"><input id="authEmail" type="email" placeholder="Email"><input id="authPassword" type="password" placeholder="Senha"><div class="toolbar"><button class="btn primary" onclick="signInCloud()">Entrar</button><button class="btn" onclick="signUpCloud()">Criar conta</button></div></div>`}
      </div>
      <div class="card ui3-panel"><div class="ui3-panel-head"><div><span>Workspace</span><h3>Preferências principais</h3></div></div>
        <div class="ui3-info-rows"><div><span>Posts por dia</span><b>${a.settings?.posts_per_day||5}</b></div><div><span>Intervalo mínimo</span><b>${a.settings?.min_gap_minutes||60} min</b></div><div><span>Fuso</span><b>${a.settings?.timezone||"America/Recife"}</b></div></div>
      </div>
    </div>`;
  }else if(settingsTab==="integrations"){
    body=`<div class="ui3-settings-grid">
      <div class="card ui3-panel"><div class="ui3-panel-head"><div><span>Instagram</span><h3>${ig?.enabled?"@"+esc(ig.account_label||"Instagram"):"Conectar conta"}</h3></div><span class="status-pill ${ig?.enabled?"ok":"warn"}">${ig?.enabled?"Conectado":"Pendente"}</span></div>
        ${ig?.enabled?`<p class="muted">Publicação e métricas autorizadas.</p><div class="toolbar"><button class="btn" onclick="loadInstagramStatus().then(renderAll)">Revalidar</button><button class="btn primary" onclick="syncInstagramToday()">Sincronizar métricas</button></div>`:`<div class="auth-card"><p class="muted">Cole seu Instagram User Access Token.</p><input id="instagramToken" type="password" autocomplete="off" placeholder="Access Token"><button class="btn primary" id="connectInstagramBtn" onclick="connectInstagram()">Conectar Instagram</button></div>`}
      </div>

      <div class="card ui3-panel"><div class="ui3-panel-head"><div><span>Backend</span><h3>Supabase</h3></div><span class="status-pill ${backendOnline?"ok":"warn"}">${backendOnline?"Online":"Desconectado"}</span></div><p class="muted">Banco, Storage, workers e automações 24/7.</p></div>

      <div class="card ui3-panel runninghub-settings-card">
        <div class="ui3-panel-head">
          <div><span>Produção IA</span><h3>RunningHub</h3></div>
          <span class="status-pill ${rhReady?"ok":"warn"}">${rhReady?"Configurado":"Configurar"}</span>
        </div>

        <div class="runninghub-settings-intro runninghub-settings-intro-4">
          <div><b>Créditos</b><span class="rh-credit-number">${Number.isFinite(Number(rhStatus.credits))?Number(rhStatus.credits).toLocaleString("pt-BR"):"—"}</span></div>
          <div><b>Load Video</b><span>Node #336 · vídeo original</span></div>
          <div><b>Reference Image</b><span>Node #338 · frame da modelo</span></div>
          <div><b>Worker</b><span>${rhWorker?.online?"Online 24/7":"Aguardando"}</span></div>
        </div>

        <div class="ui31-toggle-row compact">
          <div><b>Produção automática</b><span>Quando ativa, o worker pega os jobs da fila sozinho.</span></div>
          <label class="modern-toggle"><input id="settingsRhEnabled" type="checkbox" ${rh.enabled?"checked":""}><span></span></label>
        </div>

        <div class="runninghub-settings-grid">
          <div class="field full">
            <label>API Key do RunningHub</label>
            <input id="settingsRhApiKey" type="password" autocomplete="off" placeholder="${rhCfg.apiKeyConfigured?"API Key já salva — cole outra somente para trocar":"Cole sua API Key"}">
            <small>${rhCfg.apiKeyConfigured?"✓ Chave salva de forma criptografada no backend.":"A chave nunca fica exposta no frontend."}</small>
          </div>

          <div class="field full">
            <label>Workflow ID</label>
            <input id="settingsRhWorkflow" value="${esc(rhCfg.workflowId||"")}" placeholder="ID/API do seu workflow">
          </div>

          <div class="field">
            <label>Node do vídeo</label>
            <input id="settingsRhVideoNode" value="${esc(rhCfg.videoNodeId||"336")}" readonly>
            <small>Load Video</small>
          </div>
          <div class="field">
            <label>Campo do vídeo</label>
            <input id="settingsRhVideoField" value="${esc(rhCfg.videoFieldName||"video")}">
          </div>

          <div class="field">
            <label>Node do frame</label>
            <input id="settingsRhFrameNode" value="${esc(rhCfg.frameNodeId||"338")}" readonly>
            <small>Load Reference Image</small>
          </div>
          <div class="field">
            <label>Campo do frame</label>
            <input id="settingsRhFrameField" value="${esc(rhCfg.frameFieldName||"image")}">
          </div>

          <div class="field full">
            <label>Vídeos processando ao mesmo tempo</label>
            <select id="settingsRhConcurrency">
              ${[1,2,3,4,5].map(n=>`<option value="${n}" ${Number(rhCfg.concurrency||1)===n?"selected":""}>${n} por vez</option>`).join("")}
            </select>
          </div>
        </div>

        <div class="runninghub-settings-actions">
          <button class="btn primary" onclick="saveRunningHubConfig()">Salvar integração</button>
          <button class="btn success" onclick="testRunningHubConfig()">✓ Testar</button>
          <button class="btn success" onclick="controlRunningHub('run')">▶ Executar fila</button>
          <button class="btn" onclick="controlRunningHub('pause')">Ⅱ Pausar</button>
          <button class="btn" onclick="showPage('production')">Abrir Produção IA</button>
        </div>
        <div id="rhTestResult" class="runninghub-test-result">
          <b>Teste de conexão</b>
          <span>Clique em “Testar RunningHub” para validar API Key, Workflow e os nodes 336/338 sem gerar vídeo.</span>
        </div>
      </div>
    </div>`;
  }else if(settingsTab==="automation"){
    body=`<div class="card ui3-panel"><div class="ui3-panel-head"><div><span>Automação</span><h3>Resumo</h3></div><button class="btn" onclick="showPage('automation')">Abrir painel completo</button></div>
      <div class="ui3-info-rows"><div><span>Publicação 24/7</span><b>Ativa</b></div><div><span>Coleta automática</span><b>30m · 2h · 6h · 24h · 48h</b></div><div><span>Calendário automático</span><b>${cfg.autoOptimizeCalendar!==false?"Ativo":"Pausado"}</b></div><div><span>Smart Scheduler</span><b>${smart.enabled!==false?"Ativo":"Pausado"}</b></div></div>
    </div>`;
  }else{
    body=`<div class="card ui3-panel"><div class="ui3-panel-head"><div><span>Sistema</span><h3>Logs recentes</h3></div><button class="btn" onclick="loadServerLogs().then(settings)">↻ Atualizar</button></div>
      <div class="ui3-logs">${serverLogs.length?serverLogs.slice(0,60).map(l=>`<div class="${l.level}"><span>${new Date(l.created_at).toLocaleString("pt-BR")}</span><b>${esc(l.message)}</b><small>${esc(l.event_type)}</small></div>`).join(""):'<div class="ui3-empty">Nenhum log carregado.</div>'}</div>
    </div>`;
  }

  $("#settings").innerHTML=`
    <div class="ui3-page-head"><div><span class="ui3-eyebrow">SETTINGS</span><h2>Configurações</h2><p>Organizado só com o que importa.</p></div></div>
    <div class="ui3-tabs">${tabs.map(t=>`<button class="${settingsTab===t[0]?"active":""}" onclick="setSettingsTab('${t[0]}')">${t[1]}</button>`).join("")}</div>
    ${body}`;
}
function safeRenderPage(id,fn){
  try{fn()}
  catch(err){
    console.error("CloudentFlow render error:",id,err);
    const el=$("#"+id);
    if(el)el.innerHTML=`<div class="card"><div class="empty-state-v2"><b>Não consegui carregar esta área.</b><span>${esc(err?.message||"Erro inesperado")}</span><button class="btn btn-sm" onclick="renderAll()">Tentar novamente</button></div></div>`;
  }
}
function renderAll(){
  safeRenderPage("overview",overview);
  safeRenderPage("calendar",calendarPage);
  safeRenderPage("production",productionPage);
  safeRenderPage("frameExtractor",frameExtractorPage);
  safeRenderPage("metrics",metrics);
  if(currentReelDetail)safeRenderPage("reelDetail",reelDetailPage);
  safeRenderPage("smartTimes",smartTimesPage);
  safeRenderPage("automation",automationPage);
  safeRenderPage("cloudentAI",cloudentAIPage);
  safeRenderPage("settings",settings);
  const side=$("#sidebarAccount"),stat=$("#sidebarAccountStatus");
  if(side)side.textContent=instagramIntegration?.enabled?"@"+(instagramIntegration.account_label||"Instagram"):"Instagram";
  if(stat)stat.textContent=instagramIntegration?.enabled?"Conta conectada":"Configurar integração";
  updateLiveChrome();
}

async function init(){
  applySidebarState();
  nav();
  bindSidebarHover();
  renderAll();
  document.body.classList.add("booting");
  openDB().catch(err=>console.warn("IndexedDB unavailable:",err));

  const bootFailsafe=setTimeout(()=>{
    if(!cloudLoading)return;
    cloudLoading=false;
    document.body.classList.remove("booting");
    renderAll();
  },5500);

  try{
    await withTimeout(initCloud(),6000,"inicialização");
  }catch(err){
    console.warn("Cloud boot continued in background:",err);
  }finally{
    clearTimeout(bootFailsafe);
    cloudLoading=false;
    document.body.classList.remove("booting");
    renderAll();
  }

  loadDeferredCloudData();

  const quickPicker=$("#videoPicker");
  if(quickPicker)quickPicker.onchange=()=>handleQuickSlotVideo(quickPicker);

  const newVideoBtn=$("#newVideoBtn");
  if(newVideoBtn)newVideoBtn.onclick=()=>{
    showPage("calendar");
    setTimeout(openScheduleModal,0);
  };

  document.addEventListener("keydown",e=>{
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();openCommandPalette()}
    if(e.key==="Escape"){closeCommandPalette();if($("#activityPanelHost")?.classList.contains("open"))toggleActivityPanel()}
  });
  setInterval(()=>{if(cloudSession&&!document.hidden)refreshLiveData(false)},60000);
}

init();
</script>
</body>
</html>
