<title>CloudentFlow — Content Automation SaaS</title>
<style>
:root{
  --bg:#080808;--panel:#111111;--panel2:#141414;--line:#2b2b2b;--muted:#9297a7;
  --text:#f7f8fb;--pink:#6c6c6c;--pink2:#6f6f6f;--green:#43d38a;--yellow:#f6c85f;--red:#ff7070;
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 84% 0,#0f0f0f 0,transparent 31%),var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input,select,textarea{font:inherit} button{cursor:pointer} button:disabled{opacity:.45;cursor:not-allowed}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;background:#0a0a0a;border-right:1px solid var(--line);padding:20px 16px}
.brand{display:flex;gap:10px;align-items:center;font-size:20px;font-weight:900;margin-bottom:25px}
.logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--pink),var(--pink2));box-shadow:0 8px 25px #ff3f7f40}
.nav button{width:100%;display:flex;gap:12px;align-items:center;border:0;background:transparent;color:#9297a7;border-radius:10px;padding:12px 14px;margin:4px 0;text-align:left}
.nav button.active{color:white;background:linear-gradient(90deg,#151515,#111111);border-left:3px solid var(--pink)}
.sidebar-foot{position:absolute;bottom:18px;left:16px;right:16px}
.mode{padding:10px;border-radius:9px;background:#0d1a14;border:1px solid #244032;color:#69e1a0;font-weight:800;margin-bottom:12px}
.main{min-width:0;padding:34px 42px 70px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px}.kicker{font-size:11px;letter-spacing:.12em;color:#9095a5;font-weight:800}
h1{font-size:36px;margin:5px 0 24px} h2{font-size:20px;margin:0 0 14px} h3{font-size:15px;margin:0}
.btn{border:1px solid var(--line);background:#181818;color:#fff;border-radius:10px;padding:10px 14px;font-weight:800}
.btn.primary{border:0;background:linear-gradient(135deg,var(--pink),#6e6e6e);box-shadow:0 8px 22px #ff3f7f2a}
.btn.ghost{background:transparent}.btn.danger{background:#210e0e;border-color:#5c2525;color:#ff9292}.btn.success{background:#0d1b14;border-color:#285039;color:#7ce0a9}
.card{background:linear-gradient(180deg,#131313,#101010);border:1px solid var(--line);border-radius:16px;padding:20px}
.banner{border:1px solid #6b5220;background:#1d180d;color:#ffd770;padding:13px 16px;border-radius:11px;margin-bottom:22px}
.muted{color:var(--muted)}.note{font-size:12px;color:#8c91a0}.hidden{display:none!important}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.metric .num{font-size:30px;font-weight:900;margin:8px 0 3px}.metric .label{color:#a8adbc;font-weight:700}
.section-head{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:16px}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
input,select,textarea{background:#0d0d0d;border:1px solid #303030;color:white;border-radius:10px;padding:10px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--pink)}
.badge{display:inline-flex;align-items:center;gap:6px;border:1px solid #353535;border-radius:999px;padding:5px 8px;font-size:12px;font-weight:800}
.badge.green{color:#79e2ab;background:#0b1b13;border-color:#244d34}.badge.yellow{color:#ffd873;background:#211a0a;border-color:#56451d}.badge.red{color:#ff9797;background:#210e0e;border-color:#5c2525}.badge.gray{color:#bac0cf;background:#171717}
.stage-board{display:grid;gap:8px}.stage-row{display:flex;gap:10px;padding:9px 10px;background:#0d0d0d;border-radius:9px}

/* Calendar */
.calendar-wrap{max-width:1320px}
.calendar-top{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:12px}
.calendar-top .left{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.field label{display:block;color:#a7acba;font-size:12px;font-weight:800;margin-bottom:6px}
.week-grid{display:grid;grid-template-columns:repeat(5,minmax(180px,1fr));gap:10px;align-items:start}
.day-column{border:1px solid var(--line);border-radius:14px;background:#101010;padding:14px;min-height:390px}
.day-column.weekend{grid-column:auto}.day-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.day-name{font-weight:900}.count{font-size:11px;border:1px solid #343434;border-radius:999px;padding:3px 7px}
.day-slots{display:grid;gap:8px}
.slot{min-height:70px;border:1px dashed #404040;border-radius:10px;padding:9px 10px;background:#0e0e0e;transition:.18s}
.slot.empty{display:flex;align-items:center;gap:8px;color:#dde0e8;font-size:12px;font-weight:800;cursor:pointer}.slot.empty:hover{border-color:var(--pink);background:#0f0f0f}
.slot.filled{border-style:solid;border-left:3px solid var(--pink);position:relative}
.slot-line{display:flex;justify-content:space-between;gap:8px;align-items:center}.slot-title{font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:145px}
.slot-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px;color:#a8adba;font-size:11px}.slot-actions{display:flex;gap:5px;margin-top:8px}.slot-actions .btn{padding:6px 8px;font-size:11px}
.slot-time{width:74px;padding:5px 7px;font-size:11px}
.calendar-bottom{display:grid;grid-template-columns:repeat(2,minmax(180px,1fr));gap:10px;margin-top:10px;max-width:516px}
.drag{border-color:var(--pink)!important;background:#101010!important}
.day-drop{min-height:20px}
.week-summary{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0 16px}
.summary-chip{padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#0e0e0e;color:#b7bcc9;font-size:12px}

/* Comments AI */
.comments-layout{display:grid;grid-template-columns:minmax(300px,.75fr) minmax(0,1.45fr);gap:16px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}.field textarea{width:100%;min-height:105px;resize:vertical}
.counter-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.counter{padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#0d0d0d}
.comment-list{display:grid;gap:10px}.comment-card{border:1px solid var(--line);border-radius:13px;padding:13px;background:#0e0e0e}.comment-top{display:flex;justify-content:space-between;gap:10px}.user{font-weight:900}.comment-text{margin:7px 0 10px}.comment-actions{display:flex;gap:7px;flex-wrap:wrap}.draft{margin-top:10px;border-left:3px solid var(--pink);padding:9px 10px;background:#0e0e0e;border-radius:8px}
.liked{color:#9d9d9d;border-color:#393939!important}.reply-selected{border-color:#6c6c6c!important;background:#101010!important}
.api-warning{padding:11px 12px;border:1px solid #65491e;border-radius:10px;background:#1b150a;color:#f5cc70;margin-top:12px}
.switch{display:flex;align-items:center;gap:9px}.toggle{width:48px;height:26px;border-radius:999px;background:#333;position:relative}.toggle:after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;background:white;top:3px;left:4px;transition:.2s}.toggle.on{background:var(--green)}.toggle.on:after{left:24px}
.rule-box{padding:10px;border:1px solid var(--line);border-radius:10px;background:#0d0d0d;margin-top:10px}
.reply-preview{font-style:italic;color:#e3c8d3}


/* Smart Scheduler — Stage 4 */
.smart-hero{display:grid;grid-template-columns:1.2fr .8fr;gap:16px;margin-bottom:16px}
.smart-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.smart-stat{padding:15px;border:1px solid var(--line);border-radius:13px;background:#0d0d0d}
.smart-stat .value{font-size:28px;font-weight:950;margin:5px 0}
.smart-controls{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:14px}
.smart-controls input,.smart-controls select{width:100%}
.smart-week{display:grid;grid-template-columns:repeat(7,minmax(145px,1fr));gap:9px}
.smart-day{border:1px solid var(--line);border-radius:13px;background:#0d0d0d;padding:12px;min-height:160px}
.smart-day-title{font-weight:900;margin-bottom:8px}
.smart-time{display:flex;justify-content:space-between;gap:6px;align-items:center;padding:6px 7px;margin:5px 0;border-radius:8px;background:#171717;font-size:12px}
.smart-time.test{border-left:3px solid var(--yellow)}
.smart-time.best{border-left:3px solid var(--green)}
.rank-table{width:100%;border-collapse:collapse}
.rank-table th,.rank-table td{padding:10px;border-bottom:1px solid #262626;text-align:left}
.rank-table th{color:#aeb3c3;font-size:12px}
.scorebar{height:8px;background:#1e1e1e;border-radius:999px;overflow:hidden;min-width:100px}
.scorebar>span{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--pink2));border-radius:999px}
.confidence{font-size:11px;font-weight:900;padding:4px 7px;border-radius:999px;background:#152018;color:#79e2ab;border:1px solid #29543a}
.reason-list{display:grid;gap:8px;margin-top:12px}
.reason{padding:10px 12px;border-radius:10px;background:#0d0d0d;border:1px solid var(--line)}
.sample-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.sample-grid .field input{width:100%}
.source-pill{display:inline-flex;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:900;background:#1d180d;border:1px solid #6b5220;color:#ffd770}
.smart-alert{padding:11px 12px;border-radius:10px;border:1px solid #29543a;background:#0d1812;color:#8be0b0}
@media(max-width:1200px){.smart-week{grid-template-columns:repeat(4,1fr)}.smart-controls,.sample-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:850px){.smart-hero{grid-template-columns:1fr}.smart-grid{grid-template-columns:repeat(2,1fr)}.smart-week{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.smart-grid,.smart-controls,.sample-grid,.smart-week{grid-template-columns:1fr}}


/* Stage 5 backend */
.backend-pill{display:inline-flex;align-items:center;gap:7px;padding:6px 9px;border-radius:999px;border:1px solid #353535;font-size:12px;font-weight:900}
.backend-pill.online{color:#79e2ab;background:#0b1b13;border-color:#244d34}
.backend-pill.offline{color:#ffcf70;background:#211a0a;border-color:#56451d}
.auth-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.auth-card{padding:14px;border:1px solid var(--line);border-radius:12px;background:#0d0d0d}
.auth-card input{width:100%;margin-top:8px}
.cloud-note{padding:10px 12px;border-radius:10px;background:#101010;border:1px solid #343434;color:#d4d4d4;margin-top:10px}


/* SaaS polish */
:root{
  --bg:#080808;--panel:#111111;--panel2:#171717;--line:#2a2a2a;--muted:#8f97aa;
  --text:#f8f9fc;--pink:#6a6a6a;--pink2:#737373;--green:#43d38a;--yellow:#f6c85f;--red:#ff7070;
  --blue:#a2a2a2;--shadow:0 20px 60px rgba(0,0,0,.28);
}
body{background:
  radial-gradient(circle at 78% -10%,rgba(115,115,115,.13),transparent 28%),
  radial-gradient(circle at 25% 0,rgba(106,106,106,.09),transparent 26%),
  var(--bg)}
.app{grid-template-columns:258px minmax(0,1fr)}
.sidebar{background:rgba(10,10,10,.94);backdrop-filter:blur(18px);padding:22px 16px;border-right:1px solid rgba(255,255,255,.07)}
.brand{font-size:19px;margin:2px 7px 26px}
.logo{width:38px;height:38px;border-radius:12px;box-shadow:0 10px 32px rgba(106,106,106,.24)}
.nav button{font-weight:750;padding:12px 13px;border:1px solid transparent;transition:.16s ease}
.nav button:hover{background:#151515;color:#fff;border-color:#292929}
.nav button.active{background:linear-gradient(90deg,rgba(106,106,106,.13),rgba(115,115,115,.07));border:1px solid rgba(106,106,106,.18);border-left:3px solid var(--pink)}
.sidebar-foot{padding-top:14px;border-top:1px solid rgba(255,255,255,.06)}
.mode{display:inline-flex;width:auto;padding:7px 9px;border-radius:999px;font-size:11px}
.main{padding:0 38px 70px;max-width:1600px;width:100%;margin:0 auto}
.topbar{position:sticky;top:0;z-index:25;margin:0 -12px 26px;padding:24px 12px 14px;background:linear-gradient(180deg,rgba(8,8,8,.97) 70%,rgba(8,8,8,.72));backdrop-filter:blur(18px)}
.topbar h1{font-size:30px;letter-spacing:-.04em;margin-bottom:0}
.top-actions{display:flex;align-items:center;gap:10px}
.top-status{display:inline-flex;align-items:center;gap:7px;border:1px solid #2f2f2f;background:#121212;padding:9px 11px;border-radius:999px;color:#aab4c7;font-size:12px;font-weight:800}
.status-dot{width:7px;height:7px;border-radius:999px;background:var(--green);box-shadow:0 0 0 4px rgba(67,211,138,.09)}
.btn{transition:.16s ease;box-shadow:none}
.btn:hover{transform:translateY(-1px);border-color:#424242}
.btn.primary{background:linear-gradient(135deg,#6a6a6a,#6c6c6c);box-shadow:0 10px 26px rgba(106,106,106,.2)}
.card{background:linear-gradient(180deg,rgba(22,22,22,.96),rgba(16,16,16,.96));border-color:rgba(255,255,255,.075);box-shadow:0 14px 38px rgba(0,0,0,.12)}
.saas-hero{position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(320px,.7fr);gap:24px;padding:28px;margin-bottom:18px;border:1px solid rgba(255,255,255,.08);border-radius:20px;background:
 linear-gradient(135deg,rgba(106,106,106,.08),rgba(115,115,115,.05) 45%,rgba(162,162,162,.04)),
 #101010;box-shadow:var(--shadow)}
.saas-hero:after{content:"";position:absolute;width:300px;height:300px;border-radius:50%;right:-120px;top:-150px;background:radial-gradient(circle,rgba(115,115,115,.22),transparent 68%);pointer-events:none}
.hero-copy{position:relative;z-index:1}
.hero-badge{display:inline-flex;align-items:center;gap:7px;padding:6px 9px;border-radius:999px;background:#171717;border:1px solid #313131;color:#bac3d3;font-size:11px;font-weight:850;margin-bottom:14px}
.hero-title{font-size:34px;line-height:1.05;letter-spacing:-.045em;margin:0 0 12px;max-width:760px}
.hero-sub{font-size:14px;color:#9ba4b7;max-width:690px;margin:0 0 20px}
.hero-actions{display:flex;gap:9px;flex-wrap:wrap}
.hero-panel{position:relative;z-index:1;display:grid;gap:10px;align-content:start}
.health-item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 13px;border:1px solid #2a2a2a;border-radius:12px;background:rgba(10,10,10,.62)}
.health-item b{font-size:12px}.health-item span{font-size:11px}
.integration-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}
.integration-card{padding:16px;border:1px solid #2b2b2b;border-radius:14px;background:#0e0e0e}
.integration-top{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:10px}
.integration-icon{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:#191919;border:1px solid #313131}
.integration-card h3{font-size:13px;margin:0}.integration-card p{font-size:11px;color:#8f97aa;margin:5px 0 0}
.kpi-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{padding:17px}.kpi-head{display:flex;justify-content:space-between;align-items:center;color:#a8afbf;font-size:12px}.kpi-value{font-size:29px;font-weight:950;letter-spacing:-.04em;margin:9px 0 4px}.kpi-delta{font-size:11px;color:#7fdca8}
.workspace-grid{display:grid;grid-template-columns:1.35fr .65fr;gap:16px}
.mini-list{display:grid;gap:8px}.mini-row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:11px 12px;border:1px solid #282828;border-radius:11px;background:#0e0e0e}
.mini-row strong{font-size:12px}.mini-row span{font-size:11px;color:#929aad}
.section-label{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:#7f879a;font-weight:900;margin-bottom:8px}
.setup-steps{display:grid;gap:10px}.setup-step{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}.setup-num{width:25px;height:25px;border-radius:8px;display:grid;place-items:center;background:#1a1a1a;border:1px solid #313131;font-size:11px;font-weight:900;color:#dce1ea}
.setup-step b{font-size:12px}.setup-step div div{font-size:11px;color:#8f97aa;margin-top:3px}
.integration-status{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:900;padding:5px 7px;border-radius:999px}
.integration-status.ok{color:#76dfa6;background:#0e1d15;border:1px solid #27513a}
.integration-status.pending{color:#ffd36f;background:#211a0d;border:1px solid #5b4922}
@media(max-width:1100px){.saas-hero,.workspace-grid{grid-template-columns:1fr}.kpi-grid,.integration-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:650px){.main{padding:0 14px 50px}.topbar{padding-top:18px}.top-status{display:none}.saas-hero{padding:20px}.hero-title{font-size:28px}.kpi-grid,.integration-grid{grid-template-columns:1fr}}

/* misc */
.log{font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;background:#0b0b0b;border:1px solid var(--line);border-radius:12px;padding:12px;max-height:250px;overflow:auto}.log div{padding:5px 0;border-bottom:1px dashed #202020}.ok{color:#66db9c}.warn{color:#f5ca67}.err{color:#ff8080}
.modal{position:fixed;inset:0;background:#000c;display:grid;place-items:center;z-index:90;padding:20px}.modal-box{width:min(760px,96vw);background:#0f0f0f;border:1px solid #353535;border-radius:16px;padding:16px}.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.modal video{width:100%;max-height:65vh;border-radius:10px;background:#000}

@media(max-width:850px){.app{grid-template-columns:1fr}.sidebar{position:relative;height:auto}.sidebar-foot{position:static;margin-top:20px}.main{padding:22px}.grid4{grid-template-columns:repeat(2,1fr)}.week-grid{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.grid4,.week-grid,.formgrid{grid-template-columns:1fr}.calendar-bottom{grid-template-columns:1fr}}

/* Reel previews + Stage 8 test publishing */
.reel-metric-card{display:grid;grid-template-columns:170px minmax(0,1fr);gap:16px;border:1px solid var(--line);background:#0f0f0f;border-radius:14px;padding:12px}
.reel-media{width:170px;aspect-ratio:9/16;border-radius:11px;overflow:hidden;background:#060606;border:1px solid #2b2b2b;position:relative}
.reel-media video,.reel-media img{width:100%;height:100%;object-fit:cover;display:block}
.reel-media .no-preview{height:100%;display:grid;place-items:center;color:#737b8e;font-size:12px;text-align:center;padding:14px}
.reel-info{min-width:0;display:flex;flex-direction:column;gap:10px}
.reel-title{font-weight:900;font-size:14px;line-height:1.35}
.reel-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.test-reel-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px}
.test-drop{border:1px dashed #424242;border-radius:14px;background:#0e0e0e;padding:18px}
.test-preview{width:100%;max-height:520px;aspect-ratio:9/16;background:#060606;border-radius:13px;object-fit:contain;border:1px solid #2b2b2b}
.test-status{padding:11px 12px;border-radius:10px;background:#0e0e0e;border:1px solid #313131;margin-top:12px;font-size:12px}
.test-status.ok{border-color:#28583b;color:#85e3ae;background:#0d1812}
.test-status.warn{border-color:#6a5220;color:#ffd36f;background:#1c160a}
.test-status.err{border-color:#363636;color:#ff8a91;background:#141414}
.publish-history{display:grid;gap:8px}
.publish-history .row{display:flex;justify-content:space-between;gap:10px;padding:10px 11px;border:1px solid #2b2b2b;border-radius:10px;background:#0e0e0e}
@media(max-width:900px){.test-reel-grid{grid-template-columns:1fr}.reel-metric-card{grid-template-columns:110px minmax(0,1fr)}.reel-media{width:110px}}
@media(max-width:560px){.reel-metric-card{grid-template-columns:1fr}.reel-media{width:100%;max-height:420px}}

/* ===== CloudentFlow UI v2 ===== */
:root{
  --bg:#090909;
  --surface:#0f0f0f;
  --surface-2:#141414;
  --surface-3:#191919;
  --line:#242424;
  --line-soft:#1b1b1b;
  --text:#f5f6f8;
  --muted:#8b92a1;
  --muted-2:#646b79;
  --accent:#6c6c6c;
  --accent-soft:rgba(108,108,108,.12);
  --green:#4dd48b;
  --yellow:#f2c45c;
  --red:#ff6b72;
  --radius:12px;
  --shadow:0 16px 50px rgba(0,0,0,.22);
}
html{background:var(--bg)}
body{background:var(--bg);font-size:13px;letter-spacing:-.005em}
.app{grid-template-columns:228px minmax(0,1fr)}
.sidebar{padding:18px 12px;background:#0a0a0a;border-right:1px solid var(--line-soft)}
.brand{padding:0 9px;margin:0 0 18px;font-size:18px;letter-spacing:-.03em}
.brand .logo{width:32px;height:32px;border-radius:9px;background:#f6f6f7;color:#0c0c0c;box-shadow:none;font-size:13px;font-weight:950}
.brand-accent{color:var(--accent)}

/* ===== Button motion polish ===== */
@keyframes ctfPrimarySheen{
  0%{transform:translateX(-140%)}
  55%,100%{transform:translateX(180%)}
}
@keyframes ctfPulseRing{
  0%,100%{box-shadow:0 0 0 0 rgba(108,108,108,.00)}
  50%{box-shadow:0 0 0 5px rgba(108,108,108,.06)}
}
button,.btn,.nav button,.quick-actions button,.more-popover button{
  -webkit-tap-highlight-color:transparent;
  transform:translateZ(0);
  transition:
    transform .18s cubic-bezier(.2,.8,.2,1),
    background-color .18s ease,
    border-color .18s ease,
    color .18s ease,
    box-shadow .18s ease,
    opacity .18s ease;
}
button:not(:disabled):hover,
.btn:not(:disabled):hover{
  transform:translateY(-1px);
}
button:not(:disabled):active,
.btn:not(:disabled):active{
  transform:translateY(0) scale(.975);
  transition-duration:.08s;
}
.btn.primary{
  position:relative;
  overflow:hidden;
  isolation:isolate;
  box-shadow:0 7px 18px rgba(108,108,108,.14);
}
.btn.primary::after{
  content:"";
  position:absolute;
  inset:-35% auto -35% -30%;
  width:34%;
  pointer-events:none;
  z-index:-1;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent);
  transform:skewX(-18deg) translateX(-140%);
}
.btn.primary:not(:disabled):hover{
  box-shadow:0 10px 24px rgba(108,108,108,.22);
}
.btn.primary:not(:disabled):hover::after{
  animation:ctfPrimarySheen .9s cubic-bezier(.2,.7,.2,1);
}
.btn.primary:not(:disabled):focus-visible{
  outline:none;
  animation:ctfPulseRing 1.6s ease-in-out infinite;
}
.btn.danger:not(:disabled):hover{
  box-shadow:0 8px 20px rgba(255,107,114,.12);
}
.btn.success:not(:disabled):hover{
  box-shadow:0 8px 20px rgba(77,212,139,.10);
}
.nav button{
  position:relative;
  overflow:hidden;
}
.nav button::after{
  content:"";
  position:absolute;
  left:10px;
  right:10px;
  bottom:4px;
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.10),transparent);
  opacity:0;
  transform:scaleX(.45);
  transition:opacity .18s ease,transform .18s ease;
}
.nav button:hover{
  transform:translateX(2px);
}
.nav button:hover::after{
  opacity:1;
  transform:scaleX(1);
}
.nav button.active{
  transform:none;
}
.nav button .nav-icon{
  transition:transform .18s cubic-bezier(.2,.8,.2,1),color .18s ease;
}
.nav button:hover .nav-icon{
  transform:scale(1.12) rotate(-2deg);
}
.quick-actions button:hover{
  transform:translateY(-2px);
  border-color:#3a3a3a;
  box-shadow:0 10px 24px rgba(0,0,0,.16);
}
.quick-actions button:active{
  transform:translateY(0) scale(.985);
}
.quick-actions button>span{
  transition:transform .18s cubic-bezier(.2,.8,.2,1),background-color .18s ease;
}
.quick-actions button:hover>span{
  transform:scale(1.08);
  background:#202020;
}
.more-menu[open] > summary{
  transform:scale(.97);
  background:#1d1d1d;
}
.more-popover{
  transform-origin:top right;
  animation:ctfMenuIn .14s ease-out;
}
@keyframes ctfMenuIn{
  from{opacity:0;transform:translateY(-4px) scale(.985)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
.more-popover button:hover{
  transform:translateX(2px);
}
.top-actions .btn.primary{
  animation:none;
}
button:disabled,.btn:disabled{
  transform:none!important;
  box-shadow:none!important;
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.001ms!important;
    animation-iteration-count:1!important;
    scroll-behavior:auto!important;
    transition-duration:.001ms!important;
  }
}

/* ===== Professional login gate ===== */
body.auth-locked{overflow:hidden}
body.auth-locked .app{display:none!important}
body.auth-checking{overflow:hidden;background:#080808}
body.auth-checking .app,body.auth-checking .login-gate{display:none!important}
.auth-boot{display:none;position:fixed;inset:0;z-index:21000;place-items:center;background:
  radial-gradient(circle at 50% 42%,rgba(97,97,97,.12),transparent 28%),
  linear-gradient(135deg,#070707,#0a0a0a)}
body.auth-checking .auth-boot{display:grid}
.auth-boot-inner{display:grid;justify-items:center;gap:12px;color:#dcd8e3}
.auth-boot-mark{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;background:linear-gradient(145deg,#848484,#505050);font-size:18px;font-weight:950;box-shadow:0 12px 34px rgba(98,98,98,.24)}
.auth-boot-name{font-size:10px;font-weight:900;letter-spacing:.01em}
.auth-boot-bar{width:92px;height:2px;overflow:hidden;border-radius:999px;background:#1d1d1d}
.auth-boot-bar i{display:block;width:38%;height:100%;background:#727272;border-radius:999px;animation:authBoot 1.05s ease-in-out infinite}
@keyframes authBoot{0%{transform:translateX(-110%)}50%{transform:translateX(165%)}100%{transform:translateX(330%)}}
.login-gate{position:fixed;inset:0;z-index:20000;display:grid;place-items:center;padding:28px;background:
  radial-gradient(circle at 18% 18%,rgba(97,97,97,.18),transparent 34%),
  radial-gradient(circle at 82% 72%,rgba(66,66,66,.14),transparent 31%),
  linear-gradient(135deg,#060606 0%,#0a0a0a 52%,#070707 100%);overflow:auto}
.login-gate.hidden{display:none}
.login-shell{width:min(1040px,100%);min-height:610px;display:grid;grid-template-columns:1.08fr .92fr;border:1px solid #282828;border-radius:24px;overflow:hidden;background:rgba(11,11,11,.96);box-shadow:0 34px 110px rgba(0,0,0,.58),0 0 0 1px rgba(255,255,255,.018)}
.login-visual{position:relative;padding:52px;display:flex;flex-direction:column;justify-content:space-between;min-height:610px;background:
  linear-gradient(145deg,rgba(15,15,15,.96),rgba(9,9,9,.98)),
  radial-gradient(circle at 20% 10%,rgba(129,129,129,.24),transparent 34%);border-right:1px solid #222222;overflow:hidden}
.login-visual:before{content:"";position:absolute;width:360px;height:360px;border:1px solid rgba(134,134,134,.1);border-radius:50%;right:-170px;top:-130px;box-shadow:0 0 0 55px rgba(111,111,111,.025),0 0 0 110px rgba(111,111,111,.018)}
.login-visual:after{content:"";position:absolute;inset:auto 40px 40px auto;width:170px;height:170px;background:linear-gradient(135deg,rgba(144,144,144,.09),transparent);transform:rotate(45deg);border:1px solid rgba(144,144,144,.08);border-radius:28px}
.login-brand,.login-hero,.login-proof{position:relative;z-index:1}
.login-brand{display:flex;align-items:center;gap:12px}.login-brand-mark{width:38px;height:38px;display:grid;place-items:center;border-radius:11px;background:linear-gradient(145deg,#848484,#505050);color:white;font-size:17px;font-weight:950;box-shadow:0 10px 30px rgba(98,98,98,.25)}
.login-brand-copy b,.login-brand-copy span{display:block}.login-brand-copy b{font-size:14px;letter-spacing:-.02em}.login-brand-copy span{margin-top:2px;font-size:7px;color:#777e8a;letter-spacing:.09em;text-transform:uppercase;font-weight:850}
.login-kicker{display:inline-flex;align-items:center;gap:7px;width:max-content;padding:6px 8px;border:1px solid #2d2d2d;border-radius:999px;background:#0e0e0e;color:#959595;font-size:7px;font-weight:950;letter-spacing:.12em;text-transform:uppercase}
.login-kicker i{width:5px;height:5px;border-radius:50%;background:#727272;box-shadow:0 0 12px #727272}
.login-hero h1{max-width:520px;margin:17px 0 13px;font-size:36px;line-height:1.05;letter-spacing:-.045em;color:#f2f0f6}.login-hero p{max-width:480px;margin:0;color:#7d8490;font-size:11px;line-height:1.75}
.login-proof{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.login-proof>div{padding:12px;border:1px solid #25232b;border-radius:11px;background:rgba(10,10,10,.72)}.login-proof strong,.login-proof span{display:block}.login-proof strong{font-size:8px;color:#d7d0df}.login-proof span{margin-top:4px;font-size:6.7px;color:#69717e;line-height:1.45}
.login-panel{padding:48px;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#0c0c0c,#0a0a0a)}
.login-card{width:min(380px,100%)}.login-card-top{margin-bottom:27px}.login-card-top span{display:block;font-size:7px;color:#6c6c6c;font-weight:950;letter-spacing:.11em;text-transform:uppercase}.login-card-top h2{margin:7px 0 7px;font-size:25px;letter-spacing:-.035em;color:#f1eff4}.login-card-top p{margin:0;color:#6f7782;font-size:9px;line-height:1.55}
.login-form{display:grid;gap:14px}.login-field label{display:block;margin-bottom:7px;color:#aeb4be;font-size:7.5px;font-weight:850}.login-input-wrap{position:relative}.login-input-wrap input{width:100%;height:46px;border:1px solid #2d2d2d;border-radius:10px;background:#0e0e0e;color:#edf0f4;padding:0 13px;font-size:10px;outline:none;transition:.18s border-color,.18s box-shadow,.18s background}.login-input-wrap input::placeholder{color:#4d535d}.login-input-wrap input:focus{border-color:#5a5a5a;background:#0f0f0f;box-shadow:0 0 0 3px rgba(93,93,93,.11)}
.login-input-wrap.password input{padding-right:44px}.login-eye{position:absolute;right:7px;top:50%;transform:translateY(-50%);width:32px;height:32px;border:0;border-radius:8px;background:transparent;color:#707987;cursor:pointer;font-size:11px}.login-eye:hover{background:#191919;color:#b9b9b9}
.login-submit{height:46px;border:1px solid #636363;border-radius:10px;background:linear-gradient(180deg,#727272,#575757);color:#fff;font-size:9px;font-weight:950;letter-spacing:.02em;cursor:pointer;box-shadow:0 12px 30px rgba(75,75,75,.2);transition:.18s transform,.18s filter,.18s opacity}.login-submit:hover{filter:brightness(1.08);transform:translateY(-1px)}.login-submit:disabled{opacity:.6;cursor:wait;transform:none}
.login-message{min-height:18px;margin-top:-4px;padding:0 2px;font-size:7.5px;line-height:1.45;color:#7f8894}.login-message.error{color:#ff838d}.login-message.ok{color:#70d59b}
.login-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:20px;padding-top:16px;border-top:1px solid #202020;color:#59616d;font-size:6.8px}.login-meta span{display:flex;align-items:center;gap:6px}.login-meta i{width:5px;height:5px;border-radius:50%;background:#59c98c;box-shadow:0 0 10px rgba(89,201,140,.55)}
.login-mini{margin-top:18px;padding:11px 12px;border:1px solid #272727;border-radius:9px;background:#0e0e0e;color:#6a727e;font-size:7px;line-height:1.55}.login-mini b{color:#aeb5c0}
@media(max-width:820px){.login-gate{padding:0}.login-shell{min-height:100vh;border:0;border-radius:0;grid-template-columns:1fr}.login-visual{display:none}.login-panel{min-height:100vh;padding:28px 20px}.login-card{max-width:420px}.login-card-top h2{font-size:27px}}

async function confirmEditSchedule(oldDate,oldSlot,button=null){

  const newDate=$("#editDay").value,newTime=$("#editTime").value,newCaption=$("#editCaption").value,newStatus=$("#editStatus").value,file=$("#editFile").files[0];
  const movingDay=newDate!==oldDate;
  let targetSlot=oldSlot;
  if(movingDay){
    const free=firstFreeSlot(newDate);
    if(free<0){toast("O novo dia atingiu o limite de vídeos.","warn");return}
    targetSlot=free;
  }
  const valid=validateSchedule(newDate,newTime,movingDay?null:oldKey);
  if(!valid.ok){toast(valid.msg,"warn");return}
  actionButtonBusy(button,true,"Salvando…");

  if(file){
    if(x.cloud){actionButtonBusy(button,false);toast("Para trocar o arquivo, remova este agendamento e envie o novo vídeo. Dia, hora e legenda podem ser editados normalmente.","warn");return}
    await dbDelete(x.videoId);
    const id=crypto.randomUUID();
    await dbPut({id,name:file.name,size:file.size,type:file.type,blob:file,added:new Date().toISOString()});
    x.videoId=id;x.name=file.name;x.size=file.size;x.type=file.type;
  }
  const manualTimeChange=newTime!==x.time || movingDay;
  x.time=newTime;x.caption=newCaption;x.status=newStatus;
  if(manualTimeChange){
    // A manual time/date edit must stay where the user put it.
    x.smartMode="manual";
    x.smartStrategy="manual";
    x.smartStrategyLocked=true;
  }
  const [h,m]=newTime.split(":").map(Number),at=new Date(newDate+"T00:00:00");at.setHours(h,m,0,0);x.scheduledAt=at.toISOString();
  if(movingDay){delete state.slots[oldKey];state.slots[keyFor(newDate,targetSlot)]=x}
  try{
    await syncQueue(true);
    await syncFromBackend();
    closeModal();
    renderAll();
    toast("Agendamento salvo para "+newDate+" às "+newTime+".","ok");
  }catch(e){
    await syncFromBackend().catch(()=>{});
    renderAll();
    toast("Não consegui salvar o horário: "+friendlyCloudentError(e?.message||"erro"),"err");
  }finally{
    if(button&&document.body.contains(button))actionButtonBusy(button,false);
  }
}

function aggregateMetricsByDay(rows){
  const map=new Map();
  for(const m of rows){
    const d=new Date(m.timestamp);
    const key=metricsDateKey(m.timestamp);if(!key)continue;
    const cur=map.get(key)||{date:key,views:0,reach:0,likes:0,saves:0,count:0};
    cur.views+=+m.views||0;cur.reach+=+m.reach||0;cur.likes+=+m.likes||0;cur.saves+=+m.saves||0;cur.count++;
    map.set(key,cur);
  }
  return [...map.values()].sort((a,b)=>a.date.localeCompare(b.date));
}
function analyticsChart(rows,metric="views"){

  const max=Math.max(1,...data.map(x=>Number(x[metric]||0)));
  const total=data.reduce((sum,x)=>sum+Number(x[metric]||0),0);
  const avg=Math.round(total/Math.max(1,data.length));
  const best=[...data].sort((a,b)=>Number(b[metric]||0)-Number(a[metric]||0))[0];
  return `<div class="analytics-bar-board">
    <div class="analytics-bar-summary">
      <div><small>MÉDIA / DIA COM REELS</small><b>${avg.toLocaleString("pt-BR")}</b><span>${label}</span></div>
      <div><small>MELHOR DIA</small><b>${Number(best?.[metric]||0).toLocaleString("pt-BR")}</b><span>${best?new Date(best.date+"T12:00:00").toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"}):"—"}</span></div>
      <div><small>JANELA VISÍVEL</small><b>${data.length}</b><span>${all.length>14?"últimos 14 dias":"dias com dados"}</span></div>
    </div>
    <div class="analytics-bar-scroll"><div class="analytics-bar-grid">
      ${data.map((m,i)=>{
        const value=Number(m[metric]||0);
        const prev=i?Number(data[i-1][metric]||0):null;
        const delta=prev?Math.round((value-prev)/prev*100):null;
        const h=Math.max(7,Math.round(value/max*100));
        return `<div class="analytics-bar-col" title="${value.toLocaleString("pt-BR")} ${label} · ${m.count} Reel(s)">
          <b>${calendarCompactNumber(value)}</b>
          <div class="analytics-bar-track"><i style="height:${h}%"></i></div>
          <span>${new Date(m.date+"T12:00:00").toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"})}</span>
          <small class="${delta===null?"neutral":delta>=0?"positive":"negative"}">${delta===null?"base":(delta>=0?"+":"")+delta+"%"}</small>

function followerChart(stats){
  const all=(stats?.daily||[]).map(x=>({...x,value:Number(x.current_count||0),delta:Number(x.net_change||0)}));
  if(!all.length)return '<div class="follower-chart-empty"><b>Monitoramento iniciado.</b><span>O histórico diário começa a ser formado a partir de agora.</span></div>';
  const data=all.slice(-14);
  const maxDelta=Math.max(1,...data.map(x=>Math.abs(x.delta)));
  const totalDelta=data.reduce((a,x)=>a+x.delta,0);
  const positiveDays=data.filter(x=>x.delta>0).length;
  const best=[...data].sort((a,b)=>b.delta-a.delta)[0]||null;
  return `<div class="follower-growth-board">
    <div class="follower-growth-summary">
      <div><small>SALDO DO PERÍODO</small><b class="${totalDelta>=0?"positive":"negative"}">${totalDelta>=0?"+":""}${totalDelta}</b><span>seguidores</span></div>
      <div><small>DIAS POSITIVOS</small><b>${positiveDays}/${data.length}</b><span>últimos dias medidos</span></div>
      <div><small>MELHOR DIA</small><b>${best&&best.delta>0?"+"+best.delta:"—"}</b><span>${best?new Date(best.day+"T12:00:00").toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"}):"—"}</span></div>

    <div class="follower-growth-scroll"><div class="follower-growth-grid">
      ${data.map((m,i)=>{

          <small>${new Date(m.day+"T12:00:00").toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"})}</small>

}

function reelTimelineLabel(snapshot,publishedAt){
  if(!publishedAt)return new Date(snapshot.collected_at).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
  const mins=Math.max(0,Math.round((new Date(snapshot.collected_at)-new Date(publishedAt))/60000));
  if(mins<60)return mins+" min";
  if(mins<1440)return Math.round(mins/60)+" h";
  return Math.round(mins/1440)+" d";
}
function reelEvolutionChart(snaps=[],publishedAt=null){
  if(!snaps.length)return '<div class="reel-detail-empty">Ainda não existem leituras desse Reel.</div>';
  const maxViews=Math.max(1,...snaps.map(x=>Number(x.views||0)));
  let peakVelocity=0,previousVelocity=null;
  const stages=snaps.map((s,i)=>{
    const views=Number(s.views||0);
    const prev=i?snaps[i-1]:null;
    const delta=prev?Math.max(0,views-Number(prev.views||0)):views;
    let velocity=null;
    if(prev){
      const hours=(new Date(s.collected_at)-new Date(prev.collected_at))/3600000;
      if(Number.isFinite(hours)&&hours>0)velocity=delta/hours;
    }
    if(Number.isFinite(velocity))peakVelocity=Math.max(peakVelocity,velocity);
    let state="base",stateLabel=i===0?"Primeira leitura":"Crescendo";
    if(i>0&&Number.isFinite(velocity)&&Number.isFinite(previousVelocity)){
      if(velocity>previousVelocity*1.2){state="fast";stateLabel="Acelerou"}
      else if(velocity<previousVelocity*.72){state="slow";stateLabel="Desacelerou"}
      else {state="steady";stateLabel="Estável"}
    }else if(i>0&&Number.isFinite(velocity)){state="steady";stateLabel="Ritmo inicial"}
    if(Number.isFinite(velocity))previousVelocity=velocity;
    return {s,views,delta,velocity,state,stateLabel,pct:Math.max(5,Math.round(views/maxViews*100))};
  });
  const latest=stages[stages.length-1];
  const totalGrowth=latest.views-Number(stages[0]?.views||0);
  return `<div class="reel-growth-board">
    <div class="reel-growth-summary">
      <div><small>GANHO DESDE A 1ª LEITURA</small><b>+${Math.max(0,totalGrowth).toLocaleString("pt-BR")}</b><span>views</span></div>
      <div><small>PICO DE VELOCIDADE</small><b>${peakVelocity?calendarCompactNumber(Math.round(peakVelocity))+"/h":"—"}</b><span>maior ritmo medido</span></div>
      <div><small>RITMO MAIS RECENTE</small><b>${Number.isFinite(latest.velocity)?calendarCompactNumber(Math.round(latest.velocity))+"/h":"—"}</b><span>${latest.stateLabel}</span></div>
    </div>
    <div class="reel-growth-stages">
      ${stages.map((x,i)=>`<div class="reel-growth-stage ${x.state}">
        <div class="reel-growth-stage-top"><b>${reelTimelineLabel(x.s,publishedAt)}</b><span>${x.stateLabel}</span></div>
        <strong>${x.views.toLocaleString("pt-BR")} views</strong>
        <div class="reel-growth-meter"><i style="width:${x.pct}%"></i></div>
        <small>${i===0?"base":("+"+x.delta.toLocaleString("pt-BR")+" desde a leitura anterior")}</small>
        <em>${Number.isFinite(x.velocity)?"~"+calendarCompactNumber(Math.round(x.velocity))+" views/h":Number(x.s.reach||0).toLocaleString("pt-BR")+" alcance"}</em>
      </div>`).join("")}
    </div>
  </div>`;
}

function localMetricParts(ts){
  const tz=automationData?.settings?.timezone||"America/Recife";
  const parts=new Intl.DateTimeFormat("en-US",{
    timeZone:tz,weekday:"short",hour:"2-digit",minute:"2-digit",hour12:false
  }).formatToParts(new Date(ts));
  const g=t=>parts.find(x=>x.type===t)?.value||"";
  const dowMap={Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6};
  return {weekday:dowMap[g("weekday")]??0,hour:Number(g("hour")||0),minute:Number(g("minute")||0)};
}
function recommendationSupport(rec){
  const target=Number(String(rec.recommended_time).slice(0,2))*60+Number(String(rec.recommended_time).slice(3,5));
  const sameDay=liveInstagramMetrics.filter(m=>{
    if(!m.timestamp)return false;
    const p=localMetricParts(m.timestamp);
    const mins=p.hour*60+p.minute;
    return p.weekday===Number(rec.weekday)&&Math.abs(mins-target)<=75;
  });
  const nearby=sameDay.sort((a,b)=>(+b.views||0)-(+a.views||0));
  const best=nearby[0]||null;
  return {count:nearby.length,best};
}
function smartConfidenceLabel(rec){
  const state=String(rec.validation_state||"");
  if(state==="validated")return {label:"Validado",cls:"validated",icon:"✓"};
  if(state==="revalidate")return {label:"Revalidar",cls:"revalidate",icon:"↻"};
  if(state==="new")return {label:"Novo",cls:"new",icon:"•"};
  if(state==="testing")return {label:"Testando",cls:"test",icon:"◌"};
  if(rec.recommendation_type==="test")return {label:"Testando",cls:"test",icon:"◌"};
  const c=Number(rec.confidence||0);
  return {label:"Testando",cls:c>=80?"strong":"good",icon:"◌"};
}
function smartReason(rec){
  const a=automationData||{settings:{}};
  const cfg=a.settings?.smart_scheduler||{};
  const minSamples=Number(cfg.validationMinSamples||4);
  const minConfidence=Number(cfg.validationMinConfidence||80);
  const state=String(rec.validation_state||"testing");
  if(state==="validated"){
    return {
      main:"Horário validado e congelado",
      extra:Number(rec.sample_count||0)+" amostras · "+Number(rec.confidence||0)+"% confiança · só muda se houver motivo"
    };
  }
  if(state==="revalidate"){
    const champion=String(rec.champion_time||"").slice(0,5)||"—";
    const challenger=String(rec.candidate_time||rec.model_time||"").slice(0,5)||"—";
    return {
      main:"Campeão "+champion+" × desafiante "+challenger,
      extra:(rec.validation_conflict?"Desafiante aguardando espaço seguro":"Comparação aberta")+" · "+Number(rec.challenger_streak||0)+"/"+Number(cfg.challengerEvidenceCycles||2)+" evidências"
    };
  }
  if(state==="new"){
    return {
      main:"Horário novo",
      extra:"Ainda sem amostras suficientes para começar a validar"
    };
  }
  const s=recommendationSupport(rec);
  if(s.best){
    const p=localMetricParts(s.best.timestamp);
    const hh=String(p.hour).padStart(2,"0")+":"+String(p.minute).padStart(2,"0");
    return {
      main:"Testando consistência · Reel de "+Number(s.best.views||0).toLocaleString("pt-BR")+" views às "+hh,
      extra:Number(rec.sample_count||0)+"/"+minSamples+" amostras · precisa "+minConfidence+"% confiança para validar"
    };
  }
  return {
    main:"Testando consistência",
    extra:Number(rec.sample_count||0)+"/"+minSamples+" amostras · "+Number(rec.confidence||0)+"%/"+minConfidence+"% confiança"
  };
}
function smartHistoryLabel(event){

async function loadProductionData(forcePreviews=false){
  if(!cloudSession){productionData=null;return}
  const [queue,status]=await Promise.all([
    cloudFetch("?resource=production"),
    cloudFetch("?resource=runninghub-status").catch(e=>({error:e.message}))
  ]);
  // Previews are intentionally on-demand. Auto-loading metadata for every video
  // caused repeated range requests and unnecessary Supabase egress.
  productionData={...queue,runninghubStatus:status,previews:{},previewSignature:"lightweight"};
}

function productionStatusMeta(status){
  const map={
    waiting:["Aguardando envio","waiting"],
    uploading:["Enviando arquivos","uploading"],
    queued:["Na fila do RunningHub","queued"],
    running:["Gerando","running"],
    ready:["Pronto","ready"],
    failed:["Erro","failed"],
    cancelled:["Cancelado","cancelled"]
  };
  const x=map[status]||[status||"Aguardando","waiting"];
  return {label:x[0],cls:x[1]};
}

function productionCounts(){
  const jobs=productionData?.jobs||[];
  const today=new Date().toISOString().slice(0,10);
  return {
    total:jobs.filter(j=>!["ready","cancelled"].includes(j.status)).length,
    running:jobs.filter(j=>["uploading","queued","running"].includes(j.status)).length,
    ready:jobs.filter(j=>j.status==="ready"&&String(j.completed_at||"").slice(0,10)===today).length,
    failed:jobs.filter(j=>j.status==="failed").length
  };
}
function releaseProductionDraft(kind=null){
  const clearOne=k=>{
    const url=productionDraft[k+"Url"];
    if(url){try{URL.revokeObjectURL(url)}catch{}}
    productionDraft[k]=null;
    productionDraft[k+"Url"]=null;
  };
  if(kind)clearOne(kind);
  else{clearOne("video");clearOne("frame")}
}
function renderProductionDraft(){
  const renderOne=(kind,file,url)=>{
    if(!file||!url)return;
    const box=$("#production"+(kind==="video"?"VideoBox":"FrameBox"));
    if(!box)return;
    box.classList.add("selected","has-preview");
    box.dataset.previewUrl=url;
    const mediaHost=box.querySelector(".production-upload-preview");
    if(mediaHost){
      mediaHost.innerHTML=kind==="video"
        ? '<video src="'+url+'#t=0.05" muted playsinline preload="metadata"></video><span class="production-preview-play">▶</span>'
        : '<img src="'+url+'" alt="Frame da modelo">';
    }
    const next=(productionData?.jobs?.length||0)+1;
    const title=box.querySelector(".production-upload-title");
    const meta=box.querySelector(".production-upload-meta");
    if(title)title.textContent=(kind==="video"?"Vídeo ":"Frame ")+next;

}
function productionFileChangedFromInput(input){

}

async function createProductionThumbnail(file,kind){
  if(!(file instanceof File))return null;
  const objectUrl=URL.createObjectURL(file);
  return new Promise(resolve=>{
    let done=false,timer=null,media=null;
    const finish=blob=>{
      if(done)return;done=true;
      if(timer)clearTimeout(timer);
      try{if(media&&kind==="video"){media.pause();media.removeAttribute("src");media.load()}}catch{}
      try{URL.revokeObjectURL(objectUrl)}catch{}
      resolve(blob||null);
    };
    const draw=(source,w,h)=>{
      try{
        if(!w||!h)return finish(null);
        const scale=Math.min(1,220/w,300/h);
        const cw=Math.max(2,Math.round(w*scale)),ch=Math.max(2,Math.round(h*scale));
        const canvas=document.createElement("canvas");canvas.width=cw;canvas.height=ch;
        const ctx=canvas.getContext("2d",{alpha:false});
        ctx.fillStyle="#000";ctx.fillRect(0,0,cw,ch);ctx.drawImage(source,0,0,cw,ch);
        canvas.toBlob(blob=>finish(blob),"image/jpeg",.74);
      }catch{finish(null)}
    };
    timer=setTimeout(()=>finish(null),5500);
    if(kind==="frame"){
      const img=new Image();media=img;
      img.onload=()=>draw(img,img.naturalWidth,img.naturalHeight);
      img.onerror=()=>finish(null);
      img.src=objectUrl;
      return;
    }
    const video=document.createElement("video");media=video;
    video.muted=true;video.playsInline=true;video.preload="auto";
    let captureRequested=false;
    const capture=()=>draw(video,video.videoWidth,video.videoHeight);
    video.onerror=()=>finish(null);
    video.onseeked=()=>capture();
    video.onloadeddata=()=>{
      if(captureRequested)return;
      captureRequested=true;
      const duration=Number(video.duration||0);
      const target=duration>0.4?Math.min(.35,duration*.08):0;
      if(target>0.02){
        try{video.currentTime=target}catch{capture()}
      }else capture();
    };
    video.src=objectUrl;video.load();
  });
}
async function getProductionThumbUrl(id,kind){
  const key=String(id)+"|"+String(kind);
  const cached=productionThumbUrlCache.get(key);
  if(cached&&cached.expires>Date.now()+60000)return cached.url;
  const r=await cloudFetch("?resource=production-preview&id="+encodeURIComponent(id)+"&kind="+encodeURIComponent(kind));
  if(!r?.url)return null;
  productionThumbUrlCache.set(key,{url:r.url,expires:Date.now()+50*60*1000});
  return r.url;
}
async function loadProductionThumb(el){
  if(!el||el.dataset.loaded==="1"||el.dataset.loading==="1")return;
  const id=el.dataset.productionThumbId,kind=el.dataset.productionThumbKind;
  if(!id||!kind)return;
  el.dataset.loading="1";
  try{
    let url=null;
    try{url=await getProductionThumbUrl(id,kind)}catch{}
    if(!url&&kind==="frame-thumb"){
      // Historical jobs may predate lightweight thumbnails. Loading the frame
      // image is still much cheaper than auto-reading the MP4.
      try{url=await getProductionThumbUrl(id,"frame")}catch{}
    }
    if(url){
      const isVideo=kind==="video-thumb";
      el.innerHTML='<img src="'+esc(url)+'" alt="" loading="lazy" decoding="async">'+
        (isVideo?'<span class="production-thumb-play">▶</span>':'')+
        '<span class="production-thumb-label">'+(isVideo?"VÍDEO":"FRAME")+'</span>';
      el.dataset.loaded="1";
    }
  }finally{delete el.dataset.loading}
}
function setupProductionThumbs(){
  if(productionThumbObserver){try{productionThumbObserver.disconnect()}catch{}}
  productionThumbObserver=null;
  const els=[...document.querySelectorAll("[data-production-thumb-id][data-production-thumb-kind]")];
  if(!els.length)return;
  if(!("IntersectionObserver" in window)){els.forEach(loadProductionThumb);return}
  productionThumbObserver=new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
      if(!entry.isIntersecting)return;
      productionThumbObserver?.unobserve(entry.target);
      loadProductionThumb(entry.target);
    });
  },{rootMargin:"180px 0px",threshold:.01});
  els.forEach(el=>productionThumbObserver.observe(el));
}

async function uploadProductionJobDirect(video,frame,videoThumb=null,frameThumb=null){
  const ticket=await cloudFetch("?action=production-upload-ticket",{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      video_file_name:video.name,video_mime_type:video.type||"video/mp4",video_size_bytes:video.size,
      frame_file_name:frame.name,frame_mime_type:frame.type||"image/jpeg",frame_size_bytes:frame.size,
      has_video_thumb:!!videoThumb,has_frame_thumb:!!frameThumb
    })
  });
  if(ticket?.fallback){
    const fd=new FormData();
    fd.append("video",video);fd.append("frame",frame);
    if(videoThumb)fd.append("video_thumb",videoThumb,"video-thumb.jpg");
    if(frameThumb)fd.append("frame_thumb",frameThumb,"frame-thumb.jpg");
    return await cloudFetch("?action=production-upload",{method:"POST",body:fd});
  }

  const putOne=async(part,blob,required=true)=>{
    if(!part||!blob)return false;
    try{
      const r=await fetch(part.upload_url,{
        method:"PUT",headers:{"Content-Type":part.content_type||blob.type||"application/octet-stream"},body:blob
      });
      if(!r.ok)throw new Error("HTTP "+r.status);
      return true;
    }catch(e){
      if(required)throw new Error("Upload para o Backblaze B2 falhou. Confira o CORS do bucket. "+(e?.message||""));
      return false;
    }
  };

  const [videoOk,frameOk]=await Promise.all([
    putOne(ticket.video,video,true),
    putOne(ticket.frame,frame,true)
  ]);
  if(!videoOk||!frameOk)throw new Error("Vídeo ou frame não terminou de enviar para o Backblaze B2.");

  const [videoThumbOk,frameThumbOk]=await Promise.all([
    putOne(ticket.video_thumb,videoThumb,false),
    putOne(ticket.frame_thumb,frameThumb,false)
  ]);

  return await cloudFetch("?action=production-upload-complete",{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      job_id:ticket.job_id,
      video_path:ticket.video.path,
      frame_path:ticket.frame.path,
      video_thumb_path:videoThumbOk&&ticket.video_thumb?ticket.video_thumb.path:"",
      frame_thumb_path:frameThumbOk&&ticket.frame_thumb?ticket.frame_thumb.path:"",
      video_file_name:video.name,video_mime_type:video.type||"video/mp4",video_size_bytes:video.size,
      frame_file_name:frame.name,frame_mime_type:frame.type||"image/jpeg",frame_size_bytes:frame.size
    })
  });
}

async function addProductionJob(){
  if(productionUploading)return;
  const video=productionDraft.video||$("#productionVideo")?.files?.[0];
  const frame=productionDraft.frame||$("#productionFrame")?.files?.[0];
  if(!video||!frame){toast("Selecione o vídeo e o frame da modelo.","err");return}
  productionUploading=true;
  productionPage();
  try{
    const [videoThumb,frameThumb]=await Promise.all([
      createProductionThumbnail(video,"video"),
      createProductionThumbnail(frame,"frame")
    ]);
    await uploadProductionJobDirect(video,frame,videoThumb,frameThumb);
    await loadProductionData(true);
    releaseProductionDraft();
    toast("Adicionado à fila de produção.","ok");
  }catch(e){
    toast(e.message,"err");
  }finally{
    productionUploading=false;
    productionPage();
  }
}

async function getProductionResultBlobUrl(id,name="preview.mp4"){
  if(!cloudSession)throw new Error("Faça login no CloudentFlow primeiro.");
  const headers={Authorization:"Bearer "+cloudSession.access_token,apikey:SUPABASE_KEY};
  const res=await fetch(EDGE_URL+"?resource=production-download&id="+encodeURIComponent(id)+"&name="+encodeURIComponent(name),{headers});
  if(res.status===401&&await refreshCloudSession())return getProductionResultBlobUrl(id,name);
  if(!res.ok){
    let data=null;try{data=await res.json()}catch{}
    throw new Error(responseErrorMessage(data,res.status));
  }
  const blob=await res.blob();
  if(!blob.size)throw new Error("O vídeo final veio vazio.");
  return URL.createObjectURL(blob);
}

function formatProductionSeconds(seconds){
  const s=Math.max(0,Math.floor(Number(seconds)||0));
  const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;
  return h>0
    ? String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")+":"+String(sec).padStart(2,"0")
    : String(m).padStart(2,"0")+":"+String(sec).padStart(2,"0");
}
function productionElapsedSeconds(j){
  const apiRuntime=Number(j?.runninghub_runtime_seconds);
  if(j?.status==="ready"&&Number.isFinite(apiRuntime)&&apiRuntime>0)return apiRuntime;
  if(!j?.started_at)return 0;
  const start=new Date(j.started_at).getTime();
  const end=j.completed_at?new Date(j.completed_at).getTime():Date.now();
  return Math.max(0,(end-start)/1000);
}
function syncProductionElapsed(){
  document.querySelectorAll(".production-elapsed[data-started]").forEach(el=>{
    const start=Number(el.dataset.started||0);
    const completed=Number(el.dataset.completed||0);
    const runtime=Number(el.dataset.runtime||0);
    const done=el.dataset.done==="1";
    const seconds=done&&runtime>0?runtime:Math.max(0,((completed||Date.now())-start)/1000);
    el.textContent=(done?"Tempo total ":"Decorrido ")+formatProductionSeconds(seconds);
  });
}
function productionLiveSignature(data=productionData){
  const jobs=(data?.jobs||[]).slice(0,40).map(j=>[
    j.id,j.status,j.updated_at,j.started_at,j.completed_at,j.queue_position,
    j.runninghub_status,j.runninghub_runtime_seconds,j.last_error
  ].map(x=>String(x??"")).join(":")).join("|");
  const rh=data?.runninghubStatus||{};
  return jobs+"||"+[
    rh.enabled,rh.paused,rh.active_tasks,rh.status,rh.error
  ].map(x=>String(x??"")).join(":");
}
function ensureProductionTicker(){
  if(!window.__cloudentProductionTicker){
    window.__cloudentProductionTicker=setInterval(syncProductionElapsed,1000);
  }
  if(!window.__cloudentProductionLiveTicker){
    window.__cloudentProductionLiveTicker=setInterval(async()=>{
      if(currentPage!=="production"||!cloudSession||document.hidden||window.__cloudentProductionRefreshing)return;
      if($("#productionVideo")?.files?.length||$("#productionFrame")?.files?.length)return;
      window.__cloudentProductionRefreshing=true;
      const before=productionLiveSignature();
      try{
        await loadProductionData(false);
        if(currentPage==="production"){
          const after=productionLiveSignature();
          // Não destrói/recria toda a fila quando nada visual mudou.
          if(after!==before)productionPage();
          else syncProductionElapsed();
        }
      }catch{}finally{
        window.__cloudentProductionRefreshing=false;
      }
    },10000);
  }
}
function actionButtonBusy(button,busy,label=""){
  if(!button)return;
  if(busy){
    if(!button.dataset.idleHtml)button.dataset.idleHtml=button.innerHTML;
    button.classList.add("is-pending");
    button.disabled=true;
    if(label)button.innerHTML='<span class="button-spinner" aria-hidden="true"></span><span>'+esc(label)+'</span>';
  }else{
    button.classList.remove("is-pending");
    button.disabled=false;
    if(button.dataset.idleHtml){
      button.innerHTML=button.dataset.idleHtml;
      delete button.dataset.idleHtml;
    }
  }
}

function validateProductionSchedule(accountId,date,time){
  if(!accountId)return {ok:false,msg:"Escolha uma conta Instagram disponível."};
  if(!Number.isFinite(minutesOf(time)))return {ok:false,msg:"Horário inválido."};
  const rows=productionScheduleRows(accountId,date);
  if(rows.length>=15)return {ok:false,msg:"Limite de 15 vídeos por dia atingido."};
  const occupied=rows.some(x=>{
    const at=new Date(x.scheduled_at||x.scheduledAt);
    return at.getHours()*60+at.getMinutes()===minutesOf(time);
  });
  return occupied?{ok:false,msg:`Já existe um vídeo às ${time} nessa conta.`}:{ok:true};
}
function productionScheduleDefaultTime(accountId,date){
  const base=calendarDayVolume(date,accountId);
  const preferred=base===15
    ? ["07:30","08:30","09:30","10:30","11:30","13:00","14:00","15:00","16:00","17:00","18:00","19:00","20:00","21:00","22:00"]
    : state.defaultTimes.slice(0,5);
  for(const time of preferred)if(validateProductionSchedule(accountId,date,time).ok)return time;
  for(let mins=0;mins<1440;mins++){
    const time=String(Math.floor(mins/60)).padStart(2,"0")+":"+String(mins%60).padStart(2,"0");
    if(validateProductionSchedule(accountId,date,time).ok)return time;
  }
  return "12:00";
}

async function downloadProductionResult(id,number,retry=true){
  try{
    if(!cloudSession)throw new Error("Faça login no CloudentFlow primeiro.");
    const name="Video final "+number+".mp4";
    const headers={Authorization:"Bearer "+cloudSession.access_token,apikey:SUPABASE_KEY};
    const res=await fetch(EDGE_URL+"?resource=production-download&id="+encodeURIComponent(id)+"&name="+encodeURIComponent(name),{headers});
    if(res.status===401&&retry&&await refreshCloudSession())return downloadProductionResult(id,number,false);
    if(!res.ok){
      let data=null;try{data=await res.json()}catch{}
      throw new Error(responseErrorMessage(data,res.status));
    }
    const blob=await res.blob();
    if(!blob.size)throw new Error("O arquivo final veio vazio.");
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;
    a.download=name;
    a.style.display="none";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),5000);
  }catch(e){toast(friendlyCloudentError(e?.message||String(e)),"err")}
}

function productionCreditUsage(j){
  const raw=j?.credits_used;
  if(raw!==null&&raw!==undefined&&raw!==""){
    const exact=Number(raw);
    if(Number.isFinite(exact))return {value:exact,live:false};
  }

  const before=Number(j?.credits_before);
  const current=Number(productionData?.runninghubStatus?.credits);
  const active=["uploading","queued","running"].includes(j?.status);
  if(active&&Number.isFinite(before)&&Number.isFinite(current)){
    const delta=Math.max(0,before-current);
    if(delta>0)return {value:delta,live:true};
  }
  return null;
}
function productionMoneyUsage(j){
  const raw=j?.runninghub_cost_money;
  const thirdRaw=j?.runninghub_third_party_cost_money;
  const base=raw===null||raw===undefined||raw===""?null:Number(raw);
  const third=thirdRaw===null||thirdRaw===undefined||thirdRaw===""?null:Number(thirdRaw);
  return {
    base:Number.isFinite(base)?base:null,
    third:Number.isFinite(third)?third:null,
    total:(Number.isFinite(base)?base:0)+(Number.isFinite(third)?third:0),
    has:Number.isFinite(base)||Number.isFinite(third)
  };
}

function productionCostSummary(){
  const jobs=productionData?.jobs||[];
  const completed=jobs.filter(j=>j.completed_at&&productionMoneyUsage(j).has);
  const totalOf=j=>productionMoneyUsage(j).total;
  const avg=completed.length?completed.reduce((a,j)=>a+totalOf(j),0)/completed.length:null;
  const now=Date.now();
  const sumSince=ms=>{
    const rows=completed.filter(j=>new Date(j.completed_at).getTime()>=now-ms);
    return rows.length?rows.reduce((a,j)=>a+totalOf(j),0):null;
  };
  const waiting=jobs.filter(j=>["waiting","uploading","queued","running"].includes(j.status)).length;
  const forecast=avg!==null?avg*waiting:null;
  return {avg,waiting,forecast,today:sumSince(86400000),week:sumSince(7*86400000),month:sumSince(30*86400000),samples:completed.length};
}
function productionCreditDashboard(){
  const s=productionCostSummary();

    '<div class="forecast"><small>PREVISÃO DA FILA</small><b>'+fmt(s.forecast)+'</b><span>'+s.waiting+' job(s) × média real</span></div>' +
  '</div>';
}

function faceSwapJobSteps(job){
  const faceDone=job.status==="ready"||!!job.result_storage_path||!!job.production_job_id;
  const faceActive=["uploading","queued","running"].includes(job.status);
  const faceFailed=["failed","cancelled"].includes(job.status);
  const productionLinked=!!job.production_job_id;
  const productionStatus=String(job.production?.status||"");
  const motionDone=productionStatus==="ready";
  const motionFailed=["failed","cancelled"].includes(productionStatus);
  const motionActive=productionLinked&&["waiting","uploading","queued","running"].includes(productionStatus);
  return [
    {label:"Frame",done:true,active:false,failed:false},
    {label:"Face Swap",done:faceDone,active:faceActive,failed:faceFailed},
    {label:"Motion",done:motionDone,active:motionActive,failed:motionFailed},
    {label:"Final",done:motionDone,active:false,failed:false}
  ];
}
function faceSwapPipelineState(job){
  const p=job.production||null;
  if(["failed","cancelled"].includes(String(job.status||"")))return {label:"Falhou no Face Swap",cls:"failed",detail:job.last_error||"Refaça somente o Face Swap."};
  if(["failed","cancelled"].includes(String(p?.status||"")))return {label:"Falhou no Motion",cls:"failed",detail:p?.last_error||"O Face Swap está pronto. Refaça apenas o Motion."};
  if(String(p?.status||"")==="ready")return {label:"Vídeo final pronto",cls:"ready",detail:"Face Swap e Motion concluídos."};
  if(["uploading","queued","running"].includes(String(p?.status||"")))return {label:"Motion em execução",cls:"running",detail:"O frame gerado já entrou na Produção IA."};
  if(job.status==="ready"&&job.production_job_id)return {label:"Motion aguardando",cls:"queued",detail:"Face Swap pronto; aguardando vaga no RunningHub."};
  if(job.status==="ready")return {label:"Face Swap pronto",cls:"ready",detail:job.auto_send?"Preparando envio para o Motion.":"Revise a imagem antes de enviar ao Motion."};
  if(["uploading","queued","running"].includes(String(job.status||"")))return {label:"Face Swap em execução",cls:"running",detail:"Gerando o frame com a personagem."};
  if(job.status==="waiting"){
    const busy=Number(faceSwapData?.runninghub?.total_active||0)>=Number(faceSwapData?.runninghub?.concurrency||1);
    if(job.meta?.manual_run&&busy)return {label:"Na fila",cls:"queued",detail:"RunningHub ocupado. Inicia assim que a vaga liberar."};
    if(job.meta?.manual_run)return {label:"Execução solicitada",cls:"queued",detail:"Aguardando o worker iniciar o Face Swap."};
  }
  return {label:"Aguardando",cls:"queued",detail:"Job pronto para executar."};
}
function syncFaceSwapUploadProgressUi(){
  const label=document.getElementById("faceSwapUploadLabel");
  const meta=document.getElementById("faceSwapUploadMeta");

  const pct=Math.max(0,Math.min(100,Math.round(Number(faceSwapUploadProgress.percent||0))));
  if(label)label.textContent=faceSwapUploadProgress.current||"Processando";
  if(meta)meta.textContent=(pct?pct+"% enviado · ":"")+Number(faceSwapUploadProgress.done||0)+" de "+Number(faceSwapUploadProgress.total||0)+" concluído(s)";
  if(bar)bar.style.width=pct+"%";
}
function uploadFaceSwapPart(part,blob,onProgress){
  return new Promise((resolve,reject)=>{
    const xhr=new XMLHttpRequest();
    xhr.open("PUT",part.upload_url,true);
    xhr.timeout=10*60*1000;
    const type=part.content_type||blob.type||"application/octet-stream";
    if(type)xhr.setRequestHeader("Content-Type",type);
    xhr.upload.onprogress=(event)=>{
      if(event.lengthComputable&&typeof onProgress==="function")onProgress(event.loaded,event.total);
    };
    xhr.onload=()=>{
      if(xhr.status>=200&&xhr.status<300)resolve();
      else reject(new Error("Upload do Face Swap falhou · HTTP "+xhr.status));
    };
    xhr.onerror=()=>reject(new Error("A conexão caiu durante o upload do Face Swap."));
    xhr.ontimeout=()=>reject(new Error("O upload demorou mais de 10 minutos e foi interrompido."));
    xhr.onabort=()=>reject(new Error("Upload do Face Swap cancelado."));
    xhr.send(blob);
  });
}
async function uploadFaceSwapJobDirect(video,frame,autoSend){
  const ticket=await cloudFetch("?action=face-swap-upload-ticket",{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      video_file_name:video.name,video_mime_type:video.type||"video/mp4",video_size_bytes:video.size,
      frame_file_name:frame.name,frame_mime_type:frame.type||"image/jpeg",frame_size_bytes:frame.size,
      auto_send:autoSend
    })
  });
  if(ticket?.fallback){
    const fd=new FormData();
    fd.append("video",video);
    fd.append("frame",frame);
    fd.append("auto_send",autoSend?"true":"false");
    await CloudentFaceSwapCharacter.flush();
    return await cloudFetch("?action=face-swap-upload",{method:"POST",body:fd});
  }
  const totalBytes=Math.max(1,Number(video.size||0)+Number(frame.size||0));
  let videoLoaded=0,frameLoaded=0,lastPct=-1;
  const updateProgress=()=>{
    const pct=Math.max(0,Math.min(99,Math.round(((videoLoaded+frameLoaded)/totalBytes)*100)));
    if(pct===lastPct)return;
    lastPct=pct;
    faceSwapUploadProgress.percent=pct;
    faceSwapUploadProgress.current="Enviando · "+pct+"%";
    syncFaceSwapUploadProgressUi();
  };
  await Promise.all([
    uploadFaceSwapPart(ticket.video,video,(loaded)=>{videoLoaded=loaded;updateProgress()}),
    uploadFaceSwapPart(ticket.frame,frame,(loaded)=>{frameLoaded=loaded;updateProgress()})
  ]);
  faceSwapUploadProgress.percent=100;
  faceSwapUploadProgress.current="Upload concluído · registrando job…";
  syncFaceSwapUploadProgressUi();
  await CloudentFaceSwapCharacter.flush();
  const completed=await cloudFetch("?action=face-swap-upload-complete",{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      job_id:ticket.job_id,
      video_path:ticket.video.path,
      frame_path:ticket.frame.path,
      video_file_name:video.name,video_mime_type:video.type||"video/mp4",video_size_bytes:video.size,
      frame_file_name:frame.name,frame_mime_type:frame.type||"image/jpeg",frame_size_bytes:frame.size,
      auto_send:autoSend
    })
  });
  faceSwapUploadProgress.current="Entrou na fila · iniciando Face Swap…";
  syncFaceSwapUploadProgressUi();
  return completed;
}
async function handleFaceSwapVideos(input){
  if(faceSwapUploading)return;
  const files=[...(input?.files||[])].filter(f=>String(f.type||"").startsWith("video/"));
  if(input)input.value="";
  if(!files.length){toast("Selecione pelo menos um vídeo.","err");return}
  if(!faceSwapData?.workflow?.configured){toast("O workflow de Face Swap ainda não está configurado.","err");return}
  faceSwapUploading=true;
  faceSwapUploadProgress={done:0,total:files.length,current:"Preparando",percent:0};
  faceSwapPage();
  let ok=0,fail=0;
  for(let i=0;i<files.length;i++){
    const video=files[i];
    let objectUrl="";
    try{
      faceSwapUploadProgress.current="Extraindo frame · "+(i+1)+"/"+files.length;
      faceSwapUploadProgress.percent=0;
      syncFaceSwapUploadProgressUi();
      objectUrl=URL.createObjectURL(video);
      const frameBlob=await extractFirstFrameBlob(objectUrl);
      const frame=new File([frameBlob],"first-frame-"+(i+1)+".jpg",{type:"image/jpeg"});
      faceSwapUploadProgress.current="Preparando envio · "+(i+1)+"/"+files.length;
      faceSwapUploadProgress.percent=0;
      syncFaceSwapUploadProgressUi();
      await uploadFaceSwapJobDirect(video,frame,faceSwapAuto);
      ok++;
    }catch(e){
      fail++;
      console.error("Face Swap upload:",e);
      toast((video.name||"Vídeo")+": "+friendlyCloudentError(e?.message||String(e)),"err");
    }finally{
      if(objectUrl){try{URL.revokeObjectURL(objectUrl)}catch{}}
      faceSwapUploadProgress.done=i+1;
    }
  }
  faceSwapUploading=false;
  faceSwapUploadProgress={done:0,total:0,current:"",percent:0};
  await loadFaceSwapData().catch(()=>{});
  faceSwapPage();
  if(ok)toast(ok+" vídeo"+(ok===1?" enviado":"s enviados")+" para Face Swap."+(faceSwapAuto?" Automático ligado.":""),"ok");
  if(fail&&!ok)toast("Nenhum vídeo entrou na fila.","err");
}

    const result=await cloudFetch("?action=face-swap-job",{
      method:"PATCH",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({id,operation})
    });
    await loadFaceSwapData();

    if(operation==="send-production")toast("Enviado para Produção IA.","ok");
    else if(operation==="retry")toast("Face Swap reenfileirado.","ok");

      toast(busy?"Entrou na fila. O RunningHub está ocupado com a tarefa atual.":"Execução solicitada. O Face Swap vai iniciar agora.","ok");

async function getFaceSwapAssetUrl(id,kind="frame"){
  const key=String(id)+"|"+kind;
  const cached=faceSwapFrameUrlCache.get(key);
  if(cached&&cached.expires>Date.now()+60000)return cached.url;
  const r=await cloudFetch("?resource=face-swap-preview&id="+encodeURIComponent(id)+"&kind="+encodeURIComponent(kind));
  if(!r?.url)return null;
  faceSwapFrameUrlCache.set(key,{url:r.url,expires:Date.now()+50*60*1000});
  return r.url;
}
async function loadFaceSwapAssetThumb(el){
  if(!el||el.dataset.loaded==="1"||el.dataset.loading==="1")return;
  const id=el.dataset.faceSwapAssetId,kind=el.dataset.kind||"frame";if(!id)return;
  el.dataset.loading="1";
  try{
    const url=await getFaceSwapAssetUrl(id,kind);
    if(url){
      const img=document.createElement("img");
      img.src=url;img.alt=kind==="result"?"Resultado Face Swap":"Primeiro frame";img.loading="lazy";img.decoding="async";
      const ph=el.querySelector(".placeholder");if(ph)ph.replaceWith(img);else el.prepend(img);
      el.dataset.loaded="1";
    }
  }catch{}finally{delete el.dataset.loading}
}
function setupFaceSwapFrameThumbs(){
  document.querySelectorAll("[data-face-swap-asset-id]").forEach(loadFaceSwapAssetThumb);
}

async function retryFaceSwapMotion(id,button=null){
  const job=(faceSwapData?.jobs||[]).find(x=>String(x.id)===String(id));
  const pid=job?.production_job_id;if(!pid)return;
  actionButtonBusy(button,true,"Refazendo Motion…");
  try{
    await cloudFetch("?action=production-job",{
      method:"PATCH",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({id:pid,operation:"retry"})
    });
    await loadFaceSwapData();faceSwapPage();
    toast("Motion reenfileirado sem refazer o Face Swap.","ok");
  }catch(e){actionButtonBusy(button,false);toast(friendlyCloudentError(e?.message||String(e)),"err")}
}
function faceSwapCostTotal(job){
  const face=Number(job?.credits_used);
  const motion=Number(job?.production?.credits_used);
  const hasFace=job?.credits_used!==null&&job?.credits_used!==undefined&&Number.isFinite(face);
  const hasMotion=job?.production?.credits_used!==null&&job?.production?.credits_used!==undefined&&Number.isFinite(motion);
  return {face:hasFace?face:null,motion:hasMotion?motion:null,total:(hasFace?face:0)+(hasMotion?motion:0),complete:hasFace&&hasMotion};
}
function faceSwapCostMarkup(job){
  const x=faceSwapCostTotal(job);
  const parts=[];
  if(x.face!==null)parts.push("Face "+x.face.toLocaleString("pt-BR"));
  if(x.motion!==null)parts.push("Motion "+x.motion.toLocaleString("pt-BR"));
  if(parts.length){
    const total=(x.face||0)+(x.motion||0);
    return '<span class="face-swap-job-cost">Créditos · '+parts.join(" + ")+' = <b>'+total.toLocaleString("pt-BR")+'</b></span>';
  }
  return job?.status==="ready"?'<span class="face-swap-job-cost muted">custo sendo sincronizado…</span>':"";
}
function faceSwapElapsedText(startedAt){
  if(!startedAt)return "Processando no RunningHub";
  const ms=Math.max(0,Date.now()-new Date(startedAt).getTime());
  const total=Math.floor(ms/1000),min=Math.floor(total/60),sec=total%60;
  return min>0?"Em execução · "+min+"m "+String(sec).padStart(2,"0")+"s":"Em execução · "+sec+"s";
}
function syncFaceSwapElapsed(){
  document.querySelectorAll("[data-face-swap-started]").forEach(el=>{
    el.textContent=faceSwapElapsedText(el.dataset.faceSwapStarted);
  });
}
function faceSwapPipelineBar(job){
  const productionStatus=String(job?.production?.status||"");
  const faceReady=job?.status==="ready"||!!job?.result_storage_path||!!job?.production_job_id;
  const faceActive=["uploading","queued","running"].includes(String(job?.status||""));
  const motionReady=productionStatus==="ready";
  const motionActive=["waiting","uploading","queued","running"].includes(productionStatus);

  let width=25;
  let active=false;
  if(faceReady)width=50;
  if(motionActive){width=50;active=true}
  if(motionReady)width=100;
  if(faceActive){width=25;active=true}

  return '<div class="face-swap-progress pipeline '+(active?"indeterminate-stage":"")+'">'+
    '<i style="width:'+width+'%"></i>'+
    (active?'<b style="left:'+width+'%"></b>':'')+
  '</div>';
}

function faceSwapJobRow(job,index,total){
  const safeTotal=Number.isFinite(Number(total))?Number(total):0;
  const safeIndex=Number.isFinite(Number(index))?Number(index):0;
  const n=Math.max(1,safeTotal-safeIndex);
  const steps=faceSwapJobSteps(job),state=faceSwapPipelineState(job);
  const productionStatus=String(job.production?.status||"");
  const actions=[];
  if(job.status==="waiting"){
    const busy=Number(faceSwapData?.runninghub?.total_active||0)>=Number(faceSwapData?.runninghub?.concurrency||1);
    if(job.meta?.manual_run){
      actions.push('<button disabled title="'+(busy?"RunningHub ocupado; começa automaticamente ao liberar.":"Execução já solicitada.")+'">'+(busy?"Na fila":"Iniciando…")+'</button>');
    }else{
      actions.push('<button class="primary" onclick="faceSwapAction(\''+esc(job.id)+'\',\'run\',this)">▶ Executar</button>');
    }
  }else if(["failed","cancelled"].includes(String(job.status||""))){
    actions.push('<button class="primary" onclick="faceSwapAction(\''+esc(job.id)+'\',\'retry\',this)">↻ Refazer Face Swap</button>');
  }else if(["failed","cancelled"].includes(productionStatus)){
    actions.push('<button class="primary" onclick="retryFaceSwapMotion(\''+esc(job.id)+'\',this)">↻ Refazer Motion</button>');
  }else if(productionStatus==="ready"){
    actions.push('<button onclick="previewFaceSwapResult(\''+esc(job.id)+'\')">Ver Face Swap</button>');
    actions.push('<button class="primary" onclick="previewFaceSwapMotion(\''+esc(job.id)+'\')">▶ Ver vídeo final</button>');
    actions.push('<button onclick="downloadProductionResult(\''+esc(job.production_job_id)+'\','+n+')">↓ Baixar</button>');
  }else if(job.status==="ready"&&!job.production_job_id){
    actions.push('<button onclick="previewFaceSwapResult(\''+esc(job.id)+'\')">Ver Face Swap</button>');
    actions.push('<button class="primary" onclick="faceSwapAction(\''+esc(job.id)+'\',\'send-production\',this)">Enviar ao Motion</button>');
  }else if(job.status==="ready"){
    actions.push('<button onclick="previewFaceSwapResult(\''+esc(job.id)+'\')">Ver Face Swap</button>');
  }
  if(!["uploading","queued","running"].includes(String(job.status||""))&&!["uploading","queued","running"].includes(productionStatus)){
    actions.push('<button class="danger" onclick="deleteFaceSwapJob(\''+esc(job.id)+'\')">Excluir</button>');
  }
  const detailError=state.cls==="failed"?'<small class="face-swap-stage-error">'+esc(state.detail)+'</small>':"";
  const faceResult=job.result_storage_path
    ?'<button class="face-swap-stage-media" data-face-swap-asset-id="'+esc(job.id)+'" data-kind="result" onclick="previewFaceSwapResult(\''+esc(job.id)+'\')"><span class="placeholder">◇</span><em>FACE</em><small>Face gerado</small></button>'
    :'<div class="face-swap-stage-media pending"><span>◇</span><em>FACE</em><small>Aguardando</small></div>';
  const finalMedia=productionStatus==="ready"
    ?'<button class="face-swap-stage-media final" onclick="previewFaceSwapMotion(\''+esc(job.id)+'\')"><span>▶</span><em>FINAL</em><small>Ver motion</small></button>'
    :'<div class="face-swap-stage-media pending"><span>▶</span><em>FINAL</em><small>'+(["failed","cancelled"].includes(productionStatus)?"Falhou":productionStatus?"Processando":"Aguardando")+'</small></div>';
  return '<div class="face-swap-job face-swap-job-v2">'+
    '<div class="face-swap-pipeline-media">'+
      '<button class="face-swap-stage-media" data-face-swap-asset-id="'+esc(job.id)+'" data-kind="frame" onclick="previewFaceSwapFrame(\''+esc(job.id)+'\')"><span class="placeholder">▧</span><em>FRAME #'+n+'</em><small>Frame original</small></button>'+
      faceResult+finalMedia+
    '</div>'+
    '<div class="face-swap-job-main"><b>'+esc(job.original_file_name||("Vídeo "+n))+'</b><small>'+fmtSize(Number(job.original_size_bytes||0))+' · '+(job.auto_send?"Automático":"Manual")+'</small>'+faceSwapCostMarkup(job)+detailError+'</div>'+
    '<div class="face-swap-job-state">'+
      '<div class="face-swap-state-head"><span class="face-swap-status '+state.cls+'">'+esc(state.label)+'</span><small>'+esc(state.detail)+'</small></div>'+
      faceSwapPipelineBar(job)+
      '<div class="face-swap-mini-flow">'+steps.map(s=>'<span class="'+(s.failed?"failed":s.done?"done":s.active?"active":"")+'">'+(s.failed?"! ":s.done?"✓ ":"")+s.label+'</span>').join("")+'</div>'+
      '<div class="face-swap-cost-split">'+
        '<span>Face Swap <b>'+(job.credits_used??"—")+'</b></span>'+
        '<span>Motion <b>'+(job.production?.credits_used??"—")+'</b></span>'+
        '<span>Total <b>'+((Number(job.credits_used)||0)+(Number(job.production?.credits_used)||0)||"—")+'</b></span>'+
      '</div>'+
    '</div>'+

  '</div>';
}
function ensureFaceSwapTicker(){
  if(faceSwapTicker)return;
  faceSwapTicker=setInterval(async()=>{
    if(currentPage!=="faceSwap"||!cloudSession||document.hidden)return;
    try{
      const characterStamp=CloudentFaceSwapCharacter.stamp();
      const next=CloudentFaceSwapCharacter.merge(await cloudFetch("?resource=face-swap"),characterStamp);
      const sig=JSON.stringify((next?.jobs||[]).map(j=>[j.id,j.status,j.progress,j.production_job_id,j.production?.status,j.production?.progress,j.last_error,j.updated_at]));
      faceSwapData=next;
      if(sig!==faceSwapLastSignature){
        faceSwapLastSignature=sig;
        faceSwapPage();
      }else{
        syncFaceSwapElapsed();
      }
    }catch{}
  },10000);
}

function updateFrameExtractorText(value){frameExtractorLinksText=value}
