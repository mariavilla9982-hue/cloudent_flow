<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CloudentFlow — Content Automation SaaS</title>
<style>
:root{
  --bg:#07080b;--panel:#0f1117;--panel2:#12141b;--line:#272b36;--muted:#9297a7;
  --text:#f7f8fb;--pink:#ff3f7f;--pink2:#b44cff;--green:#43d38a;--yellow:#f6c85f;--red:#ff7070;
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 84% 0,#1a0c13 0,transparent 31%),var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input,select,textarea{font:inherit} button{cursor:pointer} button:disabled{opacity:.45;cursor:not-allowed}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;background:#090a0f;border-right:1px solid var(--line);padding:20px 16px}
.brand{display:flex;gap:10px;align-items:center;font-size:20px;font-weight:900;margin-bottom:25px}
.logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--pink),var(--pink2));box-shadow:0 8px 25px #ff3f7f40}
.nav button{width:100%;display:flex;gap:12px;align-items:center;border:0;background:transparent;color:#9297a7;border-radius:10px;padding:12px 14px;margin:4px 0;text-align:left}
.nav button.active{color:white;background:linear-gradient(90deg,#241019,#111018);border-left:3px solid var(--pink)}
.sidebar-foot{position:absolute;bottom:18px;left:16px;right:16px}
.mode{padding:10px;border-radius:9px;background:#0d1a14;border:1px solid #244032;color:#69e1a0;font-weight:800;margin-bottom:12px}
.main{min-width:0;padding:34px 42px 70px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px}.kicker{font-size:11px;letter-spacing:.12em;color:#9095a5;font-weight:800}
h1{font-size:36px;margin:5px 0 24px} h2{font-size:20px;margin:0 0 14px} h3{font-size:15px;margin:0}
.btn{border:1px solid var(--line);background:#151821;color:#fff;border-radius:10px;padding:10px 14px;font-weight:800}
.btn.primary{border:0;background:linear-gradient(135deg,var(--pink),#ef476f);box-shadow:0 8px 22px #ff3f7f2a}
.btn.ghost{background:transparent}.btn.danger{background:#210e0e;border-color:#5c2525;color:#ff9292}.btn.success{background:#0d1b14;border-color:#285039;color:#7ce0a9}
.card{background:linear-gradient(180deg,#11131a,#0e1016);border:1px solid var(--line);border-radius:16px;padding:20px}
.banner{border:1px solid #6b5220;background:#1d180d;color:#ffd770;padding:13px 16px;border-radius:11px;margin-bottom:22px}
.muted{color:var(--muted)}.note{font-size:12px;color:#8c91a0}.hidden{display:none!important}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.metric .num{font-size:30px;font-weight:900;margin:8px 0 3px}.metric .label{color:#a8adbc;font-weight:700}
.section-head{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:16px}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
input,select,textarea{background:#0b0d12;border:1px solid #2b303c;color:white;border-radius:10px;padding:10px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--pink)}
.badge{display:inline-flex;align-items:center;gap:6px;border:1px solid #303543;border-radius:999px;padding:5px 8px;font-size:12px;font-weight:800}
.badge.green{color:#79e2ab;background:#0b1b13;border-color:#244d34}.badge.yellow{color:#ffd873;background:#211a0a;border-color:#56451d}.badge.red{color:#ff9797;background:#210e0e;border-color:#5c2525}.badge.gray{color:#bac0cf;background:#141720}
.stage-board{display:grid;gap:8px}.stage-row{display:flex;gap:10px;padding:9px 10px;background:#0b0d12;border-radius:9px}

/* Calendar */
.calendar-wrap{max-width:1320px}
.calendar-top{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:12px}
.calendar-top .left{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.field label{display:block;color:#a7acba;font-size:12px;font-weight:800;margin-bottom:6px}
.week-grid{display:grid;grid-template-columns:repeat(5,minmax(180px,1fr));gap:10px;align-items:start}
.day-column{border:1px solid var(--line);border-radius:14px;background:#0e1016;padding:14px;min-height:390px}
.day-column.weekend{grid-column:auto}.day-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.day-name{font-weight:900}.count{font-size:11px;border:1px solid #2f3440;border-radius:999px;padding:3px 7px}
.day-slots{display:grid;gap:8px}
.slot{min-height:70px;border:1px dashed #3b404d;border-radius:10px;padding:9px 10px;background:#0c0e14;transition:.18s}
.slot.empty{display:flex;align-items:center;gap:8px;color:#dde0e8;font-size:12px;font-weight:800;cursor:pointer}.slot.empty:hover{border-color:var(--pink);background:#150d12}
.slot.filled{border-style:solid;border-left:3px solid var(--pink);position:relative}
.slot-line{display:flex;justify-content:space-between;gap:8px;align-items:center}.slot-title{font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:145px}
.slot-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px;color:#a8adba;font-size:11px}.slot-actions{display:flex;gap:5px;margin-top:8px}.slot-actions .btn{padding:6px 8px;font-size:11px}
.slot-time{width:74px;padding:5px 7px;font-size:11px}
.calendar-bottom{display:grid;grid-template-columns:repeat(2,minmax(180px,1fr));gap:10px;margin-top:10px;max-width:516px}
.drag{border-color:var(--pink)!important;background:#170d13!important}
.day-drop{min-height:20px}
.week-summary{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0 16px}
.summary-chip{padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#0c0e14;color:#b7bcc9;font-size:12px}

/* Comments AI */
.comments-layout{display:grid;grid-template-columns:minmax(300px,.75fr) minmax(0,1.45fr);gap:16px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}.field textarea{width:100%;min-height:105px;resize:vertical}
.counter-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.counter{padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#0b0d12}
.comment-list{display:grid;gap:10px}.comment-card{border:1px solid var(--line);border-radius:13px;padding:13px;background:#0c0e14}.comment-top{display:flex;justify-content:space-between;gap:10px}.user{font-weight:900}.comment-text{margin:7px 0 10px}.comment-actions{display:flex;gap:7px;flex-wrap:wrap}.draft{margin-top:10px;border-left:3px solid var(--pink);padding:9px 10px;background:#120d12;border-radius:8px}
.liked{color:#ff7fac;border-color:#6c2943!important}.reply-selected{border-color:#ff3f7f!important;background:#170d13!important}
.api-warning{padding:11px 12px;border:1px solid #65491e;border-radius:10px;background:#1b150a;color:#f5cc70;margin-top:12px}
.switch{display:flex;align-items:center;gap:9px}.toggle{width:48px;height:26px;border-radius:999px;background:#333;position:relative}.toggle:after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;background:white;top:3px;left:4px;transition:.2s}.toggle.on{background:var(--green)}.toggle.on:after{left:24px}
.rule-box{padding:10px;border:1px solid var(--line);border-radius:10px;background:#0b0d12;margin-top:10px}
.reply-preview{font-style:italic;color:#e3c8d3}


/* Smart Scheduler — Stage 4 */
.smart-hero{display:grid;grid-template-columns:1.2fr .8fr;gap:16px;margin-bottom:16px}
.smart-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.smart-stat{padding:15px;border:1px solid var(--line);border-radius:13px;background:#0b0d12}
.smart-stat .value{font-size:28px;font-weight:950;margin:5px 0}
.smart-controls{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:14px}
.smart-controls input,.smart-controls select{width:100%}
.smart-week{display:grid;grid-template-columns:repeat(7,minmax(145px,1fr));gap:9px}
.smart-day{border:1px solid var(--line);border-radius:13px;background:#0b0d12;padding:12px;min-height:160px}
.smart-day-title{font-weight:900;margin-bottom:8px}
.smart-time{display:flex;justify-content:space-between;gap:6px;align-items:center;padding:6px 7px;margin:5px 0;border-radius:8px;background:#141720;font-size:12px}
.smart-time.test{border-left:3px solid var(--yellow)}
.smart-time.best{border-left:3px solid var(--green)}
.rank-table{width:100%;border-collapse:collapse}
.rank-table th,.rank-table td{padding:10px;border-bottom:1px solid #222633;text-align:left}
.rank-table th{color:#aeb3c3;font-size:12px}
.scorebar{height:8px;background:#1b1e27;border-radius:999px;overflow:hidden;min-width:100px}
.scorebar>span{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--pink2));border-radius:999px}
.confidence{font-size:11px;font-weight:900;padding:4px 7px;border-radius:999px;background:#152018;color:#79e2ab;border:1px solid #29543a}
.reason-list{display:grid;gap:8px;margin-top:12px}
.reason{padding:10px 12px;border-radius:10px;background:#0b0d12;border:1px solid var(--line)}
.sample-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.sample-grid .field input{width:100%}
.source-pill{display:inline-flex;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:900;background:#1d180d;border:1px solid #6b5220;color:#ffd770}
.smart-alert{padding:11px 12px;border-radius:10px;border:1px solid #29543a;background:#0d1812;color:#8be0b0}
@media(max-width:1200px){.smart-week{grid-template-columns:repeat(4,1fr)}.smart-controls,.sample-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:850px){.smart-hero{grid-template-columns:1fr}.smart-grid{grid-template-columns:repeat(2,1fr)}.smart-week{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.smart-grid,.smart-controls,.sample-grid,.smart-week{grid-template-columns:1fr}}


/* Stage 5 backend */
.backend-pill{display:inline-flex;align-items:center;gap:7px;padding:6px 9px;border-radius:999px;border:1px solid #303543;font-size:12px;font-weight:900}
.backend-pill.online{color:#79e2ab;background:#0b1b13;border-color:#244d34}
.backend-pill.offline{color:#ffcf70;background:#211a0a;border-color:#56451d}
.auth-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.auth-card{padding:14px;border:1px solid var(--line);border-radius:12px;background:#0b0d12}
.auth-card input{width:100%;margin-top:8px}
.cloud-note{padding:10px 12px;border-radius:10px;background:#0c1118;border:1px solid #26364e;color:#b9d7ff;margin-top:10px}


/* SaaS polish */
:root{
  --bg:#07080c;--panel:#0e1118;--panel2:#131722;--line:#242a38;--muted:#8f97aa;
  --text:#f8f9fc;--pink:#ff3b82;--pink2:#8f5cff;--green:#43d38a;--yellow:#f6c85f;--red:#ff7070;
  --blue:#6da9ff;--shadow:0 20px 60px rgba(0,0,0,.28);
}
body{background:
  radial-gradient(circle at 78% -10%,rgba(143,92,255,.13),transparent 28%),
  radial-gradient(circle at 25% 0,rgba(255,59,130,.09),transparent 26%),
  var(--bg)}
.app{grid-template-columns:258px minmax(0,1fr)}
.sidebar{background:rgba(8,10,15,.94);backdrop-filter:blur(18px);padding:22px 16px;border-right:1px solid rgba(255,255,255,.07)}
.brand{font-size:19px;margin:2px 7px 26px}
.logo{width:38px;height:38px;border-radius:12px;box-shadow:0 10px 32px rgba(255,59,130,.24)}

.nav button:hover{background:#11151e;color:#fff;border-color:#222938}
.nav button.active{background:linear-gradient(90deg,rgba(255,59,130,.13),rgba(143,92,255,.07));border:1px solid rgba(255,59,130,.18);border-left:3px solid var(--pink)}
.sidebar-foot{padding-top:14px;border-top:1px solid rgba(255,255,255,.06)}
.mode{display:inline-flex;width:auto;padding:7px 9px;border-radius:999px;font-size:11px}
.main{padding:0 38px 70px;max-width:1600px;width:100%;margin:0 auto}
.topbar{position:sticky;top:0;z-index:25;margin:0 -12px 26px;padding:24px 12px 14px;background:linear-gradient(180deg,rgba(7,8,12,.97) 70%,rgba(7,8,12,.72));backdrop-filter:blur(18px)}
.topbar h1{font-size:30px;letter-spacing:-.04em;margin-bottom:0}
.top-actions{display:flex;align-items:center;gap:10px}
.top-status{display:inline-flex;align-items:center;gap:7px;border:1px solid #263044;background:#0d121c;padding:9px 11px;border-radius:999px;color:#aab4c7;font-size:12px;font-weight:800}
.status-dot{width:7px;height:7px;border-radius:999px;background:var(--green);box-shadow:0 0 0 4px rgba(67,211,138,.09)}
.btn{transition:.16s ease;box-shadow:none}
.btn:hover{transform:translateY(-1px);border-color:#3a4254}
.btn.primary{background:linear-gradient(135deg,#ff3b82,#c742ff);box-shadow:0 10px 26px rgba(255,59,130,.2)}
.card{background:linear-gradient(180deg,rgba(18,22,31,.96),rgba(13,16,23,.96));border-color:rgba(255,255,255,.075);box-shadow:0 14px 38px rgba(0,0,0,.12)}
.saas-hero{position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(320px,.7fr);gap:24px;padding:28px;margin-bottom:18px;border:1px solid rgba(255,255,255,.08);border-radius:20px;background:
 linear-gradient(135deg,rgba(255,59,130,.08),rgba(143,92,255,.05) 45%,rgba(109,169,255,.04)),
 #0d1017;box-shadow:var(--shadow)}
.saas-hero:after{content:"";position:absolute;width:300px;height:300px;border-radius:50%;right:-120px;top:-150px;background:radial-gradient(circle,rgba(143,92,255,.22),transparent 68%);pointer-events:none}
.hero-copy{position:relative;z-index:1}
.hero-badge{display:inline-flex;align-items:center;gap:7px;padding:6px 9px;border-radius:999px;background:#121722;border:1px solid #293144;color:#bac3d3;font-size:11px;font-weight:850;margin-bottom:14px}
.hero-title{font-size:34px;line-height:1.05;letter-spacing:-.045em;margin:0 0 12px;max-width:760px}
.hero-sub{font-size:14px;color:#9ba4b7;max-width:690px;margin:0 0 20px}
.hero-actions{display:flex;gap:9px;flex-wrap:wrap}
.hero-panel{position:relative;z-index:1;display:grid;gap:10px;align-content:start}
.health-item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 13px;border:1px solid #232a38;border-radius:12px;background:rgba(8,10,15,.62)}
.health-item b{font-size:12px}.health-item span{font-size:11px}
.integration-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}
.integration-card{padding:16px;border:1px solid #242b39;border-radius:14px;background:#0b0e14}
.integration-top{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:10px}
.integration-icon{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:#141925;border:1px solid #293142}
.integration-card h3{font-size:13px;margin:0}.integration-card p{font-size:11px;color:#8f97aa;margin:5px 0 0}
.kpi-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{padding:17px}.kpi-head{display:flex;justify-content:space-between;align-items:center;color:#a8afbf;font-size:12px}.kpi-value{font-size:29px;font-weight:950;letter-spacing:-.04em;margin:9px 0 4px}.kpi-delta{font-size:11px;color:#7fdca8}

.mini-list{display:grid;gap:8px}.mini-row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:11px 12px;border:1px solid #222936;border-radius:11px;background:#0b0e14}

.setup-steps{display:grid;gap:10px}.setup-step{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}.setup-num{width:25px;height:25px;border-radius:8px;display:grid;place-items:center;background:#151a24;border:1px solid #2a3241;font-size:11px;font-weight:900;color:#dce1ea}
.setup-step b{font-size:12px}.setup-step div div{font-size:11px;color:#8f97aa;margin-top:3px}
.integration-status{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:900;padding:5px 7px;border-radius:999px}
.integration-status.ok{color:#76dfa6;background:#0e1d15;border:1px solid #27513a}
.integration-status.pending{color:#ffd36f;background:#211a0d;border:1px solid #5b4922}
@media(max-width:1100px){.saas-hero,.workspace-grid{grid-template-columns:1fr}.kpi-grid,.integration-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:650px){.main{padding:0 14px 50px}.topbar{padding-top:18px}.top-status{display:none}.saas-hero{padding:20px}.hero-title{font-size:28px}.kpi-grid,.integration-grid{grid-template-columns:1fr}}

/* misc */
.log{font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;background:#090b10;border:1px solid var(--line);border-radius:12px;padding:12px;max-height:250px;overflow:auto}.log div{padding:5px 0;border-bottom:1px dashed #1c202a}.ok{color:#66db9c}.warn{color:#f5ca67}.err{color:#ff8080}

/* Reel previews + Stage 8 test publishing */
.reel-metric-card{display:grid;grid-template-columns:170px minmax(0,1fr);gap:16px;border:1px solid var(--line);background:#0c0f16;border-radius:14px;padding:12px}

.reel-media video,.reel-media img{width:100%;height:100%;object-fit:cover;display:block}
.reel-media .no-preview{height:100%;display:grid;place-items:center;color:#737b8e;font-size:12px;text-align:center;padding:14px}

.test-preview{width:100%;max-height:520px;aspect-ratio:9/16;background:#050609;border-radius:13px;object-fit:contain;border:1px solid #252b38}
.test-status{padding:11px 12px;border-radius:10px;background:#0b0e14;border:1px solid #2a3140;margin-top:12px;font-size:12px}

.test-status.warn{border-color:#6a5220;color:#ffd36f;background:#1c160a}
.test-status.err{border-color:#6a272d;color:#ff8a91;background:#201013}

.publish-history .row{display:flex;justify-content:space-between;gap:10px;padding:10px 11px;border:1px solid #242b39;border-radius:10px;background:#0b0e14}
@media(max-width:900px){.test-reel-grid{grid-template-columns:1fr}.reel-metric-card{grid-template-columns:110px minmax(0,1fr)}.reel-media{width:110px}}
@media(max-width:560px){.reel-metric-card{grid-template-columns:1fr}.reel-media{width:100%;max-height:420px}}

/* ===== CloudentFlow UI v2 ===== */
:root{
  --bg:#08090c;
  --surface:#0d0f14;
  --surface-2:#11141a;
  --surface-3:#151922;
  --line:#20242d;
  --line-soft:#181b22;
  --text:#f5f6f8;
  --muted:#8b92a1;
  --muted-2:#646b79;
  --accent:#ff3f7f;
  --accent-soft:rgba(255,63,127,.12);
  --green:#4dd48b;
  --yellow:#f2c45c;
  --red:#ff6b72;
  --radius:12px;
  --shadow:0 16px 50px rgba(0,0,0,.22);
}
html{background:var(--bg)}
body{background:var(--bg);font-size:13px;letter-spacing:-.005em}
.app{grid-template-columns:228px minmax(0,1fr)}
.sidebar{padding:18px 12px;background:#090a0e;border-right:1px solid var(--line-soft)}
.brand{padding:0 9px;margin:0 0 18px;font-size:18px;letter-spacing:-.03em}
.brand .logo{width:32px;height:32px;border-radius:9px;background:#f6f6f7;color:#0b0c0f;box-shadow:none;font-size:13px;font-weight:950}
.brand-accent{color:var(--accent)}
.workspace-switch{display:grid;grid-template-columns:34px 1fr auto;gap:9px;align-items:center;padding:9px;border:1px solid var(--line);border-radius:10px;background:#0d0f14;margin:0 2px 20px}
.workspace-avatar,.account-avatar{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:#171a22;border:1px solid #262b36;font-size:10px;font-weight:900;color:#dfe2e8}
.workspace-switch b{display:block;font-size:12px}.workspace-switch span:not(.workspace-caret){display:block;color:var(--muted);font-size:10px;margin-top:1px}.workspace-caret{color:#6f7685}

/* ===== Button motion polish ===== */
@keyframes ctfPrimarySheen{
  0%{transform:translateX(-140%)}
  55%,100%{transform:translateX(180%)}
}
@keyframes ctfPulseRing{
  0%,100%{box-shadow:0 0 0 0 rgba(255,63,127,.00)}
  50%{box-shadow:0 0 0 5px rgba(255,63,127,.06)}
}
button,.btn,.nav button,.quick-actions button,.more-popover button{
  -webkit-tap-highlight-color:transparent;
  transform:translateZ(0);
  transition:
    transform .18s cubic-bezier(.2,.8,.2,1),
    background-color .18s ease,
    border-color .18s ease,
    color .18s ease,
    box-shadow .18s ease,
    opacity .18s ease;
}
button:not(:disabled):hover,
.btn:not(:disabled):hover{
  transform:translateY(-1px);
}
button:not(:disabled):active,
.btn:not(:disabled):active{
  transform:translateY(0) scale(.975);
  transition-duration:.08s;
}
.btn.primary{
  position:relative;
  overflow:hidden;
  isolation:isolate;
  box-shadow:0 7px 18px rgba(255,63,127,.14);
}
.btn.primary::after{
  content:"";
  position:absolute;
  inset:-35% auto -35% -30%;
  width:34%;
  pointer-events:none;
  z-index:-1;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent);
  transform:skewX(-18deg) translateX(-140%);
}
.btn.primary:not(:disabled):hover{
  box-shadow:0 10px 24px rgba(255,63,127,.22);
}
.btn.primary:not(:disabled):hover::after{
  animation:ctfPrimarySheen .9s cubic-bezier(.2,.7,.2,1);
}
.btn.primary:not(:disabled):focus-visible{
  outline:none;
  animation:ctfPulseRing 1.6s ease-in-out infinite;
}
.btn.danger:not(:disabled):hover{
  box-shadow:0 8px 20px rgba(255,107,114,.12);
}
.btn.success:not(:disabled):hover{
  box-shadow:0 8px 20px rgba(77,212,139,.10);
}
.nav button{
  position:relative;
  overflow:hidden;
}
.nav button::after{
  content:"";
  position:absolute;
  left:10px;
  right:10px;
  bottom:4px;
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.10),transparent);
  opacity:0;
  transform:scaleX(.45);
  transition:opacity .18s ease,transform .18s ease;
}
.nav button:hover{
  transform:translateX(2px);
}
.nav button:hover::after{
  opacity:1;
  transform:scaleX(1);
}
.nav button.active{
  transform:none;
}
.nav button .nav-icon{
  transition:transform .18s cubic-bezier(.2,.8,.2,1),color .18s ease;
}
.nav button:hover .nav-icon{
  transform:scale(1.12) rotate(-2deg);
}
.quick-actions button:hover{
  transform:translateY(-2px);
  border-color:#343b48;
  box-shadow:0 10px 24px rgba(0,0,0,.16);
}
.quick-actions button:active{
  transform:translateY(0) scale(.985);
}
.quick-actions button>span{
  transition:transform .18s cubic-bezier(.2,.8,.2,1),background-color .18s ease;
}
.quick-actions button:hover>span{
  transform:scale(1.08);
  background:#1b2029;
}
.more-menu[open] > summary{
  transform:scale(.97);
  background:#191d25;
}
.more-popover{
  transform-origin:top right;
  animation:ctfMenuIn .14s ease-out;
}
@keyframes ctfMenuIn{
  from{opacity:0;transform:translateY(-4px) scale(.985)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
.more-popover button:hover{
  transform:translateX(2px);
}
.top-actions .btn.primary{
  animation:none;
}
button:disabled,.btn:disabled{
  transform:none!important;
  box-shadow:none!important;
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.001ms!important;
    animation-iteration-count:1!important;
    scroll-behavior:auto!important;
    transition-duration:.001ms!important;
  }
}

  animation:none!important;
}
.ui3-kpi,.ui3-panel,.ui31-status-card,.day-column,.reel-instagram-card{
  transition:border-color .14s ease,background-color .14s ease,box-shadow .14s ease!important;
}
.ui3-kpi:hover,.ui3-panel:hover,.ui31-status-card:hover{
  transform:none!important;
  border-color:#292f39!important;
  box-shadow:0 5px 16px rgba(0,0,0,.06)!important;

  transition:background-color .14s ease,border-color .14s ease,color .14s ease,opacity .14s ease!important;
}

.quick-actions button:hover,.nav button:hover,.more-popover button:hover{
  transform:none!important;
}

  transform:scale(.99)!important;
}
.btn.primary{
  box-shadow:0 4px 12px rgba(255,63,127,.10)!important;
}
.btn.primary::after{
  display:none!important;
}
.btn.primary:not(:disabled):hover{
  box-shadow:0 5px 14px rgba(255,63,127,.14)!important;
}

  animation:none!important;
  outline:1px solid rgba(255,99,153,.34)!important;
  outline-offset:2px;
}
.btn.danger:not(:disabled):hover,.btn.success:not(:disabled):hover{

}
.nav button::after{
  display:none!important;
}
.nav button:hover .nav-icon{
  transform:none!important;
}
.quick-actions button>span,.quick-actions button:hover>span{
  transform:none!important;
}
.live-pulse{

}
.live-worker-pill:hover{
  transform:none!important;
}
.more-popover,.activity-drawer,.command-palette{

.booting .page:not(.hidden) .card:after{

/* ===== Live follower analytics ===== */
.follower-analytics-card{padding:17px;margin-bottom:12px}
.follower-card-head{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:12px}
.follower-card-head>div>span{font-size:8px;color:#626b79;font-weight:900;letter-spacing:.1em}
.follower-card-head h3{font-size:14px;margin:2px 0 0}
.follower-source{display:inline-flex;align-items:center;gap:6px}
.follower-source i{width:6px;height:6px;border-radius:50%;background:#4dd48b;box-shadow:0 0 0 3px rgba(77,212,139,.06)}
.follower-live-summary{display:grid;grid-template-columns:1.2fr .8fr 1fr;gap:8px;margin-bottom:10px}
.follower-live-summary>div{padding:11px 12px;border:1px solid #1d222b;border-radius:9px;background:#0a0c10}
.follower-live-summary small,.follower-live-summary strong,.follower-live-summary b,.follower-live-summary span{display:block}
.follower-live-summary small{font-size:7.5px;color:#626b79;font-weight:900;letter-spacing:.08em}
.follower-live-summary strong{font-size:25px;line-height:1;margin:5px 0 3px;letter-spacing:-.04em}
.follower-live-summary span{font-size:8px;color:#707988}
.follower-today b{font-size:20px;line-height:1;margin:5px 0 4px}
.follower-today.positive b{color:#65da99}.follower-today.negative b{color:#ff7c83}
.follower-live-state{display:flex!important;align-items:center;gap:9px}
.follower-live-state>i{width:8px;height:8px;border-radius:50%;background:#6a727f;flex:0 0 8px}
.follower-live-state>i.on{background:#4dd48b}
.follower-live-state b{font-size:9px}.follower-live-state span{font-size:8px;margin-top:2px}
.follower-chart{height:330px;border-radius:11px;background:#090b0f;border:1px solid #191d24;padding:14px 14px 8px}
.follower-chart svg{width:100%;height:282px;overflow:visible}
.follower-dot{fill:#090b0f;stroke:#ff4c88;stroke-width:3;vector-effect:non-scaling-stroke}
.follower-dot.latest{fill:#ff4c88;stroke:#ff8bb4}
.follower-chart-labels{display:flex;justify-content:space-between;color:#606978;font-size:8px}
.follower-chart-empty{height:300px;display:grid;place-items:center;text-align:center;color:#6a7382}
.follower-chart-empty b,.follower-chart-empty span{display:block}.follower-chart-empty b{color:#c8ccd4;font-size:11px}.follower-chart-empty span{font-size:9px;margin-top:4px}
@keyframes followerBump{0%{transform:scale(1);color:#fff}45%{transform:scale(1.06);color:#65da99}100%{transform:scale(1);color:#fff}}
.follower-count-bump{animation:followerBump .45s ease-out}
@media(max-width:800px){.follower-live-summary{grid-template-columns:1fr 1fr}.follower-live-state{grid-column:1/-1}}
@media(max-width:520px){.follower-live-summary{grid-template-columns:1fr}.follower-live-state{grid-column:auto}.follower-chart{height:285px}.follower-chart svg{height:238px}}

function defaultSmartSamples(){
  const rows=[], times=["09:00","12:00","15:00","18:00","21:00"];
  const hourFactor={"09:00":0.70,"12:00":0.91,"15:00":0.78,"18:00":1.08,"21:00":1.24};
  const today=new Date(); today.setHours(12,0,0,0);
  for(let back=1;back<=21;back++){
    const d=new Date(today); d.setDate(today.getDate()-back);
    const dow=d.getDay();
    const dayFactor=[1.12,0.92,0.96,1.00,1.03,1.10,1.16][dow];
    times.forEach((time,j)=>{
      const noise=0.87+(((back*13+j*17+dow*5)%27)/100);
      const factor=hourFactor[time]*dayFactor*noise;
      const reach=Math.max(800,Math.round(5200*factor));
      const views=Math.round(reach*(1.08+((back+j)%7)/100));
      const likes=Math.round(reach*(0.042+((j+dow)%5)*0.004));
      const comments=Math.max(2,Math.round(reach*(0.0025+((back+j)%4)*0.0005)));
      const shares=Math.max(2,Math.round(reach*(0.004+((j+dow)%4)*0.001)));
      const saves=Math.max(2,Math.round(reach*(0.005+((back+dow)%5)*0.001)));
      rows.push({
        id:`demo-${back}-${j}`,date:localISO(d),time,views,reach,likes,comments,shares,saves,source:"demo"
      });
    });
  }
  return rows;
}

async function authRequest(path,options={}){
  const headers={"apikey":SUPABASE_KEY,"Content-Type":"application/json",...(options.headers||{})};
  const res=await fetch(SUPABASE_URL+"/auth/v1"+path,{...options,headers});
  let data=null;try{data=await res.json()}catch{}
  if(!res.ok)throw new Error(data?.msg||data?.message||data?.error_description||data?.error||("Erro "+res.status));
  return data;
}
function persistCloudSession(session){
  cloudSession=session||null;
  if(session)localStorage.setItem(SESSION_KEY,JSON.stringify(session));
  else localStorage.removeItem(SESSION_KEY);
}
async function refreshCloudSession(){
  if(!cloudSession?.refresh_token)return false;
  try{
    const r=await authRequest("/token?grant_type=refresh_token",{
      method:"POST",body:JSON.stringify({refresh_token:cloudSession.refresh_token})
    });
    persistCloudSession(r);return true;
  }catch(e){persistCloudSession(null);return false}
}
function withTimeout(promise,ms,label="operação"){
  return Promise.race([
    Promise.resolve(promise),
    new Promise((_,reject)=>setTimeout(()=>reject(new Error(label+" demorou demais")),ms))
  ]);
}
async function initCloud(){
  try{cloudSession=JSON.parse(localStorage.getItem(SESSION_KEY)||"null")}catch{cloudSession=null}
  if(!cloudSession)return;

  if(cloudSession?.expires_at && cloudSession.expires_at*1000<Date.now()+60000){
    await withTimeout(refreshCloudSession(),4000,"renovação da sessão").catch(()=>false);
  }
  if(!cloudSession)return;

  await withTimeout(testBackend(),4000,"conexão com servidor").catch(()=>{backendOnline=false});
  if(!backendOnline)return;

    withTimeout(loadAutomationStatus(),4500,"automação"),
    withTimeout(loadFollowerStats(30),4500,"seguidores"),
    withTimeout(loadPlatformAccounts(),4500,"contas")

}

async function cloudFetch(path="",options={},retry=true){
  if(!cloudSession) throw new Error("Faça login no CloudentFlow primeiro.");
  const headers={...(options.headers||{}),Authorization:"Bearer "+cloudSession.access_token,apikey:SUPABASE_KEY};
  const res=await fetch(EDGE_URL+path,{...options,headers});
  if(res.status===401&&retry&&await refreshCloudSession())return cloudFetch(path,options,false);
  let data=null;try{data=await res.json()}catch{}
  if(!res.ok)throw new Error(data?.user_message||data?.error||data?.message||("Erro "+res.status));
  return data;
}
async function edgeFetch(fullUrl,options={},retry=true){
  if(!cloudSession) throw new Error("Faça login no CloudentFlow primeiro.");
  const headers={...(options.headers||{}),Authorization:"Bearer "+cloudSession.access_token,apikey:SUPABASE_KEY};
  const res=await fetch(fullUrl,{...options,headers});
  if(res.status===401&&retry&&await refreshCloudSession())return edgeFetch(fullUrl,options,false);
  let data=null;try{data=await res.json()}catch{}
  if(!res.ok){
    const message=data?.user_message||data?.message||data?.error||("Erro "+res.status);
    const err=new Error(message);
    err.code=data?.error||null;
    err.details=data?.details||null;
    throw err;
  }
  return data;
}

    automationWorkerStatus={online:false,worker:null,error:e.message};
  }
}

async function loadFollowerStats(days=30){
  if(!cloudSession){followerStats=null;return}
  try{
    const previous=Number(followerStats?.current?.followers_count??NaN);
    const next=await edgeFetch(IG_FOLLOWERS_STATUS_URL+"?days="+days,{method:"GET"});
    const current=Number(next?.current?.followers_count??NaN);
    followerChanged=Number.isFinite(previous)&&Number.isFinite(current)&&previous!==current;
    followerStats=next;
  }catch(e){
    followerStats={current:null,daily:[],worker:null,error:e.message};
    console.warn("Follower status unavailable:",e);
  }
}

  }

async function loadInstagramMetricsStored(){
  if(!cloudSession||!instagramIntegration?.enabled)return;
  try{
    const stored=await edgeFetch(IG_METRICS_URL+"?timezone=America/Recife&days=120",{method:"GET"});
    liveInstagramMetrics=stored.media||[];
    mergeInstagramIntoSmartSamples(liveInstagramMetrics);
  }catch(e){

  }
}
function mergeInstagramIntoSmartSamples(media=[]){
  if(media.length)state.smartSamples=state.smartSamples.filter(s=>s.source!=="demo");
  for(const m of media){
    if(!m?.timestamp)return;
    const d=new Date(m.timestamp);
    const id="instagram-"+String(m.id||m.record_id||m.timestamp);
    const existing=state.smartSamples.findIndex(s=>s.id===id);
    const row={
      id,source:"instagram",
      date:localISO(d),
      time:String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"),
      views:+m.views||0,reach:+m.reach||0,likes:+m.likes||0,comments:+m.comments||0,shares:+m.shares||0,saves:+m.saves||0
    };
    if(existing>=0)state.smartSamples[existing]=row;else state.smartSamples.push(row);
  }
  save();
}

async function syncFromBackend(){

    const d=new Date(row.scheduled_at);
    const date=localISO(d), time=String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");

      size:v.size_bytes||0,type:v.mime_type||"video/mp4",caption:v.caption||"",storagePath:v.storage_path||"",
      time,status:row.status||"scheduled",scheduledAt:row.scheduled_at,platform:row.platform||"instagram",smartMode:row.smart_mode||"manual",smartStrategy:row.smart_strategy||(row.smart_mode==="auto"?"tested":"manual"),smartStrategyLocked:!!row.smart_strategy_locked

function weekDates(){
  const start=new Date(state.weekStart+"T00:00:00");return Array.from({length:7},(_,i)=>{const d=new Date(start);d.setDate(start.getDate()+i);return d})
}

function filledCount(date){return dateSlots(date).length}

function minutesOf(time){
  if(!/^\d{2}:\d{2}$/.test(time||"")) return NaN;
  const [h,m]=time.split(":").map(Number);
  if(h<0||h>23||m<0||m>59) return NaN;
  return h*60+m;
}
function dateSlots(date,ignoreKey=null){
  return Object.entries(state.slots)
    .filter(([k,v])=>v && k.startsWith(date+"#") && k!==ignoreKey)
    .map(([k,v])=>({key:k,...v}));
}
function validateSchedule(date,time,ignoreKey=null){
  const mins=minutesOf(time);
  if(!Number.isFinite(mins)) return {ok:false,msg:"Horário inválido."};
  const items=dateSlots(date,ignoreKey);
  if(items.length>=12) return {ok:false,msg:"Limite de 12 vídeos manuais por dia atingido."};
  for(const item of items){
    const other=minutesOf(item.time);
    if(other===mins) return {ok:false,msg:`Já existe um vídeo às ${time}.`};
    if(Math.abs(other-mins)<state.minGap) return {ok:false,msg:`Mantenha pelo menos ${state.minGap} minutos entre os vídeos.`};
  }
  return {ok:true};
}

function firstValidDefaultSlot(date,ignoreKey=null){
  for(let i=0;i<7;i++){
    const k=keyFor(date,i);
    if(!state.slots[k] || k===ignoreKey){
      const time=state.defaultTimes[i]||"12:00";
      if(validateSchedule(date,time,ignoreKey).ok) return {slot:i,time};
    }
  }
  return null;
}

    agendado:"agendado",fila:"fila",publicando:"publicando",publicado:"publicado",erro:"erro"
  })[s]||"agendado";
}
function statusLabel(s){

}
function statusClass(s){
  if(s==="publicado") return "green";
  if(s==="erro"||s==="cancelado") return "red";
  if(s==="fila"||s==="publicando") return "yellow";

}

const WEEKDAY_NAMES=["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];

function median(values){
  if(!values.length)return 0;
  const a=[...values].sort((x,y)=>x-y),m=Math.floor(a.length/2);
  return a.length%2?a[m]:(a[m-1]+a[m])/2;
}
function clamp(n,min,max){return Math.max(min,Math.min(max,n))}
function sampleScore(s){
  const reach=Math.max(1,+s.reach||1),views=Math.max(0,+s.views||0);
  const viewRate=clamp(views/reach,0,2);
  const likeRate=(+s.likes||0)/reach*100;
  const commentRate=(+s.comments||0)/reach*100;
  const shareRate=(+s.shares||0)/reach*100;
  const saveRate=(+s.saves||0)/reach*100;
  // Taxas ganham mais peso que volume absoluto para reduzir viés de um único vídeo gigante.
  return (
    Math.log10(reach+10)*10 +
    viewRate*18 +
    likeRate*2.2 +
    commentRate*6.0 +
    shareRate*8.0 +
    saveRate*8.0
  );
}
function sampleWeight(s){
  const age=Math.max(0,(Date.now()-new Date(s.date+"T12:00:00").getTime())/86400000);
  const halfLife=30;
  return Math.pow(.5,age/halfLife);
}
function recentSamples(){
  const days=state.smartSettings.lookbackDays;
  const cutoff=Date.now()-days*86400000;
  return state.smartSamples.filter(s=>new Date(s.date+"T23:59:59").getTime()>=cutoff);
}
function robustWeightedScore(samples,prior=0){
  if(!samples.length)return {score:prior,n:0,raw:prior,confidence:0};
  const values=samples.map(sampleScore),med=median(values);
  const mad=median(values.map(v=>Math.abs(v-med)))||1;
  let sum=0,weights=0;
  samples.forEach((s,i)=>{
    const clipped=clamp(values[i],med-2.5*mad,med+2.5*mad);
    const w=sampleWeight(s);sum+=clipped*w;weights+=w
  });
  const raw=weights?sum/weights:med;
  // Bayesian shrinkage: horários com pouca amostra ficam puxados para a média geral.
  const priorWeight=Math.max(1,state.smartSettings.minSamples);
  const score=(raw*weights+prior*priorWeight)/(weights+priorWeight);
  const confidence=Math.round(clamp((samples.length/state.smartSettings.minSamples)*65 + Math.min(35,weights*7),0,100));
  return {score,n:samples.length,raw,confidence};
}
function globalPriorScore(){
  const samples=recentSamples();if(!samples.length)return 60;
  return median(samples.map(sampleScore));
}
function hourBucket(time){return Number(String(time).slice(0,2))}
function weekdayOfSample(s){return new Date(s.date+"T12:00:00").getDay()}
function statsForHour(hour,weekday=null){
  const samples=recentSamples(),prior=globalPriorScore();
  const exact=samples.filter(s=>hourBucket(s.time)===hour && (weekday===null||weekdayOfSample(s)===weekday));
  return robustWeightedScore(exact,prior);
}
function estimatedHourScore(hour,weekday){
  const day=statsForHour(hour,weekday),global=statsForHour(hour,null),prior=globalPriorScore();
  if(day.n){
    const w=state.smartSettings.daySpecificWeight/100;
    return {score:day.score*w+global.score*(1-w),n:day.n,confidence:Math.round(day.confidence*w+global.confidence*(1-w)),direct:true};
  }
  if(global.n)return {score:global.score*.97,n:0,confidence:Math.round(global.confidence*.55),direct:false};
  // Interpola horas sem dados usando vizinhos conhecidos e uma penalidade leve.
  const known=[];
  for(let h=8;h<=23;h++){
    const st=statsForHour(h,weekday);
    if(st.n)known.push({h,score:st.score,confidence:st.confidence})
  }
  if(!known.length)return {score:prior*.9,n:0,confidence:5,direct:false};
  known.sort((a,b)=>Math.abs(a.h-hour)-Math.abs(b.h-hour));
  const nearest=known.slice(0,2);
  const score=nearest.reduce((a,x)=>a+x.score/(1+Math.abs(x.h-hour)),0)/
    nearest.reduce((a,x)=>a+1/(1+Math.abs(x.h-hour)),0);
  return {score:score*.94,n:0,confidence:Math.round(nearest[0].confidence*.35),direct:false};
}
function smartCandidates(date,fixedTimes=[]){
  const weekday=new Date(date+"T12:00:00").getDay();
  const fixed=fixedTimes.map(minutesOf).filter(Number.isFinite);
  const rows=[];
  for(let h=8;h<=23;h++){
    const time=String(h).padStart(2,"0")+":00",mins=h*60;
    if(fixed.some(x=>Math.abs(x-mins)<state.minGap))continue;
    const st=estimatedHourScore(h,weekday);
    rows.push({time,mins,...st})
  }
  return rows;
}
function recommendTimesForDate(date,fixedTimes=[],limit=state.postsPerDay){
  const settings=state.smartSettings,candidates=smartCandidates(date,fixedTimes);
  const exploreCount=settings.exploration<=0?0:Math.max(1,Math.round(limit*settings.exploration/100));
  const exploitCount=Math.max(0,limit-exploreCount);
  const chosen=[],canUse=c=>chosen.every(x=>Math.abs(x.mins-c.mins)>=state.minGap);

  [...candidates].sort((a,b)=>b.score-a.score).forEach(c=>{
    if(chosen.filter(x=>x.mode==="best").length>=exploitCount)return;
    if(canUse(c))chosen.push({...c,mode:"best"})
  });

  [...candidates]
    .filter(c=>!chosen.some(x=>x.time===c.time))
    .sort((a,b)=>(a.n-b.n)||(b.score-a.score))
    .forEach(c=>{
      if(chosen.length>=limit)return;
      if(canUse(c))chosen.push({...c,mode:"test"})
    });

  [...candidates].sort((a,b)=>b.score-a.score).forEach(c=>{
    if(chosen.length>=limit)return;
    if(!chosen.some(x=>x.time===c.time)&&canUse(c))chosen.push({...c,mode:"best"})
  });

  return chosen.sort((a,b)=>a.mins-b.mins).slice(0,limit);
}
function aggregateDayStats(){
  const samples=recentSamples(),prior=globalPriorScore();
  return Array.from({length:7},(_,dow)=>{
    const subset=samples.filter(s=>weekdayOfSample(s)===dow);
    return {dow,...robustWeightedScore(subset,prior)}
  })
}
function bestGlobalHour(){
  const rows=[];for(let h=8;h<=23;h++){const st=estimatedHourScore(h,1);const global=statsForHour(h,null);rows.push({hour:h,time:String(h).padStart(2,"0")+":00",score:global.n?global.score:st.score,n:global.n,confidence:global.confidence})}
  return rows.sort((a,b)=>b.score-a.score)[0]
}
function smartConfidence(){
  const samples=recentSamples(),days=new Set(samples.map(s=>weekdayOfSample(s))).size;
  let trusted=0;
  for(let dow=0;dow<7;dow++)for(let h=8;h<=23;h++)if(statsForHour(h,dow).n>=state.smartSettings.minSamples)trusted++;
  const sampleFactor=Math.min(1,samples.length/100),coverage=Math.min(1,trusted/35),dayFactor=days/7;
  const pct=Math.round((sampleFactor*.45+coverage*.35+dayFactor*.20)*100);
  return {pct,label:pct>=75?"Alta":pct>=45?"Média":"Baixa",trusted,total:samples.length}
}
function rankingRows(){
  const rows=[];
  for(let dow=0;dow<7;dow++){
    for(let h=8;h<=23;h++){
      const st=statsForHour(h,dow);
      if(st.n)rows.push({dow,h,time:String(h).padStart(2,"0")+":00",...st})
    }
  }
  return rows.sort((a,b)=>b.score-a.score);
}

function optimizeFutureCalendar(){
  if(!state.smartSettings.enabled){alert("Ative o Smart Scheduler primeiro.");return}
  if(!confirm("Reorganizar os horários futuros usando as recomendações atuais? Os vídeos continuam nos mesmos dias."))return;
  const now=new Date();let changed=0;
  const dates=[...new Set(Object.keys(state.slots).map(k=>k.split("#")[0]))].sort();
  dates.forEach(date=>{
    const end=new Date(date+"T23:59:59");if(end<now)return;
    const entries=Object.entries(state.slots)
      .filter(([k,x])=>k.startsWith(date+"#")&&x)
      .sort((a,b)=>minutesOf(a[1].time)-minutesOf(b[1].time));
    const fixed=entries.filter(([,x])=>["publicado","publicando"].includes(getStatus(x)));
    const movable=entries.filter(([,x])=>!["publicado","publicando"].includes(getStatus(x)));
    if(!movable.length)return;
    const fixedTimes=fixed.map(([,x])=>x.time);
    const recs=recommendTimesForDate(date,fixedTimes,movable.length);
    movable.forEach(([k,x],idx)=>{
      const rec=recs[idx];if(!rec)return;
      if(x.time!==rec.time){
        x.time=rec.time;x.smartMode=rec.mode;
        const [h,m]=rec.time.split(":").map(Number),at=new Date(date+"T00:00:00");at.setHours(h,m,0,0);x.scheduledAt=at.toISOString();
        changed++
      }
    })
  });
  state.smartSettings.lastRun=new Date().toISOString();syncQueue();
  log(`Smart Scheduler ajustou ${changed} horário(s) futuro(s) sem trocar os vídeos de dia.`,"ok")
}

}

function smartRecommendationsForDate(date){
  const dow=new Date(date+"T12:00:00").getDay();
  return (automationData?.recommendations||[])
    .filter(r=>Number(r.weekday)===dow)
    .sort((a,b)=>Number(a.rank)-Number(b.rank));
}
function smartChoiceForSlot(date,preferredIndex=0){
  const recs=smartRecommendationsForDate(date);
  if(!recs.length)return {
    time:state.defaultTimes[preferredIndex]||"12:00",
    strategy:"tested",
    recommendation:null
  };
  const order=[...recs.slice(preferredIndex),...recs.slice(0,preferredIndex)];
  for(const r of order){
    const t=String(r.recommended_time||"").slice(0,5);
    if(t&&validateSchedule(date,t).ok)return {
      time:t,
      strategy:r.recommendation_type==="test"?"test":"tested",
      recommendation:r
    };
  }
  return {time:state.defaultTimes[preferredIndex]||"12:00",strategy:"tested",recommendation:null};
}

async function addVideoToSlot(file,date,slot,time=null,caption="",smartMode="auto",smartStrategy=null){
  const choice=smartMode==="auto"?smartChoiceForSlot(date,slot):null;
  const t=time||(choice?.time||(state.defaultTimes[slot]||"12:00"));
  const strategy=smartStrategy||(smartMode==="auto"?(choice?.strategy||"tested"):"manual");
  const valid=validateSchedule(date,t);
  if(!valid.ok){alert(valid.msg);return false}
  if(state.slots[keyFor(date,slot)]){alert("Essa posição já está ocupada.");return false}
  if(!cloudSession){alert("Entre na sua conta do CloudentFlow em Configurações para salvar vídeos no backend.");showPage("settings");return false}
  const [h,m]=t.split(":").map(Number),at=new Date(date+"T00:00:00");at.setHours(h,m,0,0);
  const fd=new FormData();fd.append("file",file);fd.append("scheduled_at",at.toISOString());fd.append("caption",caption);fd.append("smart_mode",smartMode);fd.append("smart_strategy",strategy);fd.append("platform","instagram");
  const res=await cloudFetch("?action=upload",{method:"POST",body:fd});
  const schedule=res.schedule,video=res.video;
  state.slots[keyFor(date,slot)]={cloud:true,scheduleId:schedule.id,videoId:video.id,name:video.file_name,size:video.size_bytes||file.size,type:video.mime_type||file.type,storagePath:video.storage_path||"",time:t,caption,status:"scheduled",scheduledAt:schedule.scheduled_at,smartMode,smartStrategy:schedule.smart_strategy||strategy,smartStrategyLocked:!!schedule.smart_strategy_locked};
  save();log(`${file.name} enviado ao Storage e agendado no backend para ${date} às ${t}.`,"ok");return true
}

async function getScheduledPreviewUrl(x){
  if(!x?.cloud)return null;
  if(!x.storagePath)throw new Error("Caminho do vídeo não encontrado.");
  if(!cloudSession)throw new Error("Faça login para abrir o vídeo.");
  const encoded=x.storagePath.split("/").map(encodeURIComponent).join("/");
  const r=await fetch(SUPABASE_URL+"/storage/v1/object/sign/videos/"+encoded,{
    method:"POST",
    headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+cloudSession.access_token,"Content-Type":"application/json"},
    body:JSON.stringify({expiresIn:3600})
  });
  let data=null;try{data=await r.json()}catch{}
  if(!r.ok)throw new Error(data?.message||data?.error||"Não consegui abrir o vídeo.");
  const signed=data?.signedURL||data?.signedUrl;
  if(!signed)throw new Error("URL temporária indisponível.");
  return signed.startsWith("http")?signed:SUPABASE_URL+"/storage/v1"+signed;
}

function setMetricsPeriod(days){metricsPeriod=days;metrics()}

function aggregateMetricsByDay(rows){
  const map=new Map();
  for(const m of rows){
    const d=new Date(m.timestamp);
    const key=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    const cur=map.get(key)||{date:key,views:0,reach:0,likes:0,saves:0,count:0};
    cur.views+=+m.views||0;cur.reach+=+m.reach||0;cur.likes+=+m.likes||0;cur.saves+=+m.saves||0;cur.count++;
    map.set(key,cur);
  }
  return [...map.values()].sort((a,b)=>a.date.localeCompare(b.date));
}
function analyticsChart(rows,metric="views"){
  const data=aggregateMetricsByDay(rows);
  if(!data.length)return '<div class="ui3-chart-empty">Sem dados para este período.</div>';
  const label={views:"views",reach:"alcance",likes:"curtidas"}[metric]||metric;
  const W=1000,H=300,P=34,max=Math.max(1,...data.map(x=>+x[metric]||0));
  const pts=data.map((m,i)=>{
    const x=data.length===1?W/2:P+i*(W-P*2)/(data.length-1);
    const y=H-P-(+m[metric]||0)/(max*1.12)*(H-P*2);
    return {x,y,m};
  });
  let line="";
  pts.forEach((p,i)=>{
    if(i===0)line+=`M ${p.x.toFixed(1)} ${p.y.toFixed(1)}`;
    else{
      const prev=pts[i-1],mx=((prev.x+p.x)/2).toFixed(1);
      line+=` C ${mx} ${prev.y.toFixed(1)}, ${mx} ${p.y.toFixed(1)}, ${p.x.toFixed(1)} ${p.y.toFixed(1)}`;
    }
  });

function followerChart(stats){
  const data=(stats?.daily||[]).map(x=>({...x,value:Number(x.current_count||0)}));
  if(!data.length)return '<div class="follower-chart-empty"><b>Monitoramento iniciado.</b><span>O histórico diário começa a ser formado a partir de agora.</span></div>';

  const W=1000,H=280,P=36;
  const vals=data.map(x=>x.value);
  const min=Math.min(...vals),max=Math.max(...vals),spread=Math.max(4,max-min);
  const low=min-Math.max(2,spread*.18),high=max+Math.max(2,spread*.18);
  const pts=data.map((m,i)=>{
    const x=data.length===1?W/2:P+i*(W-P*2)/(data.length-1);
    const y=H-P-((m.value-low)/(high-low))*(H-P*2);
    return {x,y,m};
  });

  let line="";
  pts.forEach((p,i)=>{
    if(i===0)line+=`M ${p.x.toFixed(1)} ${p.y.toFixed(1)}`;
    else{
      const prev=pts[i-1],mx=((prev.x+p.x)/2).toFixed(1);
      line+=` C ${mx} ${prev.y.toFixed(1)}, ${mx} ${p.y.toFixed(1)}, ${p.x.toFixed(1)} ${p.y.toFixed(1)}`;
    }
  });
  const area=data.length>1?line+` L ${pts[pts.length-1].x.toFixed(1)} ${H-P} L ${pts[0].x.toFixed(1)} ${H-P} Z`:"";

  return `<div class="follower-chart">
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      <defs><linearGradient id="followersFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ff3f7f" stop-opacity=".24"/><stop offset="100%" stop-color="#ff3f7f" stop-opacity="0"/></linearGradient></defs>
      <g class="chart-grid"><line x1="36" y1="65" x2="964" y2="65"/><line x1="36" y1="140" x2="964" y2="140"/><line x1="36" y1="215" x2="964" y2="215"/></g>
      ${area?`<path d="${area}" fill="url(#followersFill)"/>`:""}
      ${data.length>1?`<path d="${line}" fill="none" stroke="#ff4c88" stroke-width="4" vector-effect="non-scaling-stroke" stroke-linecap="round"/>`:""}
      ${pts.map((p,i)=>`<circle class="follower-dot ${i===pts.length-1?"latest":""}" cx="${p.x}" cy="${p.y}" r="${i===pts.length-1?7:5}"><title>${new Date(p.m.day+"T12:00:00").toLocaleDateString("pt-BR")} · ${p.m.value.toLocaleString("pt-BR")} seguidores · ${Number(p.m.net_change||0)>=0?"+":""}${Number(p.m.net_change||0)} no dia</title></circle>`).join("")}
    </svg>
    <div class="follower-chart-labels"><span>${new Date(data[0].day+"T12:00:00").toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"})}</span><span>Histórico diário</span><span>${new Date(data[data.length-1].day+"T12:00:00").toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"})}</span></div>
  </div>`;
}

function reelTimelineLabel(snapshot,publishedAt){

function localMetricParts(ts){
  const tz=automationData?.settings?.timezone||"America/Recife";
  const parts=new Intl.DateTimeFormat("en-US",{
    timeZone:tz,weekday:"short",hour:"2-digit",minute:"2-digit",hour12:false
  }).formatToParts(new Date(ts));
  const g=t=>parts.find(x=>x.type===t)?.value||"";
  const dowMap={Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6};
  return {weekday:dowMap[g("weekday")]??0,hour:Number(g("hour")||0),minute:Number(g("minute")||0)};
}
function recommendationSupport(rec){
  const target=Number(String(rec.recommended_time).slice(0,2))*60+Number(String(rec.recommended_time).slice(3,5));
  const sameDay=liveInstagramMetrics.filter(m=>{
    if(!m.timestamp)return false;
    const p=localMetricParts(m.timestamp);
    const mins=p.hour*60+p.minute;
    return p.weekday===Number(rec.weekday)&&Math.abs(mins-target)<=75;
  });
  const nearby=sameDay.sort((a,b)=>(+b.views||0)-(+a.views||0));
  const best=nearby[0]||null;
  return {count:nearby.length,best};
}
function smartConfidenceLabel(rec){
  if(rec.recommendation_type==="test")return {label:"Teste",cls:"test",icon:"🧪"};
  const c=Number(rec.confidence||0);
  return {label:"Testado",cls:c>=80?"strong":"good",icon:"✓"};
}
function smartReason(rec){
  const s=recommendationSupport(rec);
  if(rec.recommendation_type==="test"){
    return {
      main:"Horário escolhido para teste controlado",
      extra:"O sistema vai comparar o resultado em 30min, 2h, 6h, 24h e 48h"
    };
  }
  if(s.best){
    const p=localMetricParts(s.best.timestamp);
    const hh=String(p.hour).padStart(2,"0")+":"+String(p.minute).padStart(2,"0");
    return {
      main:"Reel de "+Number(s.best.views||0).toLocaleString("pt-BR")+" views às "+hh,
      extra:(s.count===1?"1 Reel próximo desse horário":s.count+" Reels próximos desse horário")
    };
  }
  return {
    main:Number(rec.sample_count||0)+" amostra"+(Number(rec.sample_count||0)===1?"":"s")+" no modelo",
    extra:"Horário ainda em fase de aprendizado"
  };
}

async function loadProductionData(forcePreviews=false){
  if(!cloudSession){productionData=null;return}
  const previousPreviews=productionData?.previews||{};
  const previousSignature=productionData?.previewSignature||"";
  const [queue,status]=await Promise.all([
    cloudFetch("?resource=production"),
    cloudFetch("?resource=runninghub-status").catch(e=>({error:e.message}))
  ]);
  const signature=(queue.jobs||[]).slice(0,30).map(j=>j.id).join("|");
  let previews=previousPreviews;
  if(currentPage==="production"&&(forcePreviews||!Object.keys(previews).length||signature!==previousSignature)){
    const p=await cloudFetch("?resource=production-previews").catch(()=>({previews:{}}));
    previews=p.previews||{};
  }
  productionData={...queue,runninghubStatus:status,previews,previewSignature:signature};
}

function productionStatusMeta(status){
  const map={
    waiting:["Aguardando envio","waiting"],
    uploading:["Enviando arquivos","uploading"],
    queued:["Na fila do RunningHub","queued"],
    running:["Gerando","running"],
    ready:["Pronto","ready"],
    failed:["Erro","failed"],
    cancelled:["Cancelado","cancelled"]
  };
  const x=map[status]||[status||"Aguardando","waiting"];
  return {label:x[0],cls:x[1]};
}

function productionCounts(){
  const jobs=productionData?.jobs||[];
  const today=new Date().toISOString().slice(0,10);
  return {
    total:jobs.filter(j=>!["ready","cancelled"].includes(j.status)).length,
    running:jobs.filter(j=>["uploading","queued","running"].includes(j.status)).length,
    ready:jobs.filter(j=>j.status==="ready"&&String(j.completed_at||"").slice(0,10)===today).length,
    failed:jobs.filter(j=>j.status==="failed").length
  };
}

function formatProductionSeconds(seconds){
  const s=Math.max(0,Math.floor(Number(seconds)||0));
  const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;
  return h>0
    ? String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")+":"+String(sec).padStart(2,"0")
    : String(m).padStart(2,"0")+":"+String(sec).padStart(2,"0");
}
function productionElapsedSeconds(j){
  const apiRuntime=Number(j?.runninghub_runtime_seconds);
  if(j?.status==="ready"&&Number.isFinite(apiRuntime)&&apiRuntime>0)return apiRuntime;
  if(!j?.started_at)return 0;
  const start=new Date(j.started_at).getTime();
  const end=j.completed_at?new Date(j.completed_at).getTime():Date.now();
  return Math.max(0,(end-start)/1000);
}
function syncProductionElapsed(){
  document.querySelectorAll(".production-elapsed[data-started]").forEach(el=>{
    const start=Number(el.dataset.started||0);
    const completed=Number(el.dataset.completed||0);
    const runtime=Number(el.dataset.runtime||0);
    const done=el.dataset.done==="1";
    const seconds=done&&runtime>0?runtime:Math.max(0,((completed||Date.now())-start)/1000);
    el.textContent=(done?"Tempo total ":"Decorrido ")+formatProductionSeconds(seconds);
  });
}
function ensureProductionTicker(){

function productionCreditUsage(j){
  const exact=Number(j?.credits_used);
  if(Number.isFinite(exact)&&exact>0)return {value:exact,live:false};

  const before=Number(j?.credits_before);
  const current=Number(productionData?.runninghubStatus?.credits);
  const active=["uploading","queued","running"].includes(j?.status);
  const latestWithCredit=(productionData?.jobs||[]).find(x=>x?.credits_before!==null&&x?.credits_before!==undefined);
  const canEstimate=active||(j?.status==="ready"&&latestWithCredit?.id===j?.id);

  if(canEstimate&&Number.isFinite(before)&&Number.isFinite(current)){
    const delta=Math.max(0,before-current);
    if(delta>0)return {value:delta,live:true};
  }
  return null;
}

async function extractFirstFrameBlob(videoUrl){
  return new Promise((resolve,reject)=>{
    const video=document.createElement("video");
    video.muted=true;video.playsInline=true;video.preload="auto";
    let done=false;
    const fail=msg=>{if(done)return;done=true;video.remove();reject(new Error(msg))};
    const capture=()=>{
      if(done)return;
      try{
        const w=video.videoWidth,h=video.videoHeight;
        if(!w||!h)return fail("Não consegui ler o primeiro frame.");
        const canvas=document.createElement("canvas");
        canvas.width=w;canvas.height=h;
        const ctx=canvas.getContext("2d");
        ctx.drawImage(video,0,0,w,h);
        canvas.toBlob(blob=>{
          if(!blob)return fail("Falha ao gerar o primeiro frame.");
          done=true;video.remove();resolve(blob);
        },"image/jpeg",0.96);
      }catch(e){fail(e.message||"Falha ao capturar frame.")}
    };
    video.onerror=()=>fail("Não consegui abrir o arquivo de vídeo.");
    video.onloadedmetadata=()=>{
      try{
        const target=Math.min(0.01,Math.max(0,(video.duration||0)/1000));
        if(video.seekable?.length&&target>0)video.currentTime=target;
      }catch{}
    };
    video.onseeked=capture;
    video.onloadeddata=()=>setTimeout(()=>{if(!done)capture()},100);
    video.src=videoUrl;
    video.load();
    setTimeout(()=>fail("Tempo esgotado ao extrair o primeiro frame."),30000);
  });
}
async function cleanupFrameSource(path){
  if(!path)return;
  try{
    await cloudFetch("?action=frame-source",{
      method:"DELETE",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({path})
    });
  }catch{}
}
function releaseFrameResult(row){
  if(row?.blobUrl)URL.revokeObjectURL(row.blobUrl);
  if(row?.videoBlobUrl)URL.revokeObjectURL(row.videoBlobUrl);
}
function frameVideoExtension(blob,source){
  if(source?.extension)return source.extension;
  const type=String(blob?.type||"").toLowerCase();
  if(type.includes("webm"))return "webm";
  if(type.includes("quicktime"))return "mov";
  return "mp4";
}
function friendlyFrameError(message){
  const m=String(message||"");
  if(m.includes("instagram_login_required"))return "Esse Reel exige login, é privado ou não está acessível publicamente.";
  if(m.includes("instagram_public_extract_failed"))return "Não consegui resolver esse Reel público agora. Tente novamente.";
  if(m.includes("instagram_video_not_resolved"))return "Não consegui acessar o vídeo.";
  if(m.includes("instagram_video_fetch_failed"))return "O Instagram bloqueou o download desse vídeo. Tente novamente.";
  if(m.includes("video_too_large"))return "Esse vídeo é grande demais para o extrator.";
  return m||"Falha ao processar esse Reel.";
}
async function resolvePublicInstagramFallback(url){
  const res=await fetch("/api/instagram",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({url})
  });
  let data=null;try{data=await res.json()}catch{}
  if(!res.ok)throw new Error(data?.error||data?.message||("instagram_fallback_"+res.status));
  return data;
}
async function processFrameRow(row){
  let cleanupPath=null;
  try{
    row.status="resolving";row.error=null;frameExtractorPage();
    let source=null;
    try{
      source=await cloudFetch("?action=frame-source",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({url:row.link})
      });
      cleanupPath=source.cleanup_path;
      source.fetch_url=source.video_url;
      source.resolver=source.resolver||"instagram-official";
    }catch(primaryError){
      const fallback=await resolvePublicInstagramFallback(row.link);
      source={
        fetch_url:fallback.proxy_url,
        extension:fallback.extension||"mp4",
        resolver:fallback.resolver||"yt-dlp",
        thumbnail_url:fallback.thumbnail_url||null
      };
    }

    row.resolver=source.resolver||null;
    row.status="downloading";frameExtractorPage();

    const response=await fetch(source.fetch_url);
    if(!response.ok){
      let problem="Falha ao carregar o vídeo resolvido.";
      try{const d=await response.json();problem=d?.error||d?.message||problem}catch{}
      throw new Error(problem);
    }
    const videoBlob=await response.blob();
    if(!videoBlob.size)throw new Error("O arquivo de vídeo veio vazio.");

    row.videoBlob=videoBlob;
    row.videoBlobUrl=URL.createObjectURL(videoBlob);
    row.videoFileName="Vídeo "+row.index+"."+frameVideoExtension(videoBlob,source);

    row.status="extracting";frameExtractorPage();
    const frameBlob=await extractFirstFrameBlob(row.videoBlobUrl);
    row.blob=frameBlob;
    row.blobUrl=URL.createObjectURL(frameBlob);
    row.fileName="Frame "+row.index+".jpg";
    row.status="ready";
  }catch(e){
    row.status="error";
    row.error=friendlyFrameError(e.message);
  }finally{
    await cleanupFrameSource(cleanupPath);
    frameExtractorPage();
  }
}
async function processFrameLinks(){

  frameExtractorResults=links.map((link,i)=>({

function cloudentAISnapshot(){
  const metrics=[...liveInstagramMetrics];
  const totals=metrics.reduce((a,m)=>({
    views:a.views+(+m.views||0),
    reach:a.reach+(+m.reach||0),
    likes:a.likes+(+m.likes||0),
    comments:a.comments+(+m.comments||0),
    shares:a.shares+(+m.shares||0),
    saves:a.saves+(+m.saves||0)
  }),{views:0,reach:0,likes:0,comments:0,shares:0,saves:0});
  const best=[...metrics].sort((a,b)=>(+b.views||0)-(+a.views||0))[0]||null;
  const followers=Number(followerStats?.current?.followers_count||0);
  const daily=followerStats?.daily||[];
  const todayFollower=daily[daily.length-1]||null;
  const followerDelta=Number(todayFollower?.net_change||0);
  const weekday=new Date().getDay();
  const recs=(automationData?.recommendations||[]).filter(r=>+r.weekday===weekday).sort((a,b)=>+a.rank-+b.rank);
  const future=allScheduled().filter(x=>new Date(x.scheduledAt).getTime()>=Date.now() && !["publicado","erro","cancelado"].includes(getStatus(x)));
  const workers=automationData?.workers||[];
  const pub=workers.find(w=>w.worker_name==="instagram_publish");
  const aut=workers.find(w=>w.worker_name==="automation");
  return {metrics,totals,best,followers,followerDelta,recs,future,pub,aut};
}
