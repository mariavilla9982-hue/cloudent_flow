  return [...new Set(String(frameExtractorLinksText||"").split(/\s+/).map(x=>x.trim()).filter(Boolean))];
}
async function extractFirstFrameBlob(videoUrl){
  return new Promise((resolve,reject)=>{
    const video=document.createElement("video");
    video.muted=true;video.playsInline=true;video.preload="auto";
    let done=false;
    const fail=msg=>{if(done)return;done=true;video.remove();reject(new Error(msg))};
    const capture=()=>{
      if(done)return;
      try{
        const w=video.videoWidth,h=video.videoHeight;
        if(!w||!h)return fail("Não consegui ler o primeiro frame.");
        const canvas=document.createElement("canvas");
        canvas.width=w;canvas.height=h;
        const ctx=canvas.getContext("2d");
        ctx.drawImage(video,0,0,w,h);
        canvas.toBlob(blob=>{
          if(!blob)return fail("Falha ao gerar o primeiro frame.");
          done=true;video.remove();resolve(blob);
        },"image/jpeg",0.96);
      }catch(e){fail(e.message||"Falha ao capturar frame.")}
    };
    video.onerror=()=>fail("Não consegui abrir o arquivo de vídeo.");
    video.onloadedmetadata=()=>{
      try{
        const target=Math.min(0.01,Math.max(0,(video.duration||0)/1000));
        if(video.seekable?.length&&target>0)video.currentTime=target;
      }catch{}
    };
    video.onseeked=capture;
    video.onloadeddata=()=>setTimeout(()=>{if(!done)capture()},100);
    video.src=videoUrl;
    video.load();
    setTimeout(()=>fail("Tempo esgotado ao extrair o primeiro frame."),30000);
  });
}

function releaseFrameResult(row){

function frameVideoExtension(blob,source){
  if(source?.extension)return source.extension;
  const type=String(blob?.type||"").toLowerCase();
  if(type.includes("webm"))return "webm";
  if(type.includes("quicktime"))return "mov";
  return "mp4";
}
function friendlyFrameError(message){
  const m=String(message||"");
  if(m.includes("instagram_login_required"))return "Esse Reel exige login, é privado ou não está acessível publicamente.";
  if(m.includes("instagram_public_extract_failed"))return "O Instagram bloqueou a rota pública desse Reel. O CloudentFlow vai tentar a rota alternativa.";
  if(m.includes("instagram_video_not_resolved"))return "Não consegui acessar o vídeo.";
  if(m.includes("instagram_video_fetch_failed"))return "O Instagram bloqueou o download desse vídeo. Tente novamente.";
  if(m.includes("instagram_identity_mismatch"))return "O Instagram devolveu outro Reel. O CloudentFlow bloqueou o resultado para não baixar vídeo errado.";
  if(m.includes("instagram_identity_unverified"))return "Não consegui confirmar que o vídeo pertence exatamente a esse Reel. Tente novamente.";
  if(m.includes("instagram_web_session_expired"))return "Sua sessão do Instagram expirou. Atualize o sessionid em Configurações > Integrações.";
  if(m.includes("Conecte sua sessão do Instagram"))return m;
  if(m.includes("O Instagram não liberou esse Reel para a sessão conectada"))return m;
  if(m.includes("video_too_large"))return "Esse vídeo é grande demais para o extrator.";
  return m||"Falha ao processar esse Reel.";
}
async function resolvePublicInstagramFallback(url){
  const res=await fetch("/api/instagram",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({url})
  });
  let data=null;try{data=await res.json()}catch{}
  if(!res.ok)throw new Error(data?.error||data?.message||("instagram_fallback_"+res.status));
  return data;
}
async function processFrameRow(row){
  let cleanupPath=null;
  try{
    row.status="resolving";row.error=null;frameExtractorPage();
    let source=null;
    let publicError=null;
    let cloudError=null;

    const resolveFromCloud=async()=>{
      const resolved=await cloudFetch("?action=frame-source",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({url:row.link})
      });
      cleanupPath=resolved.cleanup_path;
      resolved.fetch_url=resolved.video_url;
      resolved.resolver=resolved.resolver||"instagram-exact-context";
      if(resolved.identity_verified!==true)throw new Error("instagram_identity_mismatch");
      return resolved;
    };
    const resolveFromPublic=async()=>{
      const exact=await resolvePublicInstagramFallback(row.link);
      if(exact.identity_verified!==true)throw new Error("instagram_identity_unverified");
      return {
        fetch_url:exact.proxy_url,
        extension:exact.extension||"mp4",
        resolver:exact.resolver||"yt-dlp",
        thumbnail_url:exact.thumbnail_url||null,
        identity_verified:true,
        requested_shortcode:exact.requested_shortcode||null
      };
    };

    if(instagramWebSession?.configured){
      try{source=await resolveFromCloud()}catch(e){cloudError=e}
      if(!source){try{source=await resolveFromPublic()}catch(e){publicError=e}}
    }else{
      try{source=await resolveFromPublic()}catch(e){publicError=e}
      if(!source){try{source=await resolveFromCloud()}catch(e){cloudError=e}}
    }
    if(!source)throw cloudError||publicError||new Error("instagram_video_not_resolved");
    row.resolver=source.resolver||null;
    row.status="downloading";frameExtractorPage();

    const response=await fetch(source.fetch_url);
    if(!response.ok){
      let problem="Falha ao carregar o vídeo resolvido.";
      try{const d=await response.json();problem=d?.error||d?.message||problem}catch{}
      throw new Error(problem);
    }
    const videoBlob=await response.blob();
    if(!videoBlob.size)throw new Error("O arquivo de vídeo veio vazio.");

    row.videoBlob=videoBlob;
    row.videoBlobUrl=URL.createObjectURL(videoBlob);
    row.videoFileName="Vídeo "+row.index+"."+frameVideoExtension(videoBlob,source);

    row.status="extracting";frameExtractorPage();
    const frameBlob=await extractFirstFrameBlob(row.videoBlobUrl);
    row.blob=frameBlob;
    row.blobUrl=URL.createObjectURL(frameBlob);
    row.fileName="Frame "+row.index+".jpg";
    row.status="ready";
  }catch(e){
    row.status="error";
    row.error=friendlyFrameError(e.message);
  }finally{
    await cleanupFrameSource(cleanupPath);
    frameExtractorPage();
  }
}
async function processFrameLinks(){
  if(frameExtractorBusy)return;
  const links=frameLinks();
  if(!links.length){toast("Cole pelo menos um link do Instagram.","err");return}
  frameExtractorBusy=true;
  frameExtractorResults.forEach(releaseFrameResult);
  frameExtractorResults=links.map((link,i)=>({
    link,index:i+1,status:"waiting",blobUrl:null,videoBlobUrl:null,error:null
  }));
  frameExtractorPage();

  for(const row of frameExtractorResults)await processFrameRow(row);

  frameExtractorBusy=false;frameExtractorPage();
  const ready=frameExtractorResults.filter(x=>x.status==="ready").length;
  if(ready)toast(ready+" Reel"+(ready===1?" processado.":"s processados."),"ok");
  else toast("Nenhum Reel pôde ser processado.","err");
}
async function retryFrameResult(index){
  if(frameExtractorBusy)return;
  const row=frameExtractorResults[index];
  if(!row)return;
  releaseFrameResult(row);
  row.blobUrl=null;row.videoBlobUrl=null;row.error=null;
  frameExtractorBusy=true;frameExtractorPage();
  await processFrameRow(row);
  frameExtractorBusy=false;frameExtractorPage();
}
function triggerFrameDownload(url,name){

}

  const s=plan?.summary||{},bits=[];
  if(Array.isArray(s.observe_minutes)&&s.observe_minutes[1])bits.push(s.observe_minutes[0]===s.observe_minutes[1]?s.observe_minutes[0]+" min feed":s.observe_minutes[0]+"–"+s.observe_minutes[1]+" min feed");
  if(Array.isArray(s.likes)&&s.likes[1])bits.push("até "+s.likes[1]+" curtidas");
  if(Array.isArray(s.follows)&&s.follows[1])bits.push((s.follows[0]?s.follows[0]+"–":"até ")+s.follows[1]+" follows");
  if(Array.isArray(s.replies)&&s.replies[1])bits.push((s.replies[0]||0)+"–"+s.replies[1]+" respostas");
  if(Array.isArray(s.posts)&&s.posts[1])bits.push(s.posts[0]===s.posts[1]?s.posts[1]+" post":"post opcional");

function cloudentAISnapshot(){
  const metrics=[...liveInstagramMetrics];
  const totals=metrics.reduce((a,m)=>({
    views:a.views+(+m.views||0),
    reach:a.reach+(+m.reach||0),
    likes:a.likes+(+m.likes||0),
    comments:a.comments+(+m.comments||0),
    shares:a.shares+(+m.shares||0),
    saves:a.saves+(+m.saves||0)
  }),{views:0,reach:0,likes:0,comments:0,shares:0,saves:0});
  const best=[...metrics].sort((a,b)=>(+b.views||0)-(+a.views||0))[0]||null;
  const followers=Number(followerStats?.current?.followers_count||0);
  const daily=followerStats?.daily||[];
  const todayFollower=daily[daily.length-1]||null;
  const followerDelta=Number(todayFollower?.net_change||0);
  const weekday=new Date().getDay();
  const recs=(automationData?.recommendations||[]).filter(r=>+r.weekday===weekday).sort((a,b)=>+a.rank-+b.rank);
  const future=allScheduled().filter(x=>new Date(x.scheduledAt).getTime()>=Date.now() && !["publicado","erro","cancelado"].includes(getStatus(x)));
  const workers=automationData?.workers||[];
  const pub=workers.find(w=>w.worker_name==="instagram_publish");
  const aut=workers.find(w=>w.worker_name==="automation");
  return {metrics,totals,best,followers,followerDelta,recs,future,pub,aut};
}

function aiFormat(n){return Number(n||0).toLocaleString("pt-BR")}
function buildCloudentAIResponse(question){
  const q=String(question||"").toLowerCase().trim();
  const d=cloudentAISnapshot();
  const bestTime=d.recs[0]?String(d.recs[0].recommended_time).slice(0,5):null;
  const bestCaption=d.best?.caption?String(d.best.caption).replace(/\s+/g," ").slice(0,90):"Sem legenda";
  const engagement=d.totals.reach?((d.totals.likes+d.totals.comments+d.totals.shares+d.totals.saves)/d.totals.reach*100):0;
  const next=d.future[0];

  if(/hor[aá]rio|quando.*post|melhor.*hora|postar/.test(q)){
    if(!bestTime)return "Ainda não tenho recomendação suficiente para hoje. O Smart Scheduler precisa de mais amostras reais antes de eu confiar em um horário.";
    const r=d.recs[0];
    return `Hoje, o horário mais forte nos dados atuais é ${bestTime}, com ${r.confidence}% de confiança. ${d.recs[1]?"A segunda opção é "+String(d.recs[1].recommended_time).slice(0,5)+".":""} Eu usaria isso como referência, não como garantia de views.`;
  }
  if(/seguidor|crescimento|crescer/.test(q)){
    if(!d.followers)return "Ainda não recebi a contagem atual de seguidores.";
    return `A conta está com ${aiFormat(d.followers)} seguidores. Hoje o monitor registrou ${d.followerDelta>=0?"+":""}${d.followerDelta}. O rastreador consulta a conta a cada minuto, então mudanças aparecem automaticamente no CloudentFlow.`;
  }
  if(/melhor.*reel|melhor.*v[ií]deo|mais views|viral|vencedor/.test(q)){
    if(!d.best)return "Ainda não tenho Reels carregados para comparar.";
    return `O Reel com mais views entre os dados carregados tem ${aiFormat(d.best.views)} views e ${aiFormat(d.best.likes)} curtidas. A legenda começa com: “${bestCaption}”. Posso usar esse vídeo como referência para comparar horário, alcance e engajamento com os demais.`;
  }
  if(/calend[aá]rio|pr[oó]ximo.*post|agenda|fila/.test(q)){
    if(!d.future.length)return "Não há publicações futuras na fila agora.";
    return `Existem ${d.future.length} posts futuros. O próximo é “${next.name||"Vídeo"}” em ${fmtDateTime(next.scheduledAt)}. ${next.smartMode==="auto"?"Esse horário foi otimizado pelo Smart Scheduler.":"Esse horário está marcado como manual."}`;
  }
  if(/status|worker|autom[aá]t|funcionando|online/.test(q)){
    return `Publicação 24/7: ${d.pub?.online?"online":"sem confirmação recente"}. Métricas + Scheduler: ${d.aut?.online?"online":"sem confirmação recente"}. Há ${d.future.length} posts futuros na fila.`;
  }
  if(/engaj|curtida|coment|salv|compart/.test(q)){
    return `Nos dados carregados: ${aiFormat(d.totals.likes)} curtidas, ${aiFormat(d.totals.comments)} comentários, ${aiFormat(d.totals.shares)} compartilhamentos e ${aiFormat(d.totals.saves)} salvamentos. O engajamento agregado sobre alcance está em aproximadamente ${engagement.toFixed(2).replace(".",",")}%. Esse número é uma leitura simples do conjunto, não uma previsão.`;
  }
  if(/o que.*fa[çc]o|recomenda|melhorar|views|insight|resumo/.test(q)){
    const parts=[];
    if(bestTime)parts.push(`Seu melhor horário estimado hoje é ${bestTime}`);
    if(d.best)parts.push(`seu Reel líder tem ${aiFormat(d.best.views)} views`);
    if(d.followers)parts.push(`a conta está com ${aiFormat(d.followers)} seguidores (${d.followerDelta>=0?"+":""}${d.followerDelta} hoje)`);
    if(d.future.length)parts.push(`há ${d.future.length} posts futuros já preparados`);
    return (parts.length?parts.join(". ")+". ":"Ainda há poucos dados para um resumo completo. ")+"Eu priorizaria repetir padrões dos Reels que já performaram melhor e testar os horários sugeridos pelo Scheduler, comparando resultado por alguns dias.";
  }

  return `Consigo analisar agora: melhores horários, seguidores, melhor Reel, engajamento, próximos posts e status da automação. Como este é o Beta local, perguntas muito abertas ainda são respondidas com base nesses dados estruturados. Depois podemos conectar um modelo de IA para conversa livre.`;

function sendCloudentAI(prefill=null){

function systemFmtBytes(value){
  const n=Number(value||0);
  if(n>=1073741824)return (n/1073741824).toFixed(n>=10737418240?0:2).replace(".",",")+" GB";
  if(n>=1048576)return (n/1048576).toFixed(n>=104857600?0:1).replace(".",",")+" MB";
  if(n>=1024)return (n/1024).toFixed(1).replace(".",",")+" KB";
  return n.toLocaleString("pt-BR")+" B";
}
function systemPct(used,limit){
  const u=Number(used||0),l=Number(limit||0);
  return l?Math.max(0,Math.min(100,u/l*100)):0;
}
function systemLevel(pct){
  return pct>=90?"critical":pct>=70?"warn":"ok";
}
function systemUsageCard(title,used,limit,detail=""){
  const p=systemPct(used,limit),level=systemLevel(p);
  return '<div class="system-usage-card '+level+'">'+
    '<div class="system-usage-card-head"><div><small>'+esc(title)+'</small><b>'+systemFmtBytes(used)+' <em>/ '+systemFmtBytes(limit)+'</em></b></div><strong>'+p.toFixed(1).replace(".",",")+'%</strong></div>'+
    '<div class="system-meter"><i style="width:'+p+'%"></i></div>'+
    '<span>'+esc(detail|| (level==="critical"?"Crítico":level==="warn"?"Atenção":"Saudável"))+'</span>'+
  '</div>';
}
function systemWorkerLabel(name){
  return ({instagram_publish:"Publicação Instagram",automation:"Métricas + Scheduler",followers:"Seguidores",production:"Produção IA",trial_reels:"Trial Reels",media_cleaner:"Media Cleaner",x_warmup:"Aquecimento X",notifications:"Notificações"})[name]||name;
}

  const h=systemHealthData,u=h.usage||{},limits=h.limits||{},counts=u.counts||{},buckets=u.buckets||{};

  const storage=systemPct(u.storage_bytes,limits.storage_bytes);

        '<div class="system-meter"><i style="width:'+egressPct+'%"></i></div>'+

function safeRenderPage(id,fn){
  try{fn()}
  catch(err){
    console.error("CloudentFlow render error:",id,err);
    const el=$("#"+id);
    if(el)el.innerHTML=`<div class="card"><div class="empty-state-v2"><b>Não consegui carregar esta área.</b><span>${esc(err?.message||"Erro inesperado")}</span><button class="btn btn-sm" onclick="renderAll()">Tentar novamente</button></div></div>`;
  }
}
function renderAll(){
  if(cloudSession&&cloudAccess?.role!=="admin"&&currentPage!=="xStudio"){if(cloudAccess?.role==="x_user")currentPage="xStudio";else return;}

  // Renderiza somente a tela visível. Antes, cada atualização reconstruía as 11
  // páginas escondidas também, criando travadas perceptíveis durante navegação.
  const renderers={
    overview,
    calendar:calendarPage,
    trialReels:trialReelsPage,
    bulkPublish:bulkPublishPage,
    faceSwap:faceSwapPage,
    upscale:()=>window.ImagePipeline?.render("upscale"),
    faceSwapPhoto:()=>window.ImagePipeline?.render("faceSwapPhoto"),
    production:productionPage,
    frameExtractor:frameExtractorPage,
    xStudio:xStudioPage,
    tiktokStudio:tiktokStudioPage,
    metrics,
    reelDetail:reelDetailPage,
    smartTimes:smartTimesPage,
    automation:automationPage,
    cloudentAI:cloudentAIPage,
    settings
  };
  const fn=renderers[currentPage]||overview;
  safeRenderPage(currentPage,fn);
  const side=$("#sidebarAccount"),stat=$("#sidebarAccountStatus");
  if(side)side.textContent=instagramIntegration?.enabled?"@"+(instagramIntegration.account_label||"Instagram"):"CloudentFlow";
  if(stat)stat.textContent=instagramIntegration?.enabled?"Instagram conectado":"Abrir configurações";
  const avatar=$("#sidebarInstagramAvatar"),avatarWrap=$("#sidebarInstagramAvatarWrap");
  const avatarUrl=String(instagramIntegration?.config?.profile_picture_url||"").trim();
  if(avatar&&avatarWrap){
    if(avatarUrl){
      if(avatar.getAttribute("src")!==avatarUrl)avatar.setAttribute("src",avatarUrl);
      avatar.hidden=false;avatarWrap.classList.add("has-photo");
      avatar.onerror=()=>{avatar.hidden=true;avatarWrap.classList.remove("has-photo")};
    }else{
      avatar.removeAttribute("src");avatar.hidden=true;avatarWrap.classList.remove("has-photo");
    }
  }
  updateLiveChrome();
}

async function init(){
  applySidebarState();
  nav();
  bindSidebarHover();
  renderAll();
  syncMobileChrome();
  document.body.classList.add("booting");
  openDB().catch(err=>console.warn("IndexedDB unavailable:",err));

  const bootFailsafe=setTimeout(()=>{
    if(!cloudLoading)return;
    cloudLoading=false;
    document.body.classList.remove("booting");
    renderAll();
  },5500);

  try{
    await withTimeout(initCloud(),20000,"inicialização");
  }catch(err){
    console.warn("Cloud boot continued in background:",err);
  }finally{
    clearTimeout(bootFailsafe);
    cloudLoading=false;
    document.body.classList.remove("booting");
    syncAuthGate();
    renderAll();
  }

  if(cloudAccess?.role==='admin')await handleInstagramOAuthReturn().catch(err=>console.warn("Instagram OAuth return:",err));
  await handleXOAuthReturn().catch(err=>console.warn("X OAuth return:",err));

  const runDeferred=()=>loadDeferredCloudData();
  if("requestIdleCallback" in window)requestIdleCallback(runDeferred,{timeout:1500});
  else setTimeout(runDeferred,250);

  const quickPicker=$("#videoPicker");
  if(quickPicker)quickPicker.onchange=()=>handleQuickSlotVideo(quickPicker);
  const trialPicker=$("#trialVideoPicker");
  if(trialPicker)trialPicker.onchange=()=>handleTrialVideoPicker(trialPicker);
  const bulkPicker=$("#bulkVideoPicker");
  if(bulkPicker)bulkPicker.onchange=()=>handleBulkVideoPicker(bulkPicker);

  const newVideoBtn=$("#newVideoBtn");
  if(newVideoBtn)newVideoBtn.onclick=()=>{
    showPage("calendar");
    if(canAccessPage("calendar"))setTimeout(openScheduleModal,0);
  };

  document.addEventListener("keydown",e=>{
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();openCommandPalette()}
    if(e.key==="Escape"){closeCommandPalette();if($("#activityPanelHost")?.classList.contains("open"))toggleActivityPanel()}
  });
  setInterval(()=>{if(cloudSession&&!document.hidden)refreshLiveData(false)},60000);
}

async function xUploadThumbnail(ticket,file){
 if(!ticket.thumbnail)return null;
 let src;try{const blob=await new Promise((resolve,reject)=>{const video=document.createElement('video');video.muted=true;video.preload='auto';src=URL.createObjectURL(file);const timeout=setTimeout(()=>{video.removeAttribute('src');reject(new Error('preview timeout'));},10000);video.onerror=()=>{clearTimeout(timeout);reject(new Error('preview unavailable'));};video.onloadeddata=()=>{const canvas=document.createElement('canvas'),scale=Math.min(1,480/video.videoWidth);canvas.width=Math.max(1,Math.round(video.videoWidth*scale));canvas.height=Math.max(1,Math.round(video.videoHeight*scale));canvas.getContext('2d').drawImage(video,0,0,canvas.width,canvas.height);clearTimeout(timeout);canvas.toBlob(b=>b?resolve(b):reject(new Error('preview unavailable')),'image/jpeg',0.75);video.removeAttribute('src');};video.src=src;});await xPutVideo(ticket.thumbnail,blob);return ticket.thumbnail.object_path;}catch{return null;}finally{if(src)URL.revokeObjectURL(src);}
}
async function xPutVideo(ticket,file){await new Promise((resolve,reject)=>{const xhr=new XMLHttpRequest();xhr.open('PUT',ticket.upload_url);xhr.setRequestHeader('Content-Type',ticket.content_type);xhr.onload=()=>xhr.status>=200&&xhr.status<300?resolve():reject(new Error('Falha no upload: '+xhr.status));xhr.onerror=()=>reject(new Error('Falha de conexão no upload.'));xhr.send(file);});}
async function addXPostingBatch(){
 if(xPostingBusy)return;
 const generation=xAccountGeneration,files=[...xPostingFiles],drafts=xBatchDrafts;
 if(drafts.some(d=>!d.account_ids.length)){toast('Selecione as contas de destino.','err');return;}
 if(drafts.some(d=>!d.caption.trim())){toast('Defina a legenda de cada vídeo.','err');return;}
 xPostingBusy=true;
 try{for(let i=0;i<files.length;i++){
  const file=files[i],d=drafts[i],ids=[...d.account_ids];if(d.done)continue;
  try{
   if(generation!==xAccountGeneration)throw new Error('A conta foi alterada. Reabra o lote.');
   const mime=file.type||(/\.mov$/i.test(file.name)?'video/quicktime':'video/mp4');
   const scheduled=d.date?xScheduleIso(d.date):null;
   if(!d.ticket){d.ticket=await xPostingRequest('upload-ticket',{platform_account_id:ids[0],size_bytes:file.size,mime_type:mime,file_name:file.name});await xPutVideo(d.ticket,file);d.uploaded=true;}
   else if(!d.uploaded){await xPutVideo(d.ticket,file);d.uploaded=true;}
   if(!d.ticket.thumbnail_path)d.ticket.thumbnail_path=await xUploadThumbnail(d.ticket,file);
   await xPostingRequest('upload-complete',{platform_account_id:ids[0],platform_account_ids:ids,object_path:d.ticket.object_path,provider:d.ticket.provider,thumbnail_path:d.ticket.thumbnail_path,size_bytes:file.size,mime_type:mime,file_name:file.name,caption:d.caption,reply_text:d.reply,scheduled_at:scheduled});
   d.done=true;d.status='Adicionado';d.error='';
  }catch(e){d.error=e.message;}
 }}finally{xPostingBusy=false;await loadXPostingStatus();if(drafts.every(d=>d.done)){xPostingFiles=[];xPostingFile=null;xBatchDrafts=[];xComposeOpen=false;toast('Lote adicionado.','ok');}xStudioPage();}
}

function xPermissionChecks(prefix,ids=[]){return `<div class="x-targets">${(xMembersData?.accounts||xAccountList).map(a=>`<label><input type="checkbox" data-x-permission="${esc(prefix)}" value="${a.id}" ${ids.includes(a.id)?'checked':''}>${esc(a.account_label||a.username||a.id)}</label>`).join('')||'<small>Nenhuma conta X cadastrada.</small>'}</div>`;}
function xCheckedPermissions(prefix){return [...document.querySelectorAll('[data-x-permission="'+prefix+'"]:checked')].map(el=>el.value);}
function xMembersMarkup(){return `<section class="x-settings-note"><h3>Usuários do X Studio</h3><label>Email do convidado<input id="xInviteEmail" type="email" placeholder="email@exemplo.com"></label>${xPermissionChecks('invite')}<label><input id="xInviteSendEmail" type="checkbox" checked> Enviar convite por email</label><button class="x-subtle-btn" onclick="xCreateInvite()">Convidar para o X Studio</button><p id="xInviteResult"></p><button class="x-subtle-btn" onclick="xLoadMembers()">Atualizar usuários e permissões</button>${(xMembersData?.members||[]).map(m=>`<div class="x-batch-row"><p>${esc(m.email||m.user_id)} · ${m.enabled?'Ativo':'Desativado'}</p>${m.role==='x_user'?`${xPermissionChecks(m.user_id,m.account_ids)}<button class="x-subtle-btn" onclick="xSaveMemberAccounts('${m.user_id}')">Salvar contas autorizadas</button><button class="x-subtle-btn" onclick="xSetMember('${m.user_id}',${!m.enabled})">${m.enabled?'Desativar':'Ativar'}</button><button class="x-subtle-btn" onclick="xRemoveMember('${m.user_id}')">Remover acesso</button>`:'<small>Administrador · acesso total</small>'}</div>`).join('')}${(xMembersData?.invitations||[]).map((m,i)=>`<div class="x-batch-row"><p>${esc(m.email)} · ${m.status==='pending'?'Convite pendente':'Desativado / expirado'}</p>${xPermissionChecks('pending'+i,m.account_ids)}<button class="x-subtle-btn" onclick="xUpdateInvite(${i},false)">Salvar contas do convite</button><button class="x-subtle-btn" onclick="xUpdateInvite(${i},true)">Revogar convite</button></div>`).join('')}</section>`;}
async function xMembersAction(action,body){return cloudFetch('?resource=members&action='+action,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});}
async function xLoadMembers(){try{xMembersData=await cloudFetch('?resource=members');xStudioPage();}catch(e){toast(e.message,'err');}}
async function xSetMember(id,enabled){try{await xMembersAction('set-enabled',{user_id:id,enabled});await xLoadMembers();}catch(e){toast(e.message,'err');}}
async function xSaveMemberAccounts(id){try{await xMembersAction('set-accounts',{user_id:id,account_ids:xCheckedPermissions(id)});await xLoadMembers();toast('Permissões atualizadas.','ok');}catch(e){toast(e.message,'err');}}
async function xRemoveMember(id){try{await xMembersAction('remove-access',{user_id:id});await xLoadMembers();}catch(e){toast(e.message,'err');}}
async function xUpdateInvite(i,revoke){const m=xMembersData.invitations[i];try{await xMembersAction(revoke?'revoke-invite':'invite-accounts',{email:m.email,account_ids:xCheckedPermissions('pending'+i)});await xLoadMembers();}catch(e){toast(e.message,'err');}}
async function xCreateInvite(){try{const email=document.getElementById('xInviteEmail').value;const r=await xMembersAction('invite',{email,account_ids:xCheckedPermissions('invite'),send_email:document.getElementById('xInviteSendEmail').checked});const el=document.getElementById('xInviteResult');el.textContent=(r.email_sent?'Convite enviado. ':r.email_error?r.email_error+' ':'')+'Link individual válido por 24 horas: ';const a=document.createElement('a');a.href=r.url;a.textContent='Abrir convite';a.rel='noreferrer';el.appendChild(a);xMembersData=null;}catch(e){toast(e.message,'err');}}
async function xDuplicatePost(id){try{await xPostingRequest('duplicate',{id});await refreshXPosting();toast('Cópia adicionada à fila.','ok');}catch(e){toast(e.message,'err');}}
window.addEventListener('hashchange',()=>{const page=location.hash.slice(1);if(cloudAccess?.role==='x_user'&&page&&page!=='xStudio')deniedPage();});

let calendarTrialDraft=null;
async function openCalendarTrialModal(scheduleId){
  try{
    const [queue,options]=await Promise.all([cloudFetch('?resource=queue'),cloudFetch('?resource=calendar-trial')]);
    const row=queue.find(s=>s.id===scheduleId);if(!row)throw new Error('Publicação não encontrada.');
    calendarTrialDraft={row,videos:options.videos||[]};
    const locked=!['scheduled','queued'].includes(row.status)||Date.parse(row.scheduled_at)<=Date.now()||row.pretrial?.container_id||['processing','container_created','publishing','published'].includes(row.pretrial?.status);
    const account=calendarInstagramAccounts().find(a=>a.id===row.platform_account_id);
    const candidates=calendarTrialDraft.videos.filter(v=>!v.platform_account_id||v.platform_account_id===row.platform_account_id);
    $('#modalHost').innerHTML=`<div class="modal"><div class="modal-box"><div class="modal-head"><b>Reels Teste</b><button class="btn" onclick="closeModal()">Fechar</button></div>
      <p>${esc(account?.account_label||'Instagram')} · Reels principal: ${esc(row.videos?.file_name||'Vídeo')} · ${new Date(row.scheduled_at).toLocaleString('pt-BR')}</p>
      <p>Teste: ${row.pretrial?.scheduled_at?new Date(row.pretrial.scheduled_at).toLocaleString('pt-BR'):'20 minutos antes'} · ${esc(row.pretrial?.status||'aguardando')}</p>
      <div class="field"><label><input type="radio" name="trialMode" value="same" ${!row.trial_video_id?'checked':''} ${locked?'disabled':''} onchange="document.getElementById('trialVideoChoice').disabled=true"> Usar mesmo vídeo</label>
      <label><input type="radio" name="trialMode" value="separate" ${row.trial_video_id?'checked':''} ${locked?'disabled':''} onchange="document.getElementById('trialVideoChoice').disabled=false"> Escolher vídeo separado</label></div>
      <div class="field"><label>Vídeo pronto da Produção IA</label><select id="trialVideoChoice" ${locked||!row.trial_video_id?'disabled':''}><option value="">Escolha um vídeo</option>${candidates.map(v=>`<option value="${esc(v.id)}" ${v.id===row.trial_video_id?'selected':''}>${esc(v.file_name)}</option>`).join('')}</select></div>
      ${locked?'<p>Este teste já começou ou a publicação está encerrada.</p>':'<button class="btn primary" onclick="saveCalendarTrial(this)">Salvar Reels Teste</button>'}
      <p class="muted">O vídeo principal e seu horário permanecem os mesmos.</p></div></div>`;
  }catch(e){toast(e.message,'err');}
}
async function saveCalendarTrial(button){
  const separate=document.querySelector('input[name="trialMode"]:checked')?.value==='separate';
  const videoId=separate?$('#trialVideoChoice').value:null;
  if(separate&&!videoId){toast('Escolha um vídeo pronto.','warn');return;}
  actionButtonBusy(button,true,'Salvando…');
  try{await cloudFetch('?resource=calendar-trial',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({schedule_id:calendarTrialDraft.row.id,video_id:videoId})});closeModal();await syncFromBackend();calendarPage();toast('Reels Teste atualizado.','ok');}catch(e){toast(e.message,'err');}finally{actionButtonBusy(button,false);}
}
let productionTrialDraft=null;
async function openProductionTrialModal(jobId){
  try{
    const [queue,options]=await Promise.all([cloudFetch('?resource=queue'),cloudFetch('?resource=calendar-trial')]);
    const video=options.videos.find(v=>v.production_job_id===jobId);if(!video)throw new Error('Vídeo pronto indisponível.');
    productionTrialDraft={video,queue:queue.filter(s=>s.platform==='instagram'&&['scheduled','queued'].includes(s.status)&&Date.parse(s.scheduled_at)>Date.now())};
    const accounts=calendarInstagramAccounts().filter(a=>!video.platform_account_id||a.id===video.platform_account_id);
    $('#modalHost').innerHTML=`<div class="modal"><div class="modal-box"><div class="modal-head"><b>Adicionar como Reels Teste</b><button class="btn" onclick="closeModal()">Fechar</button></div><p>${esc(video.file_name)}</p><div class="formgrid"><div class="field"><label>Conta</label><select id="productionTrialAccount" onchange="updateProductionTrialPosts()">${accounts.map(a=>`<option value="${esc(a.id)}">${esc(a.account_label||'Instagram')}</option>`).join('')}</select></div><div class="field"><label>Dia</label><input id="productionTrialDay" type="date" value="${localISO(new Date())}" onchange="updateProductionTrialPosts()"></div><div class="field full"><label>Publicação principal</label><select id="productionTrialPost"></select></div></div><button class="btn primary" onclick="saveProductionTrial(this)">Associar Reels Teste</button></div></div>`;
    updateProductionTrialPosts();
  }catch(e){toast(e.message,'err');}
}
function updateProductionTrialPosts(){
  const account=$('#productionTrialAccount').value,day=$('#productionTrialDay').value;
  const rows=productionTrialDraft.queue.filter(s=>s.platform_account_id===account&&localISO(new Date(s.scheduled_at))===day);
  $('#productionTrialPost').innerHTML='<option value="">Escolha a publicação principal</option>'+rows.map(s=>`<option value="${esc(s.id)}">${new Date(s.scheduled_at).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})} — ${esc(s.videos?.file_name||'Vídeo')}</option>`).join('');
}
async function saveProductionTrial(button){
  const id=$('#productionTrialPost').value;if(!id){toast('Escolha uma publicação principal.','warn');return;}
  actionButtonBusy(button,true,'Associando…');
  try{await cloudFetch('?resource=calendar-trial',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({schedule_id:id,video_id:productionTrialDraft.video.id})});closeModal();await syncFromBackend();toast('Vídeo associado como Reels Teste.','ok');}catch(e){toast(e.message,'err');}finally{actionButtonBusy(button,false);}
}

init();
</script>
