<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><script src="/api/auth-config"></script><title>Recuperar acesso · CloudentFlow</title><style>body{margin:0;background:#080808;color:#eee;font:16px system-ui;display:grid;min-height:100vh;place-items:center}main{width:min(360px,85vw);padding:28px;border:1px solid #333;border-radius:18px}form{display:grid;gap:16px}input,button{box-sizing:border-box;width:100%;padding:13px;border:1px solid #444;border-radius:9px;background:#151515;color:white;font:inherit}button{background:white;color:black;cursor:pointer}button:disabled{opacity:.5}[hidden]{display:none!important}a{color:#ccc}p{line-height:1.5}#message{min-height:3em}</style></head><body><main><h1>Recuperar acesso</h1><p id="intro">Receba no seu email o link seguro para definir sua senha.</p><form id="recovery"><label>Email<input id="email" type="email" autocomplete="email" required></label><button>Enviar link de recuperação</button></form><form id="passwordForm" hidden><label>Nova senha<input id="password" type="password" autocomplete="new-password" minlength="8" required></label><label>Confirme a senha<input id="confirm" type="password" autocomplete="new-password" minlength="8" required></label><button>Salvar nova senha</button></form><p id="message" role="status"></p><a href="/">Voltar para o login</a></main><script>
const message=document.getElementById('message'),recovery=document.getElementById('recovery'),passwordForm=document.getElementById('passwordForm');
const params=new URLSearchParams(location.hash.slice(1));let token=params.get('access_token')||'';
const tokenHash=params.get('token_hash')||'';
history.replaceState(null,'',location.pathname);
if(tokenHash){
  recovery.hidden=true;message.textContent='Validando o link seguro…';
  fetch(window.CloudentConfig.supabaseUrl+'/auth/v1/verify',{method:'POST',headers:{apikey:window.CloudentConfig.publishableKey,'Content-Type':'application/json'},body:JSON.stringify({type:'recovery',token_hash:tokenHash})}).then(async r=>{const data=await r.json();if(!r.ok||!data.access_token)throw new Error('O link expirou ou já foi utilizado. Solicite outro link.');token=data.access_token;passwordForm.hidden=false;message.textContent='';document.getElementById('intro').textContent='Defina sua nova senha para acessar o CloudentFlow.'}).catch(e=>{recovery.hidden=false;message.textContent=e.message;});
}
if(token){recovery.hidden=true;passwordForm.hidden=false;document.getElementById('intro').textContent='Defina sua nova senha para acessar o CloudentFlow.'}
async function request(action,body){const r=await fetch('/api/auth-recovery?action='+action,{method:'POST',headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:JSON.stringify(body),cache:'no-store'});const data=await r.json();if(!r.ok)throw new Error(data.error==='rate_limited'?'Aguarde alguns minutos antes de tentar novamente.':data.error==='invalid_session'?'O link expirou. Solicite outro link de recuperação.':'Não foi possível concluir. Tente novamente em instantes.');return data;}
recovery.onsubmit=async e=>{e.preventDefault();const b=recovery.querySelector('button');b.disabled=true;try{await request('recover',{email:document.getElementById('email').value});message.textContent='Se a conta existir, você receberá um link seguro por email. Confira também o spam.'}catch(e){message.textContent=e.message}finally{b.disabled=false}};
passwordForm.onsubmit=async e=>{e.preventDefault();const b=passwordForm.querySelector('button'),password=document.getElementById('password').value;if(password!==document.getElementById('confirm').value){message.textContent='As senhas precisam ser iguais.';return}b.disabled=true;try{await request('password',{password});await request('logout',{});token='';passwordForm.reset();passwordForm.hidden=true;message.textContent='Senha definida. Volte para o login e entre com sua nova senha.'}catch(e){message.textContent=e.message}finally{b.disabled=false}};
</script></body></html>
